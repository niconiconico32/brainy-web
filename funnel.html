        async function ensurePlan() {
            if (funnelState.planId && funnelState.claimToken) {
                return { planId: funnelState.planId, claimToken: funnelState.claimToken };
            }
            const plan = buildUserPlanPayload();
            const counts = {
                tasksCount: plan.metadata.tasksCount,
                routinesCount: plan.metadata.routinesCount,
                totalSelectedCount: plan.metadata.totalSelectedCount,
                campaign: plan.metadata.campaign
            };

            if (!FUNNEL_CONFIG.enableBackend || !FUNNEL_CONFIG.createPlanUrl) {
                ensureClientPlanKey();
                const demo = {
                    planId: 'demo-' + Date.now().toString(36),
                    claimToken: 'demo-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)
                };
                setState('planId', demo.planId);
                setState('claimToken', demo.claimToken);
                track('plan_created', Object.assign({ mode: 'demo' }, counts));
                return demo;
            }

            const clientPlanKey = ensureClientPlanKey();
            track('plan_generation_start', counts);
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (FUNNEL_CONFIG.anonKey) {
                    headers['apikey'] = FUNNEL_CONFIG.anonKey;
                    headers['Authorization'] = `Bearer ${FUNNEL_CONFIG.anonKey}`;
                }
                const attempt = async (key) => {
                    const res = await fetch(FUNNEL_CONFIG.createPlanUrl, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({
                            plan: plan,
                            email: funnelState.email || null,
                            marketing_opt_in: !!funnelState.marketing_optin,
                            source: 'website',
                            campaign: plan.metadata.campaign,
                            client_plan_key: key
                        })
                    });
                    let data = null;
                    try { data = await res.json(); } catch (e) { data = null; }
                    return { res, data };
                };

                let { res, data } = await attempt(clientPlanKey);

                // Plan vencido: la clave quedó quemada en una fila expired.
                // Rotamos UNA vez (nueva fila) para no bloquear el funnel.
                if (res.status === 409 && data && data.error === 'plan_expired') {
                    resetClientPlanKey();
                    const rotatedKey = ensureClientPlanKey();
                    track('plan_key_rotated', { reason: 'plan_expired' });
                    ({ res, data } = await attempt(rotatedKey));
                }

                if (!res.ok) {
                    const code = (data && data.error) || ('http_' + res.status);
                    throw new Error('create-funnel-plan ' + code);
                }
                if (!data || !data.planId || !data.claimToken) {
                    throw new Error('create-funnel-plan response inválido');
                }
                setState('planId', data.planId);
                setState('claimToken', data.claimToken);
                setState('handoffReady', false);
                track('plan_created', counts);
                return { planId: data.planId, claimToken: data.claimToken };
            } catch (err) {
                track('plan_creation_failed', { reason: (err && err.message) || 'unknown' });
                return null;
            }
        }

        function setupMethodDemo(total) {
            const pet = document.getElementById('demoPet');
            const microEls = Array.from(document.querySelectorAll('.micro'));
            const doneSet = new Set();
            let autoplay = true;

            function sync() {
                const stage = Math.min(total, doneSet.size);
                pet.setAttribute('data-stage', String(stage));
                microEls.forEach((el, i) => {
                    el.classList.toggle('done', doneSet.has(i));
                });
                if (doneSet.size >= total) {
                    clearTimers();
                }
            }

            const timer = setInterval(() => {
                if (!autoplay) {
                    return;
                }
                for (let i = 0; i < total; i++) {
                    if (!doneSet.has(i)) {
                        doneSet.add(i);
                        sync();
                        return;
                    }
                }
            }, 1000);
            stepTimers.push(timer);

            microEls.forEach((el, i) => {
                el.addEventListener('click', () => {
                    autoplay = false;
                    clearInterval(timer);
                    doneSet.add(i);
                    sync();
                });
            });

            sync();
        }

                { icon: '🐣', title: localizedText('Compañeros que evolucionan contigo', 'Companions that evolve with you'), desc: eggCount === 1 ? localizedText('Tu huevo crece con cada paso y te espera cada día.', 'Your egg grows with every step and waits for you each day.') : localizedText(`Cada rutina tiene su huevo (${eggCount}) que crece con cada paso.`, `Each routine has its own egg (${eggCount}) that grows with every step.`) }
            ];
            const benefitsHtml = benefits.map((b) => `
                <div class="presell-benefit">
                    <span class="presell-icon">${b.icon}</span>
                    <div class="presell-body">
                        <strong>${b.title}</strong>
                        <p>${b.desc}</p>
                    </div>
                </div>`).join('');

            document.getElementById('funnelRoot').innerHTML = `
                ${backButtonHtml()}
                ${cardOpen()}
                    ${headHtml(step)}
                    <div class="presell-box">
                        <div class="presell-personalized">
                        <span>${localizedText('Basado en tus respuestas', 'Based on your answers')}</span>
                            <p>${objectionCopy}</p>
                        </div>
                        ${benefitsHtml}
                    </div>
                    <div class="actions">
                        <button class="btn btn-dopamine" type="button" id="nextBtn">${step.cta}</button>
                        <p class="field-note">${localizedText('Sin cargos ocultos. Puedes usarlo y decidir después.', 'No hidden charges. You can try it and decide later.')}</p>
                    </div>
                </article>`;

            document.getElementById('nextBtn').addEventListener('click', function openPresell() {
                if (advancing) {
                    return;
                }
                this.disabled = true;
                this.textContent = localizedText('Preparando tu plan…', 'Preparing your plan…');
                ensurePlan().then(async (result) => {
                    if (!result && FUNNEL_CONFIG.enableBackend) {
                        this.disabled = false;
                        this.textContent = step.cta;
                        showToast(localizedText('No pudimos crear tu plan por ahora. Inténtalo de nuevo.', 'We could not create your plan right now. Try again.'), 3200);
                        track('create_plan_failed', { reason: 'user_retry_available' });
                        return;
                    }
                    if (!FUNNEL_CONFIG.enableBackend) {
                        this.disabled = false;
                        this.textContent = step.cta;
                        showToast(localizedText('El checkout identificado requiere el backend activo.', 'Identified checkout requires the backend to be active.'), 3200);
                        return;
                    }
                    const identity = await prepareIdentifiedAccount();
                    if (identity.ok) {
                        goNext();
                    } else {
                        this.disabled = false;
                        this.textContent = step.cta;
                        showToast(localizedText('No pudimos preparar tu cuenta. Inténtalo nuevamente.', 'We could not prepare your account. Try again.'), 3200);
                        track('checkout_blocked_identity', { reason: identity.error });
                    }
                }).catch(() => {
                    this.disabled = false;
                    this.textContent = step.cta;
                    showToast(localizedText('No pudimos preparar tu cuenta. Inténtalo nuevamente.', 'We could not prepare your account. Try again.'), 3200);
                    track('checkout_blocked_identity', { reason: 'prepare_network_error' });
                });
            });
        }

        function renderPaywall(step) {
            const rcConfig = revenuecatConfig();
            const svc = window.BrainyRevenueCat || null;
            const root = document.getElementById('funnelRoot');
            let paywallData = null;
            let purchaseLock = false;

            track('paywall_view', {
                offeringId: rcConfig.offeringId,
                tasksCount: funnelState.selectedTasks.length,
                routinesCount: funnelState.selectedRoutines.length,
                platform: isMobileDevice() ? 'mobile' : 'desktop',
                configured: !!rcConfig.apiKey && !!svc && svc.isAvailable()
            });

            function renderStatus(text) {
                root.innerHTML = `
                    ${backButtonHtml()}
                    ${cardOpen()}
                        ${headHtml(step)}
                        <div class="paywall-status"><span class="spinner"></span>${text}</div>
                    </article>`;
            }

            function renderRecovery(copy, onRetry) {
                root.innerHTML = `
                    ${backButtonHtml()}
                    ${cardOpen()}
                        ${headHtml(step)}
                        <div class="paywall-recovery">
                            <p>${copy}</p>
                            <div class="actions">
                            <button class="btn btn-dopamine" type="button" id="retryPaywallBtn">${localizedText('Intentar nuevamente', 'Try again')}</button>
                            </div>
                        </div>
                    </article>`;
                document.getElementById('retryPaywallBtn').addEventListener('click', onRetry || (() => initPaywall()));
            }

            async function configureIdentifiedRevenueCat(identity, rcConfig) {
                if (!svc || !svc.isAvailable() || !rcConfig.apiKey || !identity || !identity.userId) {
                    throw new Error('revenuecat_identity_not_ready');
                }
                const configured = svc.configure({ apiKey: rcConfig.apiKey, appUserId: identity.userId });
                if (!configured) {
                    throw new Error('revenuecat_not_configured');
                }
                return configured;
            }

            async function currentEntitlementIsActive() {
                if (!svc || typeof svc.getCustomerInfo !== 'function') {
                    return false;
                }
                const customerInfo = await svc.getCustomerInfo();
                return svc.isEntitledTo(customerInfo, rcConfig.entitlementId);
            }

            function completeIdentifiedHandoffWithoutPurchase() {
                setState('entitlementConfirmed', true);
                setState('redemptionPersisted', false);
                setState('pendingRedemptionUrl', null);
                setState('handoffReady', true);
                track('handoff_ready', {
                    platform: isMobileDevice() ? 'mobile' : 'desktop',
                    existingEntitlement: true
                });
                goNext();
            }

            async function initPaywall() {
                if (funnelState.purchaseCompleted) {
                    if (funnelState.handoffReady) {
                        goNext();
                    } else if (funnelState.pendingRedemptionUrl) {
                        // Ya se cobró pero faltó persistir: reintentar SOLO
                        // set-funnel-redemption (nunca purchase()).
                        renderRecovery(
                            localizedText('Tu suscripción fue activada, pero no pudimos confirmar el guardado de tu plan. No se te volvió a cobrar: toca para reintentar.', 'Your subscription is active, but we could not confirm that your plan was saved. You were not charged again: tap to retry.'),
                            () => retryPendingRedemption()
                        );
                    } else {
                        const existingIdentity = await prepareIdentifiedAccount();
                        try {
                            await configureIdentifiedRevenueCat(existingIdentity, rcConfig);
                            if (!existingIdentity.ok || !(await currentEntitlementIsActive())) {
                                throw new Error('existing_entitlement_not_confirmed');
                            }
                            completeIdentifiedHandoffWithoutPurchase();
                        } catch (error) {
                            track('handoff_recovery_required', { reason: 'entitlement_not_confirmed' });
                            renderRecovery(
                                localizedText('Tu suscripción no se volvió a cobrar. No pudimos confirmar el acceso de esta cuenta; inténtalo nuevamente.', 'You were not charged again. We could not confirm this account’s access; try again.'),
                                () => initPaywall()
                            );
                        }
                    }
                    return;
                }
                if (!funnelState.planId || !funnelState.claimToken) {
                    renderStatus(localizedText('Preparando tu plan…', 'Preparing your plan…'));
                    const plan = await ensurePlan();
                    if (!plan) {
                        track('purchase_failed', { reason: 'no_plan' });
                        renderRecovery(localizedText('No pudimos preparar tu plan por ahora. Inténtalo de nuevo.', 'We could not prepare your plan right now. Try again.'));
                        return;
                    }
                }
                if (!hasRealPlan()) {
                    track('checkout_blocked_no_plan', {
                        reason: !FUNNEL_CONFIG.enableBackend ? 'backend_disabled' : 'no_real_plan',
                        tasksCount: funnelState.selectedTasks.length,
                        routinesCount: funnelState.selectedRoutines.length
                    });
                }
                const identity = await prepareIdentifiedAccount();
                if (!identity.ok) {
                    track('checkout_blocked_identity', { reason: identity.error });
                    renderRecovery(localizedText('No pudimos preparar tu cuenta. Inténtalo nuevamente.', 'We could not prepare your account. Try again.'));
                    return;
                }
                let offering = null;
                try {
                    await configureIdentifiedRevenueCat(identity, rcConfig);
                    if (identity.alreadyPro) {
                        if (!(await currentEntitlementIsActive())) {
                            throw new Error('already_pro_entitlement_not_confirmed');
                        }
                        completeIdentifiedHandoffWithoutPurchase();
                        return;
                    }
                    renderStatus(localizedText('Buscando tu plan de pago…', 'Looking for your payment plan…'));
                    offering = await svc.getOfferings(rcConfig.offeringId);
                } catch (e) {
                    const reason = identity.alreadyPro ? 'already_pro_not_confirmed' : 'rc_not_configured';
                    track('checkout_blocked_identity', { reason: reason });
                    renderRecovery(identity.alreadyPro
                        ? localizedText('Tu cuenta figura como Pro, pero no pudimos confirmar ese acceso. No se inició ningún cobro.', 'Your account appears to be Pro, but we could not confirm access. No charge was started.')
                        : localizedText('El pago web no está disponible en este momento. Inténtalo de nuevo en unos minutos.', 'Web payment is not available right now. Try again in a few minutes.'));
                    return;
                }
                if (!offering) {
                    track('purchase_failed', { reason: 'no_offering' });
                    renderRecovery(localizedText('Todavía no hay planes disponibles. Inténtalo de nuevo en unos minutos.', 'No plans are available yet. Try again in a few minutes.'));
                    return;
                }
                const packages = [];
                if (offering.annual) {
                    packages.push({ pkg: offering.annual, kind: 'annual' });
                }
                if (offering.monthly) {
                    packages.push({ pkg: offering.monthly, kind: 'monthly' });
                }
                if (packages.length === 0) {
                    track('purchase_failed', { reason: 'no_packages' });
                    renderRecovery(localizedText('Todavía no hay planes disponibles. Inténtalo de nuevo en unos minutos.', 'No plans are available yet. Try again in a few minutes.'));
                    return;
                }
                let selectedId = funnelState.selectedPackageId;
                if (!packages.some((entry) => entry.pkg.identifier === selectedId)) {
                    const preferred = packages.find((entry) => entry.kind === 'annual') || packages[0];
                    selectedId = preferred.pkg.identifier;
                }
                const currency = (packages[0].pkg.webBillingProduct &&
                    packages[0].pkg.webBillingProduct.price) ? packages[0].pkg.webBillingProduct.price.currency : null;

                paywallData = { offering: offering, packages: packages, selectedId: selectedId, currency: currency };
                renderPaywallCards();
            }

            function periodLabel(pkg) {
                const product = pkg.webBillingProduct || {};
                if (product.period && product.period.unit) {
                    if (product.period.unit === 'year') {
                        return product.period.number > 1 ? localizedText(`cada ${product.period.number} años`, `every ${product.period.number} years`) : localizedText('por año', 'per year');
                    }
                    if (product.period.unit === 'month') {
                        return product.period.number > 1 ? localizedText(`cada ${product.period.number} meses`, `every ${product.period.number} months`) : localizedText('por mes', 'per month');
                    }
                    if (product.period.unit === 'week') {
                        return localizedText('por semana', 'per week');
                    }
                    if (product.period.unit === 'day') {
                        return localizedText('por día', 'per day');
                    }
                }
                return '';
            }

            function priceText(pkg) {
                const price = pkg.webBillingProduct && pkg.webBillingProduct.price ? pkg.webBillingProduct.price : null;
                if (!price) {
                    return '';
                }
                if (price.formattedPrice) {
                    return price.formattedPrice;
                }
                const amount = (price.amountMicros && price.amountMicros > 0) ? price.amountMicros / 1e6 : (price.amount || 0) / 100;
                return `${amount} ${price.currency || ''}`.trim();
            }

            function renderPaywallCards() {
                const data = paywallData;
                const checkoutAllowed = hasRealPlan();
                const taskLabel = `${funnelState.selectedTasks.length} ${funnelState.selectedTasks.length === 1 ? ui('task') : ui('tasks')}`;
                const routineLabel = `${funnelState.selectedRoutines.length} ${funnelState.selectedRoutines.length === 1 ? ui('routine') : ui('routines')}`;
                const eggLabel = `${assignedRoutines().length} ${assignedRoutines().length === 1 ? localizedText('compañero', 'companion') : localizedText('compañeros', 'companions')}`;
                const chips = `<span class="paywall-chip">${taskLabel}</span><span class="paywall-chip">${routineLabel}</span><span class="paywall-chip">${eggLabel}</span>`;

                const cardsHtml = data.packages.map((entry) => {
                    const sel = entry.pkg.identifier === data.selectedId;
                    const badge = entry.kind === 'annual' ? `<span class="plan-badge">${localizedText('Recomendado', 'Recommended')}</span>` : '';
                    const productTitle = entry.pkg.webBillingProduct && entry.pkg.webBillingProduct.title ? ` · ${entry.pkg.webBillingProduct.title}` : '';
                    return `
                        <button class="plan-card ${sel ? 'selected' : ''}" type="button" data-pkg="${entry.pkg.identifier}">
                            <span class="plan-radio ${sel ? 'hl' : ''}"></span>
                            <span class="plan-info">
                                <strong>${entry.kind === 'annual' ? localizedText('Plan anual', 'Annual plan') : localizedText('Plan mensual', 'Monthly plan')}${badge}</strong>
                                <span>${periodLabel(entry.pkg)}${productTitle}</span>
                            </span>
                            <span class="plan-price">
                                <strong>${priceText(entry.pkg)}</strong>
                                <span>${periodLabel(entry.pkg)}</span>
                            </span>
                        </button>`;
                }).join('');

                root.innerHTML = `
                    ${backButtonHtml()}
                    ${cardOpen()}
                        ${headHtml(step)}
                        <div class="paywall-summary">${chips}</div>
                        <div class="plan-cards">${cardsHtml}</div>
                         <p class="paywall-note">${rcConfig.termsUrl ? localizedText('Al continuar aceptas los términos de Brainy. Puedes cancelar en cualquier momento.', 'By continuing, you accept Brainy’s terms. You can cancel at any time.') : localizedText('Puedes cancelar en cualquier momento desde tu cuenta.', 'You can cancel at any time from your account.')}</p>
                        <div class="actions">
                            ${checkoutAllowed
                                ? `<button class="btn btn-dopamine" type="button" id="purchaseBtn">${localizedText('Activar mi plan →', 'Activate my plan →')}</button>`
                                : `<button class="btn btn-dopamine" type="button" id="purchaseBtn" disabled>${localizedText('Checkout no disponible en modo demo', 'Checkout unavailable in demo mode')}</button><p class="field-note">${localizedText('Modo demo: no se puede cobrar sin un plan real en el backend.', 'Demo mode: payment is unavailable without a real backend plan.')}</p>`}
                        </div>
                    </article>`;

                document.querySelectorAll('.plan-card').forEach((card) => {
                    card.addEventListener('click', () => {
                        paywallData.selectedId = card.getAttribute('data-pkg');
                        setState('selectedPackageId', paywallData.selectedId);
                        const entry = data.packages.find((p) => p.pkg.identifier === paywallData.selectedId);
                        if (entry) {
                            track('package_selected', {
                                packageId: entry.pkg.identifier,
                                offeringId: data.offering.identifier,
                                currency: data.currency,
                                packageType: entry.kind
                            });
                        }
                        renderPaywallCards();
                    });
                });

                if (checkoutAllowed) {
                    document.getElementById('purchaseBtn').addEventListener('click', startCheckout);
                }
            }

            async function startCheckout() {
                if (purchaseLock || !paywallData) {
                    return;
                }
                const data = paywallData;
                const entry = data.packages.find((p) => p.pkg.identifier === data.selectedId);
                if (!entry) {
                    return;
                }
                if (!hasRealPlan()) {
                    track('checkout_blocked_no_plan', {
                        reason: !FUNNEL_CONFIG.enableBackend ? 'backend_disabled' : 'no_real_plan'
                    });
                    return;
                }
                purchaseLock = true;
                const btn = document.getElementById('purchaseBtn');
                btn.disabled = true;
                btn.textContent = 'Preparando pago…';
                track('checkout_start', {
                    packageId: entry.pkg.identifier,
                    offeringId: data.offering.identifier,
                    currency: data.currency,
                    packageType: entry.kind,
                    platform: isMobileDevice() ? 'mobile' : 'desktop'
                });
                let result = null;
                let err = null;
                let purchaseTimer = null;
                try {
                    result = await Promise.race([
                        svc.purchase({
                            rcPackage: entry.pkg,
                            planId: funnelState.planId,
                            customerEmail: funnelState.email || undefined,
                            selectedLocale: currentLocale(),
                            defaultLocale: currentLocale(),
                            termsAndConditionsUrl: rcConfig.termsUrl || undefined
                        }),
                        new Promise(function (resolve, reject) {
                            purchaseTimer = setTimeout(function () {
                                var t = new Error('purchase_timeout');
                                t.isTimeout = true;
                                reject(t);
                            }, 120000);
                        })
                    ]);
                } catch (e) {
                    err = e;
                } finally {
                    if (purchaseTimer) {
                        clearTimeout(purchaseTimer);
                        purchaseTimer = null;
                    }
                }
                if (err) {
                    purchaseLock = false;
                    if (err.isTimeout) {
                        track('purchase_failed', { reason: 'timeout' });
                        btn.disabled = false;
                        btn.textContent = localizedText('Activar mi plan →', 'Activate my plan →');
                        try { var ovl = document.getElementById('rcb-ui-pw-root'); if (ovl && ovl.parentNode) { ovl.parentNode.removeChild(ovl); } } catch (e) {}
                        renderRecovery(localizedText('La confirmación del pago está tardando demasiado. No se te volvió a cobrar: revisa tu correo e inténtalo de nuevo.', 'Payment confirmation is taking too long. You were not charged again: check your email and try again.'));
                        setTimeout(function () {
                            var still = document.getElementById('rcb-ui-pw-root');
                            if (still) { window.location.reload(); }
                        }, 5000);
                        return;
                    }
                    const cls = svc.classifyError(err);
                    if (cls.isCancel) {
                        track('checkout_cancelled', { packageId: entry.pkg.identifier });
                        btn.disabled = false;
                        btn.textContent = 'Activar mi plan →';
                        return;
                    }
                    track('purchase_failed', { code: cls.code, reason: cls.kind });
                    btn.disabled = false;
                    btn.textContent = localizedText('Activar mi plan →', 'Activate my plan →');
                    showToast(localizedText('Hubo un problema al iniciar el pago. Inténtalo nuevamente.', 'There was a problem starting payment. Try again.'), 3200);
                    return;
                }
                const isEntitled = svc.isEntitledTo(result.customerInfo, rcConfig.entitlementId);
                const redeemUrl = svc.primaryRedemptionUrlOf(result);
                if (!isEntitled) {
                    purchaseLock = false;
                    track('purchase_failed', { reason: 'entitlement_inactive' });
                    renderRecovery(localizedText('No pudimos confirmar tu suscripción todavía. No se te volvió a cobrar: revisa tu correo e inténtalo de nuevo.', 'We could not confirm your subscription yet. You were not charged again: check your email and try again.'));
                    return;
                }
                // REVENUECAT CONFIRMÓ LA COMPRA. La persistencia server-side del
                // redemption URL es un paso aparte: la compra y el guardado del
                // plan quedan registrados de forma independiente.
                setState('purchaseCompleted', true);
                setState('entitlementConfirmed', true);
                setState('redemptionPersisted', false);
                setState('handoffReady', false);
                track('purchase_success', {
                    packageId: entry.pkg.identifier,
                    offeringId: data.offering.identifier,
                    currency: data.currency,
                    packageType: entry.kind,
                    entitlementActive: true,
                    redemptionAvailable: !!redeemUrl
                });
                if (!redeemUrl) {
                    // The identified RevenueCat user already owns the entitlement.
                    // A redemption URL is optional for this path: the mobile app
                    // logs in with the same Supabase UUID and can finish recovery.
                    purchaseLock = false;
                    setState('pendingRedemptionUrl', null);
                    setState('handoffReady', true);
                    track('handoff_ready', {
                        packageId: entry.pkg.identifier,
                        offeringId: data.offering.identifier,
                        platform: isMobileDevice() ? 'mobile' : 'desktop'
                    });
                    goNext();
                    return;
                }
                setState('pendingRedemptionUrl', redeemUrl);
                btn.disabled = true;
                btn.textContent = 'Guardando tu plan…';
                const persisted = await persistRedemptionUrl(funnelState.planId, funnelState.claimToken, redeemUrl);
                if (persisted.ok) {
                    setState('redemptionPersisted', true);
                    setState('handoffReady', true);
                    track('redemption_persisted', { status: persisted.status });
                    track('handoff_ready', {
                        packageId: entry.pkg.identifier,
                        offeringId: data.offering.identifier,
                        platform: isMobileDevice() ? 'mobile' : 'desktop'
                    });
                    goNext();
                    return;
                }
                // Compra OK pero persistencia falló: recovery que reintenta SOLO
                // set-funnel-redemption. NUNCA se vuelve a ejecutar purchase().
                purchaseLock = false;
                track('redemption_persist_failed', { reason: persisted.reason });
                track('handoff_recovery_required', {
                    packageId: entry.pkg.identifier,
                    offeringId: data.offering.identifier,
                    platform: isMobileDevice() ? 'mobile' : 'desktop'
                });
                    renderRecovery(
                    localizedText('Tu suscripción fue activada, pero no pudimos guardar tu plan en el servidor. No se te volvió a cobrar: toca para reintentarlo.', 'Your subscription is active, but we could not save your plan on the server. You were not charged again: tap to retry.'),
                    () => retryPendingRedemption()
                );
            }

            initPaywall();
        }

        function renderSuccess(step) {
            const platform = isMobileDevice() ? 'mobile' : 'desktop';
            const redeemUrl = funnelState.pendingRedemptionUrl || null;
            const existingPro = !!funnelState.alreadyPro;
            const entitlementConfirmed = !!funnelState.entitlementConfirmed ||
                (!!funnelState.purchaseCompleted && !!redeemUrl && !!funnelState.redemptionPersisted);
            const ready = (existingPro || (!!funnelState.purchaseCompleted && entitlementConfirmed)) &&
                !!funnelState.handoffReady && hasRealPlan() &&
                (!!redeemUrl ? !!funnelState.redemptionPersisted : true);

            if (!ready) {
                track('handoff_recovery_required', {
                    platform: platform,
                    entitlementActive: !!funnelState.purchaseCompleted,
                    redemptionAvailable: !!redeemUrl,
                    persisted: !!funnelState.redemptionPersisted
                });
                // Recovery que reintenta SOLO la persistencia (nunca purchase()).
                const retry = (!!redeemUrl && hasRealPlan())
                    ? () => retryPendingRedemption()
                    : () => window.location.reload();
                document.getElementById('funnelRoot').innerHTML = `
                    ${cardOpen()}
                        ${headHtml({ ...step, headline: existingPro ? localizedText('Tu cuenta ya está lista', 'Your account is ready') : step.headline })}
                        <div class="paywall-recovery">
                            <p>${redeemUrl
                                ? localizedText('Tu suscripción fue activada, pero no pudimos confirmar el guardado de tu plan. No se te volvió a cobrar: toca para reintentar.', 'Your subscription is active, but we could not confirm that your plan was saved. You were not charged again: tap to retry.')
                                : localizedText('No pudimos confirmar el acceso de esta cuenta. No se inició ningún cobro nuevo; inténtalo nuevamente.', 'We could not confirm this account’s access. No new charge was started; try again.')}</p>
                            <div class="actions">
                                <button class="btn btn-dopamine" type="button" id="retryHandoffBtn">${localizedText('Reintentar', 'Retry')}</button>
                            </div>
                        </div>
                    </article>`;
                const retryBtn = document.getElementById('retryHandoffBtn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', retry);
                }
                return;
            }

            track('purchase_handoff_view', {
                platform: platform,
                tasksCount: funnelState.selectedTasks.length,
                routinesCount: funnelState.selectedRoutines.length
            });
            track('handoff_ready', {
                platform: platform,
                campaign: 'brainy_onboarding_v1'
            });
            ensurePlan();
            window.brainyUserPlanPayload = buildUserPlanPayload();

            const link = buildClaimLink(redeemUrl);
            const storesHtml = storeButtonsHtml();
            const recoveryNote = !redeemUrl && funnelState.planId
                ? `<p class="handoff-hint">${existingPro ? localizedText('Abre la app para continuar con tu cuenta existente.', 'Open the app to continue with your existing account.') : localizedText('Abre la app para completar la activación con tu cuenta identificada.', 'Open the app to finish activation with your identified account.')}</p>`
                : '';
            const checks = (existingPro
                ? [localizedText('Cuenta existente detectada', 'Existing account detected'), localizedText('Tu plan está guardado', 'Your plan is saved'), localizedText('Continúa en la app para finalizar', 'Continue in the app to finish')]
                : redeemUrl
                    ? [localizedText('Suscripción activada', 'Subscription active'), localizedText('Tu plan está guardado', 'Your plan is saved'), localizedText('Tareas y rutinas preparadas', 'Tasks and routines prepared')]
                    : [localizedText('Compra recibida por RevenueCat', 'Purchase received by RevenueCat'), localizedText('Tu plan está guardado', 'Your plan is saved'), localizedText('Continúa en la app para completar la activación', 'Continue in the app to finish activation')]
            ).map((c) => `<li><span class="ok">✓</span>${c}</li>`).join('');

            let mainArea;
            if (isMobileDevice()) {
                mainArea = `
                    <div class="handoff-main">
                        <a class="btn btn-dopamine handoff-open" href="${link}" id="openAppBtn">Abrir Brainy →</a>
                         <p class="handoff-hint">${localizedText('Si no se abre automáticamente, toca el botón de tu tienda.', 'If it does not open automatically, tap your store button.')}</p>
                        <div class="handoff-stores">${storesHtml}</div>
                         <div class="handoff-note" id="handoffNote" hidden>${localizedText('¿No se abrió? Instala Brainy y vuelve a tocar el botón.', 'Did it not open? Install Brainy and tap the button again.')}</div>
                    </div>`;
            } else {
                mainArea = `
                    <div class="handoff-main">
                         <p class="handoff-desk-title">${localizedText('Continúa en tu teléfono', 'Continue on your phone')}</p>
                        <ol class="handoff-steps">
                             <li>${localizedText('Instala Brainy (App Store o Google Play).', 'Install Brainy (App Store or Google Play).')}</li>
                             <li>${localizedText('Escanea el código con la cámara de tu celular.', 'Scan the code with your phone camera.')}</li>
                             <li>${localizedText('Tu plan y tu suscripción estarán esperándote.', 'Your plan and subscription will be waiting for you.')}</li>
                        </ol>
                        ${qrSvgHtml(link)}
                         <button class="btn btn-ghost handoff-copy" type="button" id="copyLinkBtn" data-link="${link}">${localizedText('Copiar enlace', 'Copy link')}</button>
                         <p class="handoff-hint">${localizedText('Ábrelo en el navegador del celular y Brainy cargará tu plan.', 'Open it in your phone browser and Brainy will load your plan.')}</p>
                        <div class="handoff-stores">${storesHtml}</div>
                    </div>`;
            }

            document.getElementById('funnelRoot').innerHTML = `
                ${cardOpen()}
                    ${headHtml({ ...step, headline: existingPro ? 'Tu cuenta ya está lista' : (redeemUrl ? step.headline : 'Tu pago está listo para continuar') })}
                    <ul class="success-checks">${checks}</ul>
                    ${recoveryNote}
                    <div class="handoff-wrap">
                        <div class="handoff-check">✓</div>
                        ${mainArea}
                    </div>
                </article>`;

            const openBtn = document.getElementById('openAppBtn');
            if (openBtn) {
                openBtn.addEventListener('click', (event) => {
                    event.preventDefault();
                    track('purchase_handoff_click', { platform: 'mobile', destination: 'app' });
                    window.location.href = buildClaimLink(redeemUrl);
                    const open = document.getElementById('handoffNote');
                    setTimeout(() => {
                        if (open) {
                            open.hidden = false;
                        }
                    }, 1200);
                });
            }

            const copyBtn = document.getElementById('copyLinkBtn');
            if (copyBtn) {
                copyBtn.addEventListener('click', () => {
                    const target = buildClaimLink(redeemUrl);
                    const done = () => {
                        copyBtn.textContent = localizedText('¡Copiado!', 'Copied!');
                        setTimeout(() => { copyBtn.textContent = localizedText('Copiar enlace', 'Copy link'); }, 2200);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(target).then(done).catch(() => done());
                    } else {
                        done();
                    }
                    track('purchase_handoff_click', { platform: 'desktop', destination: 'copy_link' });
                });
            }
        }

        function renderHandoff(step) {
            track('handoff_view', { platform: isMobileDevice() ? 'mobile' : 'desktop' });
            ensurePlan();
            const link = buildClaimLink();
            const storesHtml = storeButtonsHtml();
            window.brainyUserPlanPayload = buildUserPlanPayload();

            let mainArea;
            if (isMobileDevice()) {
                mainArea = `
                    <div class="handoff-main">
                        <a class="btn btn-dopamine handoff-open" href="${link}" id="openAppBtn">${step.cta} →</a>
                        <p class="handoff-hint">${localizedText('Si no se abre automáticamente, toca el botón de tu tienda.', 'If it does not open automatically, tap your store button.')}</p>
                        <div class="handoff-stores">${storesHtml}</div>
                        <div class="handoff-note" id="handoffNote" hidden>${localizedText('¿No se abrió? Instala Brainy y vuelve a tocar el botón.', 'Did it not open? Install Brainy and tap the button again.')}</div>
                    </div>`;
            } else {
                const copyLink = funnelState.claimToken && FUNNEL_CONFIG.appDeepLinkScheme
                    ? buildClaimLink()
                    : null;
                mainArea = `
                    <div class="handoff-main">
                        <p class="handoff-desk-title">${localizedText('Continúa en tu teléfono', 'Continue on your phone')}</p>
                        <ol class="handoff-steps">
                            <li>${localizedText('Instala Brainy (App Store o Google Play).', 'Install Brainy (App Store or Google Play).')}</li>
                            <li>${localizedText('Toca el botón «Abrir en el celular».', 'Tap the “Open on phone” button.')}</li>
                            <li>${localizedText('Tu plan estará esperándote con tu token de activación.', 'Your plan will be waiting with your activation token.')}</li>
                        </ol>
                        ${copyLink ? `
                             <button class="btn btn-ghost handoff-copy" type="button" id="copyLinkBtn" data-link="${copyLink}">${localizedText('Copiar enlace de activación', 'Copy activation link')}</button>
                             <p class="field-note">${localizedText('Ábrelo en el navegador del celular y Brainy cargará tu plan.', 'Open it in your phone browser and Brainy will load your plan.')}</p>` : ''}
                        <div class="handoff-stores">${storesHtml}</div>
                    </div>`;
            }

            document.getElementById('funnelRoot').innerHTML = `
                ${cardOpen()}
                    ${headHtml(step)}
                    <div class="handoff-wrap">
                        <div class="handoff-check">✓</div>
                        ${mainArea}
                    </div>
                </article>`;

            const openBtn = document.getElementById('openAppBtn');
            if (openBtn) {
                openBtn.addEventListener('click', (event) => {
                    event.preventDefault();
                    track('handoff_click', { platform: 'mobile', destination: 'app' });
                    const open = document.getElementById('handoffNote');
                    window.location.href = buildClaimLink();
                    setTimeout(() => {
                        open.hidden = false;
                    }, 1200);
                });
            }

            const copyBtn = document.getElementById('copyLinkBtn');
            if (copyBtn) {
                copyBtn.addEventListener('click', () => {
                    const target = buildClaimLink();
                    const done = () => {
                        copyBtn.textContent = localizedText('¡Copiado!', 'Copied!');
                        setTimeout(() => { copyBtn.textContent = localizedText('Copiar enlace de activación', 'Copy activation link'); }, 2200);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(target).then(done).catch(() => done());
                    } else {
                        done();
                    }
                    track('handoff_click', { platform: 'desktop', destination: 'copy_link' });
                });
            }
        }

        function isMobileDevice() {
            return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        }

        function todayLabel() {
            const months = currentLocale() === 'en'
                ? ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
                : ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            const d = new Date();
            return `${d.getDate()} ${months[d.getMonth()]}`;
        }

        function renderPicker(step) {
            const data = step.source === 'tasks' ? tasksData : routinesData;
            const key = step.key;
            const min = step.min || 1;
            const max = step.max;
            const selected = funnelState[key];

            let categories = [];
            if (step.source === 'tasks') {
                categories = (data && data.categories || []).map((cat) => ({
                    ...cat,
                    items: (cat.tasks || []).map((task) => makeSelectedTask(task, cat))
                })).filter((cat) => cat.items.length > 0);
            } else {
                categories = routinesByCategory().map((cat) => ({
                    ...cat,
                    items: cat.items.map((routine) => makeSelectedRoutine(routine, cat))
                }));
            }

            const cardsHtml = categories.map((cat) => `
                    <section class="picker-cat">
                        <div class="cat-head"><span class="cat-emoji">${cat.emoji}</span><span>${(CATEGORY_COPY[cat.id] && CATEGORY_COPY[cat.id][currentLocale()]) || cat.label}</span></div>
                        <div class="picker-list">
                            ${cat.items.map((item) => {
                                const isSel = selected.some((s) => s.id === item.id);
                                return `
                                    <article class="pick-card ${isSel ? 'selected' : ''}" data-id="${item.id}">
                                        <div class="pick-head">
                                            <button class="pick-expand" type="button" aria-expanded="false" data-expand="${item.id}">
                                                ${item.emoji ? `<span class="pick-emoji">${item.emoji}</span>` : ''}
                                                <span class="pick-body">
                                                    <strong>${item.title}</strong>
                                                 <span class="pick-meta">${item.subtasks.length} ${ui('steps')} · ${ui('tapToSee')}</span>
                                                </span>
                                                <span class="pick-chev">▾</span>
                                            </button>
                                                <button class="pick-check" type="button" data-select="${item.id}" aria-label="${ui('select')} ${item.title}">✓</button>
                                        </div>
                                        <div class="pick-steps" hidden>
                                            <ol>${item.subtasks.map((s) => `<li>${s.title}</li>`).join('')}</ol>
                                        </div>
                                    </article>`;
                            }).join('')}
                        </div>
                    </section>`).join('');

            const dataError = loadDataError || !data
                ? `<div class="data-error">${ui('noData')}</div>`
                : '';

            document.getElementById('funnelRoot').innerHTML = `
                ${backButtonHtml()}
                ${cardOpen()}
                    ${headHtml(step)}
                    ${dataError}
                    <div class="picker-wrap">${cardsHtml}</div>
                    <p class="pick-counter">${ui('selected')} <strong id="pickCount">${selected.length}</strong> · ${ui('minimum')} ${min}, ${ui('upTo')} ${max} ${step.source === 'tasks' ? ui('tasks') : ui('routines')}</p>
                    <div class="actions">
                        <button class="btn btn-dopamine" type="button" id="nextBtn" ${selected.length >= min ? '' : 'disabled'}>${ui('next')}</button>
                    </div>
                </article>`;

            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('pickCount');

            function refreshUI() {
                const sel = funnelState[key];
                counter.textContent = String(sel.length);
                document.querySelectorAll('.pick-card').forEach((card) => {
                    const id = card.dataset.id;
                    const isSel = sel.some((s) => s.id === id);
                    card.classList.toggle('selected', isSel);
                });
                nextBtn.disabled = sel.length < min;
            }

            document.querySelectorAll('[data-expand]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const card = btn.closest('.pick-card');
                    const steps = card.querySelector('.pick-steps');
                    const open = steps.hidden;
                    steps.hidden = !open;
                    card.classList.toggle('open', open);
                    btn.setAttribute('aria-expanded', String(open));
                });
            });

            document.querySelectorAll('[data-select]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.select;
                    const item = categories.flatMap((c) => c.items).find((i) => (i.id || i.templateId) === id);
                    if (!item) {
                        return;
                    }
                    const pos = funnelState[key].findIndex((s) => (s.id || s.templateId) === id);
                    if (pos > -1) {
                        const fresh = funnelState[key].slice();
                        fresh.splice(pos, 1);
                        funnelState[key] = fresh;
                        track(step.source === 'tasks' ? 'task_selected' : 'routine_selected', { count: fresh.length, templateId: id });
                    } else {
                        if (funnelState[key].length >= max) {
                            showToast(ui('maxOnly', { max }), 2600);
                            return;
                        }
                        funnelState[key] = funnelState[key].concat([item]);
                        track(step.source === 'tasks' ? 'task_selected' : 'routine_selected', { count: funnelState[key].length, templateId: id });
                    }
                    persistState();
                    refreshUI();
                    updateProgress();
                });
            });

            nextBtn.addEventListener('click', () => {
                if (advancing) {
                    return;
                }
                track(step.source === 'tasks' ? 'tasks_complete' : 'routines_complete', {
                    count: funnelState[key].length
                });
                goNext();
            });
        }

        function renderPlanSummary(step) {
            track('plan_summary_view', { tasksCount: funnelState.selectedTasks.length, routinesCount: funnelState.selectedRoutines.length });
            const tasks = funnelState.selectedTasks;
            const routines = funnelState.selectedRoutines;

            const taskRows = tasks.map((item) => `
                    <div class="plan-row">
                        <span class="plan-emoji">${item.emoji || categoryMeta(item.category).emoji}</span>
                        <span class="plan-name">${item.title}</span>
                        <span class="plan-meta">${(item.subtasks || []).length} ${ui('steps')}</span>
                    </div>`).join('') || `<div class="data-error">${ui('noTasks')}</div>`;

            const routineRows = routines.map((item, i) => {
                const egg = eggForRoutine(i);
                return `
                    <div class="plan-row">
                        <span class="plan-egg" style="background: radial-gradient(circle at 35% 28%, #ffffff 12%, ${egg.color} 58%, rgba(36,18,63,0.18) 135%);">${egg.emoji}</span>
                        <span class="plan-name">${egg.name} <span class="plan-sep">—</span> ${item.name || item.title}</span>
                    </div>`;
                }).join('') || `<div class="data-error">${ui('noRoutines')}</div>`;

            document.getElementById('funnelRoot').innerHTML = `
                ${backButtonHtml()}
                ${cardOpen()}
                    ${headHtml(step)}
                    <div class="plan-block">
                        <h4>🎯 ${currentLocale() === 'en' ? 'Your tasks' : 'Tus tareas'}</h4>
                        <p class="plan-note">${currentLocale() === 'en' ? '1–3 tasks selected.' : '1–3 tareas seleccionadas.'}</p>
                        <div class="plan-rows">${taskRows}</div>
                    </div>
                    <div class="plan-block">
                        <h4>🐣 ${currentLocale() === 'en' ? 'Your routines' : 'Tus rutinas'}</h4>
                        <div class="plan-rows">${routineRows}</div>
                    </div>
                    <p class="plan-copy">${currentLocale() === 'en' ? 'Each routine has a companion. Complete it to help it grow.' : 'Cada rutina tiene un compañero. Complétala para ayudarlo a crecer.'}</p>
                    <div class="actions">
                        <button class="btn btn-dopamine" type="button" id="nextBtn">${step.cta}</button>
                    </div>
                </article>`;

            document.getElementById('nextBtn').addEventListener('click', () => {
                if (advancing) {
                    return;
                }
                goNext();
            });
        }

        function renderStep() {
            clearTimers();
            advancing = false;
            const rawStep = stepList()[currentStepIndex];
            const step = localizedStep(rawStep);
            document.body.classList.toggle('begin-active', step.type === 'begin');
            document.title = step.questionIndex
                ? (currentLocale() === 'en' ? `Brainy — Question ${step.questionIndex} of ${QUESTION_KEYS.length}` : `Brainy — Pregunta ${step.questionIndex} de ${QUESTION_KEYS.length}`)
                : (currentLocale() === 'en' ? 'Brainy — Your system and companion' : 'Brainy — Tu sistema y tu mascota');

            if (step.type === 'language') {
                renderLanguage();
            } else if (step.type === 'begin') {
                renderBegin(step);
            } else if (step.type === 'question') {
                renderQuestion(step);
            } else if (step.type === 'interstitial') {
                renderInterstitial(step);
            } else if (step.type === 'task_select' || step.type === 'routine_select') {
                renderPicker(step);
            } else if (step.type === 'plan_summary') {
                renderPlanSummary(step);
            } else if (step.type === 'contact') {
                renderContact(step);
            } else if (step.type === 'loading') {
                renderLoading(step);
            } else if (step.type === 'product_preview') {
                renderProductPreview(step);
            } else if (step.type === 'presell') {
                renderPresell(step);
            } else if (step.type === 'paywall') {
                renderPaywall(step);
            } else if (step.type === 'success') {
                renderSuccess(step);
            } else if (step.type === 'handoff') {
                renderHandoff(step);
            }

            updateProgress();
            scrollTop();
        }

        if (new URLSearchParams(window.location.search).get('reset') !== null) {
            localStorage.removeItem(STORAGE_STATE_KEY);
            localStorage.removeItem(STORAGE_STEP_KEY);
            history.replaceState(null, '', window.location.pathname);
        }

        document.getElementById('funnelBackBtn').innerHTML = BACK_ARROW_SVG;

        funnelState = mergeLoadedState(loadState());
        currentStepIndex = funnelState.locale ? loadStep() : 0;
        persistState();
        document.documentElement.lang = currentLocale();

        document.addEventListener('click', (event) => {
            const el = event.target.closest ? event.target.closest('[data-action="back"]') : null;
            if (el) {
                goBack();
            }
        });

        loadFunnelData().then(() => {
            hydrateSelections();
            ensureEggAssignment();
            renderStep();
        });
    </script>
</body>
</html>
