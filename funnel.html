<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Brainy — Tu sistema + tu mascota</title>
    <meta name="description" content="Unos minutos. Una serie de preguntas. Una mascota que empieza a crecer con cada paso pequeño.">
    <style>
        :root {
            --bg: #f4f1ea;
            --panel: rgba(255, 255, 255, 0.76);
            --panel-strong: rgba(255, 255, 255, 0.94);
            --text: #24123f;
            --muted: rgba(36, 18, 63, 0.68);
            --accent: #5b4bf4;
            --accent-2: #f2c94c;
            --dopamine: #c9fd5a;
            --success: #178a4a;
            --danger: #d33c3c;
            --border: rgba(36, 18, 63, 0.12);
            --shadow: 0 24px 70px rgba(36, 18, 63, 0.12);

            /* Editorial funnel tokens (UI redesign) */
            --funnel-bg: #FAF7F1;
            --funnel-surface: #FFFFFF;
            --funnel-text: #242521;
            --funnel-muted: #6D706A;
            --funnel-accent: #159875;
            --funnel-accent-strong: #0E7A5D;
            --funnel-accent-soft: #DDF5EA;
            --funnel-border: rgba(36, 37, 33, 0.09);
            --funnel-radius: 20px;
            --funnel-shadow: 0 2px 10px rgba(36, 37, 33, 0.04);
            --funnel-shell-max: 560px;
            --funnel-serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
            --begin-bg: #EDE9DF;
            --begin-muted: #5F625C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--funnel-text);
            background: var(--funnel-bg);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .shell {
            position: relative;
            width: 100%;
            max-width: var(--funnel-shell-max);
            margin: 0 auto;
            padding: 0 20px calc(56px + env(safe-area-inset-bottom, 0px));
        }

        /* ---- Encabezado global: flecha + divisor de dos etapas ---- */

        .funnel-header {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin: 0 -20px;
            padding: 8px 20px calc(8px + env(safe-area-inset-top, 0px));
            background: var(--funnel-bg);
        }

        .funnel-header[hidden] {
            display: none;
        }

        .funnel-header-back {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
        }

        .funnel-header-back[hidden] {
            display: none;
        }

        .funnel-stages {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: end;
            gap: 12px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .funnel-stage {
            min-width: 0;
        }

        .funnel-stage-name {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1.25;
            color: var(--funnel-muted);
            transition: color 0.2s ease;
        }

        .funnel-stage-track {
            display: block;
            margin-top: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--funnel-accent-soft);
            overflow: hidden;
        }

        .funnel-stage-fill {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: var(--funnel-accent);
            transition: width 0.35s ease;
        }

        .funnel-stage[data-state="active"] .funnel-stage-name {
            color: var(--funnel-text);
        }

        .funnel-stage[data-state="done"] .funnel-stage-fill,
        .funnel-stage[data-state="active"] .funnel-stage-fill {
            background: var(--funnel-accent);
        }

        .funnel-stage[data-state="idle"] .funnel-stage-fill {
            background: var(--funnel-accent-soft);
        }

        .funnel-progress-label {
            display: block;
            flex: 0 0 100%;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--funnel-muted);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .funnel-root > .step {
            animation: fadeUp 0.35s ease both;
        }

        .step-top {
            display: flex;
            align-items: flex-start;
            min-height: 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--funnel-text);
            font: inherit;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .back-btn:hover {
            background: rgba(36, 37, 33, 0.06);
        }

        .back-btn:active {
            transform: scale(0.94);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            display: block;
        }

        .panel {
            background: var(--funnel-surface);
            border: 1px solid var(--funnel-border);
            box-shadow: var(--funnel-shadow);
            border-radius: 24px;
            padding: 26px 22px 28px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(91, 75, 244, 0.1);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h1, h2, h3 {
            letter-spacing: -0.02em;
            color: var(--funnel-text);
        }

        .card-head h1 {
            margin-top: 14px;
            font-size: clamp(1.7rem, 6vw, 2.2rem);
            line-height: 1.12;
            font-weight: 800;
        }

        .card-head .sub {
            margin-top: 12px;
            font-size: 1rem;
            line-height: 1.55;
            color: var(--funnel-muted);
        }

        /* ---- Pantalla de pregunta ---- */

        .step-question {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }

        .step-question .card-head {
            text-align: center;
        }

        .step-question .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.5rem, 6.4vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.12;
            text-wrap: balance;
        }

        .step-question .card-head .sub {
            max-width: 44ch;
            margin-left: auto;
            margin-right: auto;
            margin-top: 10px;
            font-size: 0.94rem;
        }

        .question-illustration {
            width: 104px;
            height: 104px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 52px 52px 18px 18px;
            background: linear-gradient(160deg, #E9E4FB 0%, #F3F0FD 60%, #FDF6E4 100%);
        }

        .question-illustration img {
            display: block;
            width: 78%;
            height: 78%;
            object-fit: contain;
        }

        /* ---- Pantalla "You're in good hands." ---- */

        .step-good-hands {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }

        .step-good-hands .card-head {
            text-align: center;
        }

        .step-good-hands .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.12;
            text-wrap: balance;
        }

        .good-hands-sub {
            max-width: 34ch;
            margin: 12px auto 0;
            font-size: 0.98rem;
            line-height: 1.5;
            color: var(--funnel-muted);
            text-wrap: pretty;
        }

        /* Composicion responsiva: se escala con el contenedor, no con el
           viewport, asi que no depende de posiciones absolutas fijas. */
        .good-hands-figure {
            position: relative;
            width: min(100%, 320px);
            aspect-ratio: 1 / 1;
            margin: 28px auto 0;
        }

        .good-hands-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1.5px solid rgba(21, 152, 117, 0.26);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Orbitas discontinuas: se recorta un tramo con un conic-gradient
           para simular el borde punteado de la referencia. */
        .good-hands-orbit--1 {
            width: 58%;
            height: 58%;
            border-color: transparent;
            background: conic-gradient(from 20deg,
                rgba(21, 152, 117, 0.30) 0deg 108deg,
                transparent 108deg 190deg,
                rgba(21, 152, 117, 0.30) 190deg 300deg,
                transparent 300deg 360deg);
            -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        }

        .good-hands-orbit--2 {
            width: 78%;
            height: 78%;
            border-color: transparent;
            background: conic-gradient(from 120deg,
                rgba(21, 152, 117, 0.24) 0deg 132deg,
                transparent 132deg 250deg,
                rgba(21, 152, 117, 0.24) 250deg 336deg,
                transparent 336deg 360deg);
            -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        }

        .good-hands-orbit--3 {
            width: 97%;
            height: 97%;
            border-color: transparent;
            background: conic-gradient(from 260deg,
                rgba(21, 152, 117, 0.20) 0deg 100deg,
                transparent 100deg 200deg,
                rgba(21, 152, 117, 0.20) 200deg 310deg,
                transparent 310deg 360deg);
            -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        }

        .good-hands-avatar {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(150deg, #E6E1F8 0%, #EFF7F2 100%);
            box-shadow: inset 0 0 0 1px rgba(36, 37, 33, 0.06);
        }

        /* El centro manda: el doble que los avatares externos. */
        .good-hands-avatar--center {
            top: 50%;
            left: 50%;
            width: 27%;
            height: 27%;
            transform: translate(-50%, -50%);
            background: linear-gradient(150deg, #E9E4FB 0%, #F6F1DC 100%);
            box-shadow: inset 0 0 0 1px rgba(36, 37, 33, 0.07);
        }

        .good-hands-avatar:not(.good-hands-avatar--center) {
            width: 11%;
            height: 11%;
        }

        .good-hands-avatar[data-size="12"] {
            width: 9.5%;
            height: 9.5%;
        }

        .good-hands-avatar[data-size="13"] {
            width: 10.5%;
            height: 10.5%;
        }

        .good-hands-avatar[data-size="14"] {
            width: 11.5%;
            height: 11.5%;
        }

        .good-hands-avatar[data-size="15"] {
            width: 12.5%;
            height: 12.5%;
        }

        /* Ocho avatares en dos anillos, avoiding el centro. */
        .good-hands-avatar--1 { top: 20.0%; left: 35.0%; }
        .good-hands-avatar--2 { top: 14.5%; left: 57.5%; }
        .good-hands-avatar--3 { top: 30.0%; left: 76.5%; }
        .good-hands-avatar--4 { top: 52.0%; left: 79.5%; }
        .good-hands-avatar--5 { top: 71.0%; left: 65.0%; }
        .good-hands-avatar--6 { top: 76.5%; left: 41.0%; }
        .good-hands-avatar--7 { top: 60.0%; left: 24.0%; }
        .good-hands-avatar--8 { top: 38.0%; left: 15.5%; }

        .step-good-hands .actions {
            margin-top: 26px;
        }

        @media (max-width: 420px) {
            .good-hands-figure {
                width: min(100%, 264px);
                margin-top: 22px;
            }

            .good-hands-sub {
                font-size: 0.94rem;
            }
        }

        @media (max-width: 340px) {
            .good-hands-figure {
                width: min(100%, 224px);
                margin-top: 18px;
            }

            .step-good-hands .card-head h1 {
                font-size: 1.5rem;
            }
        }

        /* ---- Pantalla "Your Focus Profile" (resumen, no diagnóstico médico) ---- */

        .step-diagnosis {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }

        .step-diagnosis .card-head {
            text-align: center;
        }

        .step-diagnosis .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.12;
            text-wrap: balance;
        }

        .diagnosis-card {
            margin-top: 22px;
            padding: 20px;
            border: 1px solid var(--funnel-border);
            border-radius: 24px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
        }

        .diagnosis-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .diagnosis-eyebrow {
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--funnel-muted);
        }

        /* El texto HIGH acompaña al color: nunca queda solo el color. */
        .diagnosis-badge {
            padding: 5px 12px;
            border-radius: 999px;
            background: #FBE3E6;
            border: 1px solid #E9B4BB;
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            color: #8C2F3B;
        }

        .diagnosis-visual {
            position: relative;
            width: 100%;
            height: 116px;
            margin: 18px 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 18px;
            overflow: hidden;
        }

        /* Los hijos no deben encogerse: son formas, no texto. */
        .diagnosis-visual > span {
            flex: 0 0 auto;
        }

        /* Placeholder decorativo por variante; reemplazable por imagen. */
        .diagnosis-visual--task-initiation {
            background: linear-gradient(150deg, #E6F2EA 0%, #EDE7FA 100%);
        }

        .diagnosis-visual--task-initiation .diagnosis-block--big {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: linear-gradient(150deg, #C9E5D6 0%, #D8CCF2 100%);
        }

        .diagnosis-visual--task-initiation .diagnosis-block--small {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(36, 37, 33, 0.06);
        }

        .diagnosis-visual--analysis-paralysis {
            background: linear-gradient(150deg, #E4EDF9 0%, #E8E4F8 100%);
        }

        .diagnosis-visual--analysis-paralysis .diagnosis-trail {
            width: 44%;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(122, 140, 186, 0) 0%, rgba(122, 140, 186, 0.5) 100%);
        }

        .diagnosis-visual--analysis-paralysis .diagnosis-node {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(36, 37, 33, 0.06);
        }

        .diagnosis-visual--analysis-paralysis .diagnosis-node--focus {
            width: 26px;
            height: 26px;
            background: linear-gradient(150deg, #9FB6DC 0%, #B7AEE0 100%);
        }

        .diagnosis-visual--follow-through {
            background: linear-gradient(150deg, #E7F4EC 0%, #FBF0DC 60%, #FAE7E2 100%);
        }

        .diagnosis-visual--follow-through .diagnosis-stage {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(36, 37, 33, 0.06);
        }

        /* El ultimo nivel aparece iluminado. */
        .diagnosis-visual--follow-through .diagnosis-stage--on {
            background: linear-gradient(150deg, #9BD9BE 0%, #F3C97B 100%);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8);
        }

        /* Barra de nivel: decorativa, no interactiva, sin porcentaje. */
        .diagnosis-meter {
            position: relative;
            height: 12px;
            margin-bottom: 22px;
        }

        .diagnosis-meter-track {
            position: absolute;
            inset: 2px 0;
            border-radius: 999px;
            background: linear-gradient(90deg,
                #8FC7DE 0%,
                #9BD3B4 26%,
                #F2DE9B 52%,
                #EFB48A 76%,
                #E79A9A 100%);
        }

        /* Indicador en el rango alto (78%-85%), misma posicion en las 3. */
        .diagnosis-meter-dot {
            position: absolute;
            top: 50%;
            left: 81%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            transform: translateY(-50%);
            border-radius: 50%;
            background: #fff;
            border: 3px solid #D9635F;
            box-shadow: 0 2px 6px rgba(36, 37, 33, 0.18);
        }

        .diagnosis-alert {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border-radius: 18px;
            background: #FDF2F3;
            border: 1px solid #F2D5D8;
        }

        .diagnosis-alert-icon {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #E79A9A;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 900;
            line-height: 1;
        }

        .diagnosis-alert-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #8C2F3B;
        }

        .diagnosis-alert-copy {
            margin: 6px 0 0;
            font-size: 0.93rem;
            line-height: 1.5;
            color: #6B4A4D;
            text-wrap: pretty;
        }

        .diagnosis-details {
            display: grid;
            gap: 10px;
            margin-top: 14px;
        }

        .diagnosis-detail {
            padding: 14px 16px;
            border: 1px solid var(--funnel-border);
            border-radius: 18px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
        }

        .diagnosis-detail h3 {
            margin: 0;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--funnel-muted);
        }

        .diagnosis-detail p {
            margin: 5px 0 0;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.35;
            color: var(--funnel-text);
        }

        .diagnosis-note {
            margin: 16px 0 0;
            font-size: 0.78rem;
            line-height: 1.5;
            text-align: center;
            color: var(--funnel-muted);
        }

        .step-diagnosis .actions {
            margin-top: 18px;
        }

        @media (max-width: 420px) {
            .diagnosis-card {
                margin-top: 18px;
                padding: 16px;
                border-radius: 20px;
            }

            /* En telefonos pequenos se reduce el placeholder antes que el texto. */
            .diagnosis-visual {
                height: 96px;
                margin: 14px 0 16px;
            }

            .diagnosis-details {
                gap: 8px;
                margin-top: 12px;
            }

            .diagnosis-detail {
                padding: 12px 14px;
                border-radius: 16px;
            }

            .diagnosis-detail p {
                font-size: 0.95rem;
            }

            .diagnosis-alert {
                padding: 14px;
            }

            .diagnosis-alert-copy {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 340px) {
            .step-diagnosis .card-head h1 {
                font-size: 1.5rem;
            }

            .diagnosis-visual {
                height: 84px;
            }

            .diagnosis-visual--task-initiation .diagnosis-block--big {
                width: 38px;
                height: 38px;
            }

            .diagnosis-note {
                font-size: 0.74rem;
            }
        }

        /* ---- Pantallas educativas: mini pasos y progreso gamificado ---- */

        .step-mini-steps,
        .step-gamified {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }

        .step-mini-steps .card-head,
        .step-gamified .card-head {
            text-align: center;
        }

        .step-mini-steps .card-head h1,
        .step-gamified .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.55rem, 6.6vw, 2.15rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.14;
            text-wrap: balance;
        }

        .explain-sub {
            max-width: 44ch;
            margin: 12px auto 0;
            font-size: 0.96rem;
            line-height: 1.55;
            color: var(--funnel-muted);
            text-wrap: pretty;
        }

        /* ---- Pantalla 1: tres tarjetas ---- */

        .mini-step-list {
            display: grid;
            gap: 14px;
            margin-top: 24px;
        }

        .mini-step-card {
            padding: 20px 18px 20px 20px;
            border: 1px solid var(--funnel-border);
            border-radius: 20px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
            text-align: left;
        }

        .mini-step-card h3 {
            margin: 0;
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .mini-step-card p {
            margin: 6px 0 0;
            font-size: 0.94rem;
            line-height: 1.5;
            color: var(--funnel-muted);
        }

        /* Placeholder grafico por tarjeta: solo CSS, reemplazable por imagen. */
        .mini-step-card-glyph {
            display: block;
            width: 40px;
            height: 40px;
            margin-bottom: 14px;
            border-radius: 12px;
            background: linear-gradient(150deg, #E6E1F8 0%, #EFF6F1 100%);
            box-shadow: inset 0 0 0 1px rgba(36, 37, 33, 0.05);
        }

        .mini-step-card--next-move .mini-step-card-glyph {
            border-radius: 50%;
            background: linear-gradient(150deg, #DDF1E7 0%, #F7EDD6 100%);
        }

        .mini-step-card--momentum .mini-step-card-glyph {
            border-radius: 12px 20px 12px 20px;
            background: linear-gradient(150deg, #F8E3E4 0%, #E1ECF8 100%);
        }

        /* ---- Pantalla 2: diagrama ---- */

        /* Se escala con el contenedor, no con coordenadas del viewport. */
        .gamification-diagram {
            position: relative;
            width: min(100%, 330px);
            aspect-ratio: 1 / 1;
            margin: 24px auto 0;
        }

        .gamification-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border-color: transparent;
            /* Orbitas discontinuas: conic-gradient + mask con closest-side
               (con farthest-corner el anillo sale como banda gruesa). */
            -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        }

        .gamification-orbit--1 {
            width: 46%;
            height: 46%;
            background: conic-gradient(from 30deg,
                rgba(21, 152, 117, 0.30) 0deg 120deg,
                transparent 120deg 210deg,
                rgba(21, 152, 117, 0.30) 210deg 330deg,
                transparent 330deg 360deg);
        }

        .gamification-orbit--2 {
            width: 68%;
            height: 68%;
            background: conic-gradient(from 200deg,
                rgba(21, 152, 117, 0.22) 0deg 140deg,
                transparent 140deg 250deg,
                rgba(21, 152, 117, 0.22) 250deg 350deg,
                transparent 350deg 360deg);
        }

        /* Nucleo dominante con placeholder propio. */
        .gamification-core-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 27%;
            height: 30%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: linear-gradient(150deg, #E4DEF9 0%, #EFF6F1 100%);
            box-shadow: 0 0 0 3px #fff, 0 4px 14px rgba(36, 37, 33, 0.07);
        }

        /* Etiquetas flotantes: dentro del contenedor, nunca fuera del viewport. */
        .gamification-label {
            position: absolute;
            max-width: 46%;
            padding: 7px 12px;
            border-radius: 999px;
            background: var(--funnel-surface);
            border: 1px solid var(--funnel-border);
            box-shadow: var(--funnel-shadow);
            font-size: 0.76rem;
            font-weight: 700;
            line-height: 1.25;
            color: var(--funnel-text);
            white-space: nowrap;
        }

        .gamification-label--step { top: 2%; left: 6%; }
        .gamification-label--progress { top: 46%; right: 2%; }
        .gamification-label--reward { bottom: 2%; right: 10%; }

        /* Tarjeta informativa, sin persona ni atribucion. */
        .explain-note {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 26px auto 0;
            padding: 18px 18px;
            max-width: 420px;
            border: 1px solid var(--funnel-border);
            border-radius: 20px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
        }

        .explain-note-glyph {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(150deg, #DDF1E7 0%, #E6E1F8 100%);
            box-shadow: inset 0 0 0 1px rgba(36, 37, 33, 0.05);
        }

        .explain-note h3 {
            margin: 0;
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .explain-note p {
            margin: 4px 0 0;
            font-size: 0.92rem;
            line-height: 1.45;
            color: var(--funnel-muted);
        }

        .step-mini-steps .actions,
        .step-gamified .actions {
            margin-top: 22px;
        }

        @media (max-width: 420px) {
            .mini-step-list {
                gap: 10px;
                margin-top: 18px;
            }

            .mini-step-card {
                display: grid;
                grid-template-columns: auto 1fr;
                grid-template-areas: "glyph title" "glyph text";
                column-gap: 14px;
                align-items: start;
                padding: 14px;
                border-radius: 18px;
            }

            .mini-step-card-glyph {
                grid-area: glyph;
                width: 34px;
                height: 34px;
                margin-bottom: 0;
            }

            .mini-step-card h3 {
                grid-area: title;
                align-self: center;
            }

            .mini-step-card p {
                grid-area: text;
            }

            .gamification-diagram {
                width: min(100%, 268px);
                margin-top: 20px;
            }

            .gamification-label {
                padding: 6px 10px;
                font-size: 0.72rem;
            }

            .explain-note {
                margin-top: 22px;
                padding: 15px 14px;
            }
        }

        @media (max-width: 340px) {
            .step-mini-steps .card-head h1,
            .step-gamified .card-head h1 {
                font-size: 1.45rem;
            }

            .mini-step-card h3 {
                font-size: 1.02rem;
            }

            .gamification-diagram {
                width: min(100%, 226px);
                margin-top: 16px;
            }

            .explain-note {
                gap: 11px;
                padding: 13px 12px;
            }

            .explain-note-glyph {
                width: 32px;
                height: 32px;
            }
        }

        /* ---- Pantalla "You're not alone." ---- */

        .step-not-alone {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }

        .step-not-alone .card-head {
            text-align: center;
        }

        .step-not-alone .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.12;
            text-wrap: balance;
        }

        .not-alone-sub {
            max-width: 38ch;
            margin: 12px auto 0;
            font-size: 0.98rem;
            line-height: 1.5;
            color: var(--funnel-muted);
            text-wrap: pretty;
        }

        /* Nube responsiva dentro de un contenedor: se escala con el ancho
           disponible, no con coordenadas del viewport. */
        .social-proof-figure {
            position: relative;
            width: min(100%, 300px);
            aspect-ratio: 1 / 1;
            margin: 24px auto 0;
        }

        .social-proof-avatar {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(150deg, #E9E4FB 0%, #F6F1DC 100%);
            box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(36, 37, 33, 0.06);
        }

        /* El centro domina; los 9 externos son claramente menores. */
        .social-proof-avatar--center {
            top: 50%;
            left: 50%;
            width: 27%;
            height: 27%;
            transform: translate(-50%, -50%);
            background: linear-gradient(150deg, #E4DEF9 0%, #EFF6F1 100%);
        }

        .social-proof-avatar:not(.social-proof-avatar--center) {
            width: 13%;
            height: 13%;
        }

        /* Gradientes suaves distintos para diferenciar cada placeholder. */
        .social-proof-avatar--lavanda { background: linear-gradient(150deg, #E6E1F8 0%, #F1EDFB 100%); }
        .social-proof-avatar--menta   { background: linear-gradient(150deg, #DDF1E7 0%, #EFF8F3 100%); }
        .social-proof-avatar--miel    { background: linear-gradient(150deg, #F7EDD6 0%, #FCF6EA 100%); }
        .social-proof-avatar--rosa    { background: linear-gradient(150deg, #F8E3E4 0%, #FDF1F1 100%); }
        .social-proof-avatar--cielo   { background: linear-gradient(150deg, #E1ECF8 0%, #F0F6FC 100%); }
        .social-proof-avatar--lima    { background: linear-gradient(150deg, #EAF3DC 0%, #F5FAEE 100%); }
        .social-proof-avatar--arena   { background: linear-gradient(150deg, #EFE7DC 0%, #F8F3EC 100%); }

        /* Distribucion organica en dos anillos, sin tapar el centro. */
        .social-proof-avatar--1 { top: 6.0%;  left: 45.0%; width: 16%; height: 16%; }
        .social-proof-avatar--2 { top: 19.0%; left: 74.0%; width: 12%; height: 12%; }
        .social-proof-avatar--3 { top: 42.0%; left: 80.0%; width: 14%; height: 14%; }
        .social-proof-avatar--4 { top: 68.0%; left: 70.0%; width: 11%; height: 11%; }
        .social-proof-avatar--5 { top: 80.0%; left: 44.0%; width: 15%; height: 15%; }
        .social-proof-avatar--6 { top: 70.0%; left: 18.0%; width: 12%; height: 12%; }
        .social-proof-avatar--7 { top: 44.0%; left: 12.0%; width: 14%; height: 14%; }
        .social-proof-avatar--8 { top: 22.0%; left: 26.0%; width: 11%; height: 11%; }
        .social-proof-avatar--9 { top: 6.0%; left: 22.0%; width: 12%; height: 12%; }

        /* Tarjeta blanca con comillas decorativas. */
        .not-alone-card {
            position: relative;
            margin: 26px auto 0;
            padding: 34px 30px 32px;
            max-width: 420px;
            border-radius: 28px;
            background: var(--funnel-surface);
            border: 1px solid var(--funnel-border);
            box-shadow: var(--funnel-shadow);
            text-align: center;
        }

        .not-alone-card p {
            font-size: clamp(1.02rem, 4.2vw, 1.14rem);
            line-height: 1.5;
            font-weight: 600;
            color: var(--funnel-text);
            text-wrap: pretty;
        }

        .not-alone-quote {
            position: absolute;
            top: 8px;
            left: 20px;
            font-family: var(--funnel-serif);
            font-size: 4.4rem;
            line-height: 1;
            color: var(--funnel-accent);
            opacity: 0.55;
            pointer-events: none;
        }

        .not-alone-quote--end {
            top: auto;
            bottom: 4px;
            left: auto;
            right: 20px;
        }

        .step-not-alone .actions {
            margin-top: 22px;
        }

        @media (max-width: 420px) {
            .social-proof-figure {
                width: min(100%, 250px);
                margin-top: 20px;
            }

            .not-alone-sub {
                font-size: 0.94rem;
            }

            .not-alone-card {
                margin-top: 22px;
                padding: 26px 20px 24px;
                border-radius: 22px;
            }

            .not-alone-quote {
                font-size: 2.6rem;
            }
        }

        @media (max-width: 340px) {
            .social-proof-figure {
                width: min(100%, 214px);
                margin-top: 16px;
            }

            .step-not-alone .card-head h1 {
                font-size: 1.5rem;
            }

            .not-alone-card {
                padding: 22px 16px 20px;
            }
        }

        /* ---- Alternativas ---- */

        .options {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }

        .opt {
            display: flex;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 64px;
            padding: 12px 16px;
            border: 1px solid var(--funnel-border);
            border-radius: var(--funnel-radius);
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
            color: var(--funnel-text);
            font: inherit;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .opt:hover {
            border-color: rgba(21, 152, 117, 0.45);
            box-shadow: 0 4px 14px rgba(36, 37, 33, 0.06);
        }

        .opt:focus-visible,
        .back-btn:focus-visible,
        .btn:focus-visible,
        .btn-ghost:focus-visible {
            outline: 3px solid var(--funnel-accent);
            outline-offset: 3px;
        }

        .opt[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .opt.selected {
            border-color: var(--funnel-accent);
            background: var(--funnel-accent-soft);
            box-shadow: var(--funnel-shadow);
        }

        .opt-emoji {
            display: none;
        }

        .opt-body {
            width: 100%;
            min-width: 0;
        }

        .opt-label {
            display: block;
            font-weight: 700;
            font-size: clamp(1.05rem, 4.2vw, 1.18rem);
            line-height: 1.28;
        }

        .opt-desc {
            display: block;
            margin-top: 5px;
            font-size: 0.92rem;
            line-height: 1.45;
            color: var(--funnel-muted);
        }

        .opt .opt-check {
            position: absolute;
            top: 50%;
            right: 12px;
            margin-top: -11px;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            border: 2px solid rgba(36, 37, 33, 0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 900;
            color: transparent;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        .opt:hover .opt-check,
        .opt:focus-visible .opt-check,
        .opt.selected .opt-check {
            opacity: 1;
        }

        .opt.selected .opt-check {
            background: var(--funnel-accent);
            border-color: var(--funnel-accent);
            color: #fff;
        }

        .note {
            margin-top: 16px;
            padding: 15px 17px;
            border-radius: 18px;
            background: rgba(242, 201, 76, 0.14);
            border: 1px solid rgba(242, 201, 76, 0.4);
            color: var(--text);
            font-size: 0.96rem;
            line-height: 1.55;
            animation: fadeUp 0.3s ease both;
        }

        .field {
            margin-top: 16px;
        }

        .field:first-child {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"] {
            width: 100%;
            border: 1px solid rgba(36, 18, 63, 0.14);
            border-radius: 16px;
            background: var(--panel-strong);
            color: var(--text);
            padding: 15px 16px;
            font: inherit;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: rgba(91, 75, 244, 0.7);
            box-shadow: 0 0 0 4px rgba(91, 75, 244, 0.14);
        }

        .field-error {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--danger);
            display: none;
        }

        .check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.5;
            cursor: pointer;
        }

        .check input {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .actions {
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            width: 100%;
            padding: 11px 20px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-size: 1.03rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, opacity 0.18s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-dopamine {
            background: var(--funnel-accent-strong);
            color: #fff;
            box-shadow: 0 8px 20px rgba(21, 152, 117, 0.22);
        }

        .btn-primary {
            background: var(--funnel-accent-strong);
            color: #fff;
            box-shadow: 0 8px 20px rgba(21, 152, 117, 0.22);
        }

        .btn-secondary {
            background: rgba(36, 18, 63, 0.08);
            color: var(--text);
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            box-shadow: none;
        }

        .btn-ghost:hover {
            background: rgba(36, 18, 63, 0.06);
        }

        .lead {
            margin-top: 18px;
            font-size: 1.05rem;
            line-height: 1.65;
            color: var(--muted);
        }

        .lead + .actions {
            margin-top: 26px;
        }

        .body-copy {
            margin-top: 16px;
            font-size: 1.02rem;
            line-height: 1.6;
            color: var(--muted);
        }

        /* ---- Pantalla de inicio: fondo plano, copy arriba, CTA abajo ---- */

        .begin-screen {
            display: flex;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            flex-direction: column;
            min-height: calc(100vh - 56px - env(safe-area-inset-bottom, 0px));
            padding: 28px 0 24px;
        }

        /* El fondo plano cubre toda la pantalla, no solo la columna. */
        body.begin-active {
            background: var(--begin-bg);
        }

        .begin-top h1,
        .begin-title {
            margin: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.75rem, 7.4vw, 2.35rem);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }

        .begin-sub {
            margin: 12px 0 0;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--begin-muted);
            text-wrap: pretty;
        }

        .begin-mid {
            flex: 1 1 auto;
            min-height: 24px;
        }

        .begin-bottom {
            display: grid;
            gap: 10px;
        }

        .begin-cta {
            width: 100%;
        }

        .begin-legal {
            margin: 2px 0 0;
            font-size: 0.78rem;
            line-height: 1.5;
            text-align: center;
            color: var(--begin-muted);
        }

        .begin-legal a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .begin-legal a:hover {
            color: var(--funnel-text);
        }

        .begin-legal a:focus-visible {
            outline: 2px solid var(--funnel-accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .pet-stage {
            position: relative;
            width: 168px;
            height: 168px;
            margin: 0 auto;
        }

        .egg {
            position: absolute;
            left: 50%;
            bottom: 4px;
            transform: translateX(-50%);
            width: 118px;
            height: 148px;
            border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
            background: linear-gradient(180deg, #fffdf5 20%, #f1e7ff 100%);
            box-shadow: inset -14px -18px 30px rgba(91, 75, 244, 0.12), 0 14px 30px rgba(36, 18, 63, 0.16);
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .egg::before,
        .egg::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 11px;
            border-radius: 50%;
            background: rgba(91, 75, 244, 0.18);
        }

        .egg::before {
            top: 44%;
            left: 26%;
        }

        .egg::after {
            top: 58%;
            right: 24%;
        }

        .egg.cracked::after {
            background: linear-gradient(135deg, rgba(36, 18, 63, 0.4) 0 2px, transparent 2px 100%);
            width: 30px;
            height: 26px;
            right: 34%;
            top: 26%;
            border-radius: 0;
            transform: rotate(18deg);
        }

        .pet {
            position: absolute;
            left: 50%;
            bottom: 2px;
            transform: translateX(-50%) scale(0.75);
            opacity: 0;
            filter: drop-shadow(0 0 0px rgba(201, 253, 90, 0));
            transition: transform 0.45s ease, opacity 0.45s ease, filter 0.45s ease;
        }

        .pet svg {
            display: block;
            width: 150px;
            height: 150px;
        }

        .pet-stage[data-stage="1"] .pet {
            opacity: 0.35;
            transform: translateX(-50%) scale(0.78);
        }

        .pet-stage[data-stage="2"] .pet {
            opacity: 0.6;
            transform: translateX(-50%) scale(0.87);
        }

        .pet-stage[data-stage="3"] .pet {
            opacity: 0.85;
            transform: translateX(-50%) scale(0.95);
        }

        .pet-stage[data-stage="4"] .pet {
            opacity: 1;
            transform: translateX(-50%) scale(1.05);
            filter: drop-shadow(0 0 18px rgba(201, 253, 90, 0.75));
        }

        .pet-stage[data-stage="4"] .egg {
            transform: translateX(-50%) translateY(6px) scale(0.92);
            opacity: 0.25;
        }

        .sparkle {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 2rem;
            opacity: 0;
            transform: scale(0.4) rotate(-20deg);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .pet-stage[data-stage="4"] .sparkle {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .step-caption {
            margin-top: 18px;
            text-align: center;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--muted);
        }

        .micro-list {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        .micro {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 54px;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel-strong);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
        }

        .micro:hover {
            transform: translateY(-1px);
        }

        .micro.done {
            border-color: rgba(23, 138, 74, 0.3);
            background: rgba(23, 138, 74, 0.08);
        }

        .micro .micro-num {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(91, 75, 244, 0.09);
            color: var(--accent);
            font-weight: 900;

            return funnelState.locale === 'en' ? 'en' : 'es';
        }

            Object.keys(vars || {}).forEach((name) => { text = text.replace(`{${name}}`, vars[name]); });
            return text;
        }

        function localizedText(es, en) {
            return currentLocale() === 'en' ? en : es;
        }

        function localizedStep(step) {
            const copy = (STEP_COPY[step.id] || {})[currentLocale()];
            if (!copy) {
                return step;
            }
            const localized = { ...step, ...copy };
            if (step.options && copy.options) {
                localized.options = step.options.map((option, index) => {
                    const value = typeof option === 'string' ? option : (option.value || option.label);
                    const label = copy.options[index] || value;
                    const desc = copy.desc ? copy.desc[index] || '' : (typeof option === 'string' ? '' : option.desc || '');
                    return { ...(typeof option === 'string' ? {} : option), value, label, desc };
                });
            }
            if (step.doubtOption && copy.doubtOption) {
                localized.doubtOption = step.doubtOption;
                localized.doubtLabel = copy.doubtOption;
            }
            return localized;
        }

        let funnelState = JSON.parse(JSON.stringify(DEFAULT_STATE));
        let currentStepIndex = 0;
        let stepTimers = [];
        let advancing = false;
        function funnelWebCheckout() {
            if (!FUNNEL_EXPERIMENTS.webCheckout) {
                return false;
            }
            const key = FUNNEL_CONFIG.revenuecatWebApiKey;
            if (!key) {
                return false;
            }
            const rcSvc = window.BrainyRevenueCat;
            if (rcSvc && typeof rcSvc.isSafePublicKey === 'function') {
                return rcSvc.isSafePublicKey(key);
            }
            return !/^(sk|rk|rp|whsec|tok|req)_/i.test(key) && !/(secret|restricted)/i.test(key);
        }

        // Reordena los pasos que declaran afterKey para que queden anclados al
        // key de la pregunta, no a una posicion numerica fragil.
        function orderStepsByAnchor(steps) {
            const anchored = steps.filter((step) => step.afterKey || step.beforeKey);
            if (!anchored.length) {
                return steps;
            }
            const result = [];
            const pending = anchored.slice();
            // Un ancla se consume una sola vez, por key y no por posicion.
            const take = (key, field) => {
                const index = key ? pending.findIndex((a) => a[field] === key) : -1;
                return index > -1 ? pending.splice(index, 1)[0] : null;
            };
            steps.forEach((step) => {
                // Los pasos anclados ya viven en la lista: se emiten solo desde
                // su key para no duplicarlos.
                if (step.afterKey || step.beforeKey) {
                    return;
                }
                const before = take(step.key, 'beforeKey');
                if (before) {
                    // Varios anclajes antes de la misma key conservan su orden.
                    let next = before;
                    while (next) {
                        result.push(next);
                        next = take(step.key, 'beforeKey');
                    }
                }
                result.push(step);
                const after = take(step.key, 'afterKey');
                if (after) {
                    result.push(after);
                }
            });
            // Cualquier ancla sin key coincidente se emite al final, sin duplicar.
            result.push(...pending);
            return result;
        }

        // Variantes del resumen de perfil. Se elige UNA vez y se guarda; el
        // renderer nunca sortea. randomValue debe estar en [0, 1).
        // Los ids de variante usan 2 espacios de sangria extra a proposito: asi
        // no se confunden con los ids de paso (16 espacios) al inspeccionar
        // la lista de pasos.
        const PROFILE_DIAGNOSIS_VARIANTS = [
          {
            id: 'task_initiation',
            label: 'Task initiation friction',
            headline: 'When a task feels large or unclear, getting started can require more energy than the task itself. Turning it into one tiny first action can lower the barrier and help you build momentum.',
            main: 'Getting started',
            moment: 'Large or unclear tasks',
            trigger: 'Feeling overwhelmed'
          },
          {
            id: 'analysis_paralysis',
            label: 'Analysis paralysis',
            headline: 'When every option feels important, your mind can stay in planning mode and delay action. Choosing one clear next step can help turn overthinking into movement.',
            main: 'Overthinking',
            moment: 'Making decisions',
            trigger: 'Too many options'
          },
          {
            id: 'follow_through',
            label: 'Follow-through friction',
            headline: 'When progress feels distant, attention can shift toward something more immediate. Visible progress, mini-steps and small unlocks can make it easier to keep moving.',
            main: 'Following through',
            moment: 'Long or repetitive tasks',
            trigger: 'Immediate distractions'
          }
        ];

        const PROFILE_DIAGNOSIS_IDS = PROFILE_DIAGNOSIS_VARIANTS.map((v) => v.id);

        // Funcion pura: intervalos de 1/3. Devuelve siempre un ID valido,
        // incluso si randomValue viene fuera de rango o no es numerico.
        function selectProfileDiagnosisVariant(randomValue) {
            const value = typeof randomValue === 'number' && Number.isFinite(randomValue) ? randomValue : 0;
            const normalized = value < 0 ? 0 : (value >= 1 ? 0.999999 : value);
            const slot = Math.min(2, Math.floor(normalized * PROFILE_DIAGNOSIS_IDS.length));
            return PROFILE_DIAGNOSIS_IDS[slot];
        }

        function randomUnitValue() {
            try {
                if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
                    const buffer = new Uint32Array(1);
                    window.crypto.getRandomValues(buffer);
                    return buffer[0] / 4294967296;
                }
            } catch {
                // Sigue con el fallback.
            }
            return Math.random();
        }

        function profileDiagnosisVariant() {
            const stored = funnelState.profileDiagnosisVariant;
            if (PROFILE_DIAGNOSIS_IDS.includes(stored)) {
                return stored;
            }
            // Valor ausente o invalido: se recupera con una variante valida.
            const picked = selectProfileDiagnosisVariant(randomUnitValue());
            setState('profileDiagnosisVariant', picked);
            return picked;
        }

        function stepList() {
            const checkout = funnelWebCheckout();
            return orderStepsByAnchor(FUNNEL_STEPS.filter((step) => {
                if (!checkout) {
                    return step.type !== 'paywall' && step.type !== 'success';
                }
                if (FUNNEL_EXPERIMENTS.showPrePaywall === false && step.type === 'presell') {
                    return false;
                }
                return true;
            }));
        }

        function mergeLoadedState(raw) {
            const safe = raw && typeof raw === 'object' ? raw : {};
            const merged = JSON.parse(JSON.stringify(DEFAULT_STATE));
            for (const key of Object.keys(merged)) {
                if (Object.prototype.hasOwnProperty.call(safe, key)) {
                    merged[key] = safe[key];
                }
            }
            MULTI_QUESTION_KEYS.forEach((key) => {
                if (!Array.isArray(merged[key])) {
                    merged[key] = [];
                }
            });
            if (!Array.isArray(merged.selectedTasks)) {
                merged.selectedTasks = [];
            }
            if (!Array.isArray(merged.selectedRoutines)) {
                merged.selectedRoutines = [];
            }
            if (!Array.isArray(merged.assignedRoutines)) {
                merged.assignedRoutines = [];
            }
            return merged;
        }

        function loadState() {
            try {
                return mergeLoadedState(JSON.parse(localStorage.getItem(STORAGE_STATE_KEY) || 'null'));
            } catch {
                return JSON.parse(JSON.stringify(DEFAULT_STATE));
            }
        }

        function persistState() {
            localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(funnelState));
            window.brainyFunnelState = funnelState;
        }

        function loadStep() {
            const raw = parseInt(localStorage.getItem(STORAGE_STEP_KEY), 10);
            if (!Number.isFinite(raw) || raw < 0 || raw >= stepList().length) {
                return 0;
            }
            return raw;
        }

        function persistStep() {
            localStorage.setItem(STORAGE_STEP_KEY, String(currentStepIndex));
        }

        function clearTimers() {
            stepTimers.forEach((timer) => {
                clearTimeout(timer);
                clearInterval(timer);
            });
            stepTimers = [];
        }

        function answeredCount() {
            return QUESTION_KEYS.filter((key) => {
                const value = funnelState[key];
                if (Array.isArray(value)) {
                    return value.length > 0;
                }
                return value !== null && value !== undefined;
            }).length;
        }

        // Etapa 1 = perfil (begin + preguntas + interstitials del diagnóstico).
        // Etapa 2 = diseño del plan (task_select -> handoff).
        // Ambas se derivan de stepList(); no hay una segunda fuente de verdad.
        const FUNNEL_STAGES = [
            { id: 'profile', fillId: 'funnelProfileFill', label: 'Creando tu Perfil' },
            { id: 'plan', fillId: 'funnelPlanFill', label: 'Diseñando tu Plan' }
        ];

        function stageIndexOfStep(step) {
            return step && (step.type === 'question' || step.type === 'interstitial') ? 0 : 1;
        }

        function stageBounds() {
            const steps = stepList();
            let lastProfile = -1;
            steps.forEach((step, index) => {
                if (stageIndexOfStep(step) === 0) {
                    lastProfile = index;
                }
            });
            return { profileEnd: lastProfile, total: steps.length };
        }

        function stageProgress() {
            const steps = stepList();
            const bounds = stageBounds();
            const profileSpan = Math.max(1, bounds.profileEnd + 1);
            const planSpan = Math.max(1, bounds.total - profileSpan);
            const stage = stageIndexOfStep(steps[currentStepIndex]);
            if (stage === 0) {
                const byAnswers = (Math.min(profileSpan - 1, answeredCount()) + 1) / profileSpan;
                const byStep = (currentStepIndex + 1) / profileSpan;
                return [Math.min(1, Math.max(0.02, byAnswers, byStep)), 0];
            }
            const intoPlan = currentStepIndex - profileSpan;
            const bothDone = currentStepIndex >= steps.length - 1;
            return [1, bothDone ? 1 : Math.min(0.98, Math.max(0.02, (intoPlan + 1) / planSpan))];
        }

        // La flecha es un unico boton persistente en el encabezado. Cada paso
        // sigue decidiendo si se puede volver con backButtonHtml(): aqui solo
        // se marca su presencia. Asi nunca se acumulan flechas al avanzar.
        const BACK_SLOT_MARKER = 'data-funnel-back';

        function syncBackVisibility() {
            const button = document.getElementById('funnelBackBtn');
            if (!button) {
                return;
            }
            const allowed = !!document.querySelector(`#funnelRoot .step-top[${BACK_SLOT_MARKER}]`);
            button.hidden = !allowed;
            button.setAttribute('aria-label', ui('back'));
        }

        function updateProgress() {
            const steps = stepList();
            const step = steps[currentStepIndex];
            if (step.type === 'begin' || step.type === 'language') {
                document.getElementById('funnelProgress').hidden = true;
                syncBackVisibility();
                return;
            }
            const progress = document.getElementById('funnelProgress');
            const label = document.getElementById('funnelProgressLabel');
            const activeStage = stageIndexOfStep(step);
            const progressPair = stageProgress();
            const finished = currentStepIndex >= steps.length - 1;
            progress.hidden = false;
            document.getElementById(FUNNEL_STAGES[0].fillId).style.width = `${progressPair[0] * 100}%`;
            document.getElementById(FUNNEL_STAGES[1].fillId).style.width = `${progressPair[1] * 100}%`;
            progress.querySelectorAll('.funnel-stage').forEach((node, index) => {
                let state = 'idle';
                if (finished || index < activeStage) {
                    state = 'done';
                } else if (index === activeStage) {
                    state = 'active';
                }
                node.dataset.state = state;
            });
            const total = QUESTION_KEYS.length;
            if (step.questionIndex) {
                label.textContent = currentLocale() === 'en'
                    ? `Question ${step.questionIndex} of ${total}`
                    : `Pregunta ${step.questionIndex} de ${total}`;
                label.hidden = false;
            } else {
                label.textContent = '';
                label.hidden = true;
            }
            syncBackVisibility();
        }

        function scrollTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showToast(text, ms) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), ms || 2600);
        }

        function goNext() {
            if (advancing) {
                return;
            }
            clearTimers();
            currentStepIndex = Math.min(stepList().length - 1, currentStepIndex + 1);
            persistStep();
            renderStep();
        }

        function goBack() {
            if (advancing) {
                return;
            }
            clearTimers();
            currentStepIndex = Math.max(0, currentStepIndex - 1);
            persistStep();
            renderStep();
        }

        function resetFunnel() {
            localStorage.removeItem(STORAGE_STATE_KEY);
            localStorage.removeItem(STORAGE_STEP_KEY);
            localStorage.removeItem(STORAGE_CLIENT_PLAN_KEY);
            funnelState = JSON.parse(JSON.stringify(DEFAULT_STATE));
            currentStepIndex = 0;
            persistState();
            persistStep();
            renderStep();
        }

        function setState(key, value) {
            funnelState[key] = value;
            persistState();
        }

        const FORBIDDEN_ANALYTICS_KEYS = /^(email|mail|claim_?token|claim_?token_?hash|redemption_?url|redemption_?token|token|jwt|authorization|redeem_?url)$/i;

        function safeAnalyticsMetadata(metadata) {
            const out = {};
            if (metadata && typeof metadata === 'object') {
                Object.keys(metadata).forEach((key) => {
                    if (!FORBIDDEN_ANALYTICS_KEYS.test(key)) {
                        out[key] = metadata[key];
                    }
                });
            }
            return out;
        }

        function track(event, metadata) {
            const data = { event: event, metadata: safeAnalyticsMetadata(metadata) };
            if (window.brainyAnalyticsQueue) {
                window.brainyAnalyticsQueue.push(data);
            }
            try {
                if (FUNNEL_CONFIG.analyticsEndpoint) {
                    navigator.sendBeacon(FUNNEL_CONFIG.analyticsEndpoint, JSON.stringify(data));
                }
            } catch {
                // analytics es best-effort: nunca debe bloquear el funnel
            }
            if (window.console && console.debug) {
                console.debug('[funnel-analytics]', event, data.metadata);
            }
        }

        function taskCategoryFor(templateId) {
            const cats = tasksData && tasksData.categories ? tasksData.categories : [];
            for (const cat of cats) {
                if ((cat.tasks || []).some((t) => t.templateId === templateId)) {
                    return cat;
                }
            }
            return null;
        }

        function makeSelectedTask(task, category) {
            const cat = category || { id: null, label: 'Otros' };
            return {
                templateId: task.templateId,
                id: task.templateId,
                title: task.title,
                emoji: task.emoji || '',
                metric: task.metric || null,
                difficulty: task.difficulty || 'medium',
                subtasks: (task.subtasks || []).map((s) => ({
                    title: s.title,
                    duration: s.duration || null
                })),
                category: cat.id,

        function makeSelectedRoutine(routine, category) {
            const cat = category || { id: null, label: 'Otros' };
            return {
                templateId: routine.templateId,
                id: routine.templateId,
                name: routine.name,
                title: routine.name,
                icon: routine.icon || '',
                days: canonicalRoutineDays(routine.days),
                tasks: (routine.tasks || []).map((t) => ({
                    title: t.title,
                    position: t.position
                })),
                subtasks: (routine.tasks || []).map((t) => ({
                    title: t.title,
                    duration: null
                })),
                category: cat.id,
                categoryLabel: cat.label
            };
        }

        function hydrateSelections() {
            const taskCats = tasksData && tasksData.categories ? tasksData.categories : [];
            const allTaskCats = taskCats.map((cat) => ({
                category: cat,
                items: cat.tasks || []
            }));
            const routines = routinesData && routinesData.daily_routines ? routinesData.daily_routines : [];
            let changed = false;

            funnelState.selectedTasks = funnelState.selectedTasks.map((old) => {
                const tplId = old.templateId || old.id;
                if (tplId && old.subtasks && old.name === undefined) {
                    let found = null;
                    let catObj = null;
                    for (const group of allTaskCats) {
                        const t = group.items.find((item) => item.templateId === tplId);
                        if (t) {
                            found = t;
                            catObj = group.category;
                            break;
                        }
                    }
                    if (found) {
                        changed = true;
                        return makeSelectedTask(found, catObj);
                    }
                }
                return old;
            });

            funnelState.selectedRoutines = funnelState.selectedRoutines.map((old) => {
                const tplId = old.templateId || old.id;
                if (tplId && old.tasks === undefined) {
                    const r = routines.find((item) => item.templateId === tplId);
                    if (r) {
                        const catObj = CATEGORIES.find((c) => c.id === r.category) || null;
                        changed = true;
                        return makeSelectedRoutine(r, catObj);
                    }
                }
                return old;
            });

            if (changed) {
                persistState();
            }
        }

        function shuffledEggOrder() {
            const seedStr = (funnelState.selectedRoutines[0] && funnelState.selectedRoutines[0].templateId) || 'brainy';
            let seed = 0;
            for (let i = 0; i < seedStr.length; i++) {
                seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
            }
            const order = EGGS.slice();
            for (let i = order.length - 1; i > 0; i--) {
                seed = (seed * 1103515245 + 12345) >>> 0;
                const j = seed % (i + 1);
                const tmp = order[i];
                order[i] = order[j];
                order[j] = tmp;
            }
            return order;
        }

        function eggToAssignment(egg) {
            return {
                catalogId: egg.catalogId,
                name: egg.name,
                emoji: egg.emoji,
                color: egg.color,
                imageUrl: egg.imageUrl || null
            };
        }

        function ensureEggAssignment() {
            const count = funnelState.selectedRoutines.length;
            const current = funnelState.assignedRoutines || [];
            if (count === 0) {
                if (current.length > 0) {
                    setState('assignedRoutines', []);
                }
                return;
            }
            // Normaliza estado viejo (slugs `huevo_*`) a catalogId numérico.
            const normalized = current
                .map(canonicalEgg)
                .filter(Boolean)
                .map(eggToAssignment);
            if (normalized.length === count) {
                if (JSON.stringify(normalized) !== JSON.stringify(current)) {
                    setState('assignedRoutines', normalized);
                }
                return;
            }
            // Asignación determinista (1 rutina = 1 huevo; distintas mientras alcance).
            const order = shuffledEggOrder();
            const assigned = funnelState.selectedRoutines.map((_, i) => eggToAssignment(order[i % order.length]));
            setState('assignedRoutines', assigned);
        }

        function assignedRoutines() {
            ensureEggAssignment();
            return funnelState.assignedRoutines || [];
        }

        function eggForRoutine(index) {
            return assignedRoutines()[index] || EGGS[index % EGGS.length];
        }

        // La app móvil consume: easy | moderate | hard. Nunca "medium".
        const DIFFICULTY_MAP = {
            easy: 'easy', low: 'easy',

        };

        function normalizeDifficulty(value) {
            const key = String(value || '').trim().toLowerCase();
            return DIFFICULTY_MAP[key] || 'moderate';
        }

        function normalizeDuration(value) {
            const num = typeof value === 'number' ? value : parseFloat(value);
            return Number.isFinite(num) && num > 0 ? num : DEFAULT_SUBTASK_DURATION_MINUTES;

        // confirmó su creación y el token no es demo.
        function hasRealPlan() {
            return !!(
                FUNNEL_CONFIG.enableBackend &&

        async function prepareIdentifiedAccount() {
            const identity = window.BrainyFunnelIdentity;
            if (!identity || !hasRealPlan() || !funnelState.email) {
                return { ok: false, error: 'identity_not_ready' };

                fetchImpl: window.fetch.bind(window),

                setState('accountPrepared', false);

            return result;
        }

        function ensureClientPlanKey() {
            if (funnelState.clientPlanKey) {
                return funnelState.clientPlanKey;
            }
            let key = null;
            try {
                key = localStorage.getItem(STORAGE_CLIENT_PLAN_KEY);
            } catch (e) {
                key = null;
            }
            if (!key) {
                key = (window.crypto && typeof window.crypto.randomUUID === 'function')
                    ? window.crypto.randomUUID()
                    : 'cpk-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
                try {
                    localStorage.setItem(STORAGE_CLIENT_PLAN_KEY, key);
                } catch (e) {
                    // sin localStorage: seguimos con la key en memoria
                }
            }
            setState('clientPlanKey', key);
            return key;
        }

        function resetClientPlanKey() {
            setState('clientPlanKey', null);
            try {
                localStorage.removeItem(STORAGE_CLIENT_PLAN_KEY);
            } catch (e) {
                // sin localStorage: la key en memoria ya quedó limpia
            }
        }

        // Persiste el redemption URL server-side vía set-funnel-redemption.
        // Usa SOLO la config pública/anon del funnel (nunca service_role) y
        // SOLO `redemptionInfo.redeemUrl` (nunca redeemUrlRedirect).
        // Devuelve { ok, status, reason }.
        async function persistRedemptionUrl(planId, claimToken, redemptionUrl) {
            if (!redemptionUrl || !hasRealPlan() || !FUNNEL_CONFIG.enableBackend || !FUNNEL_CONFIG.setRedemptionUrl) {
                return { ok: false, reason: 'not_configurable' };
            }
            const headers = { 'Content-Type': 'application/json' };
            if (FUNNEL_CONFIG.anonKey) {
                headers['apikey'] = FUNNEL_CONFIG.anonKey;
                headers['Authorization'] = 'Bearer ' + FUNNEL_CONFIG.anonKey;
            }
            try {
                const res = await fetch(FUNNEL_CONFIG.setRedemptionUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        planId: funnelState.planId,
                        claimToken: funnelState.claimToken,
                        redemptionUrl: redemptionUrl
                    })
                });
                let data = null;
                try { data = await res.json(); } catch (e) { data = null; }
                if (!res.ok) {
                    return { ok: false, reason: (data && data.error) || ('http_' + res.status) };
                }
                const status = data && data.status;
                if (status === 'set' || status === 'unchanged') {
                    return { ok: true, status: status };
                }
                return { ok: false, reason: 'unexpected_status' };
            } catch (err) {
                return { ok: false, reason: (err && err.message) || 'network_error' };
            }
        }

        // Recovery de persistencia: reintenta SOLO set-funnel-redemption.
        // NUNCA vuelve a ejecutar purchase().
        async function retryPendingRedemption() {
            const url = funnelState.pendingRedemptionUrl;
            if (!url || !hasRealPlan()) {
                window.location.reload();
                return;
            }
            const result = await persistRedemptionUrl(funnelState.planId, funnelState.claimToken, url);
            if (result.ok) {
                setState('redemptionPersisted', true);
                setState('handoffReady', true);
                track('redemption_persisted', { status: result.status, retry: true });
                track('handoff_ready', {
                    platform: isMobileDevice() ? 'mobile' : 'desktop',
                    retry: true
                });
            } else {
                setState('redemptionPersisted', false);
                setState('handoffReady', false);
                track('redemption_persist_failed', { reason: result.reason, retry: true });
            }
            renderStep();
        }

        // Deep link web -> app. Identity is resolved by the Supabase UUID and
        // claim token; do not put email or other PII in the URL or QR payload.
        function buildClaimLink(redeemUrl) {
            const token = hasRealPlan()
                ? funnelState.claimToken
                : 'demo-' + (funnelState.planId || Date.now());
            let link = `${FUNNEL_CONFIG.appDeepLinkScheme}://claim?token=${encodeURIComponent(token)}`;
            if (redeemUrl) {
                link += `&redeem_url=${encodeURIComponent(redeemUrl)}`;
