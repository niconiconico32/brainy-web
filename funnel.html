<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Brainy — Tu sistema + tu mascota</title>
    <meta name="description" content="Unos minutos. Una serie de preguntas. Una mascota que empieza a crecer con cada paso pequeño.">
    <style>
        :root {
            --bg: #f4f1ea;
            --panel: rgba(255, 255, 255, 0.76);
            --panel-strong: rgba(255, 255, 255, 0.94);
            --text: #24123f;
            --muted: rgba(36, 18, 63, 0.68);
            --accent: #5b4bf4;
            --accent-2: #f2c94c;
            --dopamine: #c9fd5a;
            --success: #178a4a;
            --danger: #d33c3c;
            --border: rgba(36, 18, 63, 0.12);
            --shadow: 0 24px 70px rgba(36, 18, 63, 0.12);

            /* Editorial funnel tokens (UI redesign) */
            --funnel-bg: #FAF7F1;
            --funnel-surface: #FFFFFF;
            --funnel-text: #242521;
            --funnel-muted: #6D706A;
            --funnel-accent: #159875;
            --funnel-accent-strong: #0E7A5D;
            --funnel-accent-soft: #DDF5EA;
            --funnel-border: rgba(36, 37, 33, 0.09);
            --funnel-radius: 20px;
            --funnel-shadow: 0 2px 10px rgba(36, 37, 33, 0.04);
            --funnel-shell-max: 560px;
            --funnel-serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
            --begin-bg: #EDE9DF;
            --begin-muted: #5F625C;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            -webkit-text-size-adjust: 100%;
        }


        body {
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--funnel-text);
            background: var(--funnel-bg);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }


        .shell {
            position: relative;
            width: 100%;
            max-width: var(--funnel-shell-max);
            margin: 0 auto;
            padding: 0 20px calc(56px + env(safe-area-inset-bottom, 0px));
        }


        /* ---- Encabezado global: flecha + divisor de dos etapas ---- */

        .funnel-header {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin: 0 -20px;
            padding: 8px 20px calc(8px + env(safe-area-inset-top, 0px));
            background: var(--funnel-bg);
        }


        .funnel-header[hidden] {
            display: none;
        }


        .funnel-header-back {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
        }


        .funnel-header-back[hidden] {
            display: none;
        }


        .funnel-stages {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: end;
            gap: 12px;
            flex: 1 1 auto;
            min-width: 0;
        }


        .funnel-stage {
            min-width: 0;
        }


        .funnel-stage-name {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1.25;
            color: var(--funnel-muted);
            transition: color 0.2s ease;
        }


        .funnel-stage-track {
            display: block;
            margin-top: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--funnel-accent-soft);
            overflow: hidden;
        }


        .funnel-stage-fill {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: var(--funnel-accent);
            transition: width 0.35s ease;
        }


        .funnel-stage[data-state="active"] .funnel-stage-name {
            color: var(--funnel-text);
        }


        .funnel-stage[data-state="done"] .funnel-stage-fill,
        .funnel-stage[data-state="active"] .funnel-stage-fill {
            background: var(--funnel-accent);
        }


        .funnel-stage[data-state="idle"] .funnel-stage-fill {
            background: var(--funnel-accent-soft);
        }


        .funnel-progress-label {
            display: block;
            flex: 0 0 100%;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--funnel-muted);
            text-align: center;
            letter-spacing: 0.02em;
        }


        .funnel-root > .step {
            animation: fadeUp 0.35s ease both;
        }


        .step-top {
            display: flex;
            align-items: flex-start;
            min-height: 0;
        }


        /* El atributo hidden debe ganar a display:inline-flex: en la pantalla
           terminal la flecha Atrás no se muestra. */
        .back-btn[hidden] {
            display: none;
        }


        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--funnel-text);
            font: inherit;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
        }


        .back-btn:hover {
            background: rgba(36, 37, 33, 0.06);
        }


        .back-btn:active {
            transform: scale(0.94);
        }


        .back-btn svg {
            width: 22px;
            height: 22px;
            display: block;
        }


        .panel {
            background: var(--funnel-surface);
            border: 1px solid var(--funnel-border);
            box-shadow: var(--funnel-shadow);
            border-radius: 24px;
            padding: 26px 22px 28px;
        }


        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(91, 75, 244, 0.1);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }


        h1, h2, h3 {
            letter-spacing: -0.02em;
            color: var(--funnel-text);
        }


        .card-head h1 {
            margin-top: 14px;
            font-size: clamp(1.7rem, 6vw, 2.2rem);
            line-height: 1.12;
            font-weight: 800;
        }


        .card-head .sub {
            margin-top: 12px;
            font-size: 1rem;
            line-height: 1.55;
            color: var(--funnel-muted);
        }


        /* ---- Pantalla de pregunta ---- */

        .step-question {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }


        .step-question .card-head {
            text-align: center;
        }


        .step-question .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.5rem, 6.4vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.12;
            text-wrap: balance;
        }


        .step-question .card-head .sub {
            max-width: 44ch;
            margin-left: auto;
            margin-right: auto;
            margin-top: 10px;
            font-size: 0.94rem;
        }


        .question-illustration {
            width: 104px;
            height: 104px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 52px 52px 18px 18px;
            background: linear-gradient(160deg, #E9E4FB 0%, #F3F0FD 60%, #FDF6E4 100%);
        }


        .question-illustration img {
            display: block;
            width: 78%;
            height: 78%;
            object-fit: contain;
        }


        /* ---- Pantalla "You're in good hands." ---- */

        .step-good-hands {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }


        .step-good-hands .card-head {
            text-align: center;
        }


        .step-good-hands .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.12;
            text-wrap: balance;
        }


        .good-hands-sub {
            max-width: 34ch;
            margin: 12px auto 0;
            font-size: 0.98rem;
            line-height: 1.5;
            color: var(--funnel-muted);
            text-wrap: pretty;
        }


        /* Composicion responsiva: se escala con el contenedor, no con el
           viewport, asi que no depende de posiciones absolutas fijas. */
        .good-hands-figure {
            position: relative;
            width: min(100%, 320px);
            aspect-ratio: 1 / 1;
            margin: 28px auto 0;
        }


        .good-hands-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1.5px solid rgba(21, 152, 117, 0.26);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }


        /* Orbitas discontinuas: se recorta un tramo con un conic-gradient
           para simular el borde punteado de la referencia. */
        .good-hands-orbit--1 {
            width: 58%;
            height: 58%;
            border-color: transparent;
            background: conic-gradient(from 20deg,
                rgba(21, 152, 117, 0.30) 0deg 108deg,
                transparent 108deg 190deg,
                rgba(21, 152, 117, 0.30) 190deg 300deg,
                transparent 300deg 360deg);
            -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        }


        .good-hands-orbit--2 {
            width: 78%;
            height: 78%;
            border-color: transparent;
            background: conic-gradient(from 120deg,
                rgba(21, 152, 117, 0.24) 0deg 132deg,
                transparent 132deg 250deg,
                rgba(21, 152, 117, 0.24) 250deg 336deg,
                transparent 336deg 360deg);
            -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        }


        .good-hands-orbit--3 {
            width: 97%;
            height: 97%;
            border-color: transparent;
            background: conic-gradient(from 260deg,
                rgba(21, 152, 117, 0.20) 0deg 100deg,
                transparent 100deg 200deg,
                rgba(21, 152, 117, 0.20) 200deg 310deg,
                transparent 310deg 360deg);
            -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        }


        .good-hands-avatar {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(150deg, #E6E1F8 0%, #EFF7F2 100%);
            box-shadow: inset 0 0 0 1px rgba(36, 37, 33, 0.06);
            overflow: hidden;
        }


        /* Foto del avatar: cubre el circulo y recorta el rostro. */
        .good-hands-avatar-photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Rostros en circulos muy pequenos: se recorta hacia arriba. */
            object-position: 50% 26%;
        }


        .social-proof-avatar-photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Rostros en circulos muy pequenos: se recorta hacia arriba. */
            object-position: 50% 26%;
        }


        .social-proof-avatar {
            overflow: hidden;
        }


        /* El centro manda: el doble que los avatares externos. */
        .good-hands-avatar--center {
            top: 50%;
            left: 50%;
            width: 27%;
            height: 27%;
            transform: translate(-50%, -50%);
            background: linear-gradient(150deg, #E9E4FB 0%, #F6F1DC 100%);
            box-shadow: inset 0 0 0 1px rgba(36, 37, 33, 0.07);
        }


        .good-hands-avatar:not(.good-hands-avatar--center) {
            width: 11%;
            height: 11%;
        }


        .good-hands-avatar[data-size="12"] {
            width: 9.5%;
            height: 9.5%;
        }


        .good-hands-avatar[data-size="13"] {
            width: 10.5%;
            height: 10.5%;
        }


        .good-hands-avatar[data-size="14"] {
            width: 11.5%;
            height: 11.5%;
        }


        .good-hands-avatar[data-size="15"] {
            width: 12.5%;
            height: 12.5%;
        }


        /* Ocho avatares en dos anillos, avoiding el centro. */
        .good-hands-avatar--1 { top: 20.0%; left: 35.0%; }
        .good-hands-avatar--2 { top: 14.5%; left: 57.5%; }
        .good-hands-avatar--3 { top: 30.0%; left: 76.5%; }
        .good-hands-avatar--4 { top: 52.0%; left: 79.5%; }
        .good-hands-avatar--5 { top: 71.0%; left: 65.0%; }
        .good-hands-avatar--6 { top: 76.5%; left: 41.0%; }
        .good-hands-avatar--7 { top: 60.0%; left: 24.0%; }
        .good-hands-avatar--8 { top: 38.0%; left: 15.5%; }

        .step-good-hands .actions {
            margin-top: 26px;
        }


        @media (max-width: 420px) {
            .good-hands-figure {
                width: min(100%, 264px);
                margin-top: 22px;
            }

            .good-hands-sub {
                font-size: 0.94rem;
            }
        }


        @media (max-width: 340px) {
            .good-hands-figure {
                width: min(100%, 224px);
                margin-top: 18px;
            }

            .step-good-hands .card-head h1 {
                font-size: 1.5rem;
            }
        }


        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }



        /* ---- Pantalla de generacion del plan ---- */

        .step-plan-loading {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }


        .step-plan-loading .card-head {
            text-align: center;
        }


        .step-plan-loading .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.5rem, 6.6vw, 2.1rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.14;
            text-wrap: balance;
        }


        .plan-loading-bars {
            display: grid;
            gap: 18px;
            margin-top: 26px;
        }


        .plan-bar-label {
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--funnel-text);
        }


        .plan-bar-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }


        .plan-bar-value {
            flex: 0 0 auto;
            font-size: 0.82rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--funnel-muted);
        }


        .plan-bar-track {
            height: 14px;
            border-radius: 999px;
            background: rgba(36, 37, 33, 0.07);
            overflow: hidden;
        }


        .plan-bar-fill {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            transition: width 0.1s linear;
        }


        [data-plan-reduced-motion="true"] .plan-bar-fill {
            transition: none;
        }


        /* Cada barra con su propio color: menta, amarillo, acento. */
        .plan-bar--bar1 .plan-bar-fill {
            background: linear-gradient(90deg, #B9E3CE 0%, #159875 100%);
        }


        .plan-bar--bar2 .plan-bar-fill {
            background: linear-gradient(90deg, #F6E2A8 0%, #E8B84B 100%);
        }


        .plan-bar--bar3 .plan-bar-fill {
            background: linear-gradient(90deg, #A9DCC6 0%, #0E7A5D 100%);
        }


        .plan-bar-track[data-complete="true"] {
            box-shadow: 0 0 0 2px var(--funnel-accent-soft);
        }


        .step-plan-loading [data-program-focus]:focus {
            outline: none;
        }


        /* CTA bloqueado: legible, sin parecer accion disponible. */
        .step-plan-loading .btn[disabled] {
            background: #E7E5DE;
            color: #8A8C86;
            box-shadow: none;
            opacity: 1;
        }


        .plan-loading-lock {
            margin: 8px 0 0;
            font-size: 0.78rem;
            line-height: 1.4;
            text-align: center;
            color: var(--funnel-muted);
        }


        /* ---- Testimoniales provisionales (decorativos) ---- */

        .testimonials {
            margin-top: 26px;
        }


        .testimonials__track {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 2px 20px 8px;
            margin: 0 -20px;
            scrollbar-width: none;
        }


        .testimonials__track::-webkit-scrollbar {
            display: none;
        }


        .testimonial-card {
            flex: 0 0 78%;
            scroll-snap-align: center;
            margin: 0;
            padding: 16px;
            border: 1px solid var(--funnel-border);
            border-radius: 20px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
        }


        .testimonial-card__head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }


        .testimonial-card__avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }


        .testimonial-card__stars {
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: #C79A2E;
        }


        .testimonial-card__quote {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--funnel-text);
            text-wrap: pretty;
        }


        .testimonial-card__name {
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--funnel-muted);
        }


        /* ---- Modal de pregunta emergente ---- */

        .plan-dialog {
            /* Centrado explicito: el UA lo ancla arriba en algunos motores. */
            position: fixed;
            inset: 0;
            margin: auto;
            width: min(92vw, 380px);
            max-height: 88vh;
            overflow-y: auto;
            padding: 26px 22px 22px;
            border: 0;
            border-radius: 24px;
            background: var(--funnel-surface);
            color: var(--funnel-text);
            box-shadow: 0 24px 60px rgba(36, 37, 33, 0.22);
        }


        .plan-dialog::backdrop {
            background: rgba(36, 37, 33, 0.42);
        }


        .plan-dialog-title {
            margin: 0;
            font-family: var(--funnel-serif);
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
            text-wrap: balance;
        }


        .plan-dialog-options {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }


        /* Yes y No: mismo peso visual, ninguna jerarquia moral. */
        .plan-dialog-option {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border: 1px solid var(--funnel-border);
            border-radius: 16px;
            background: var(--funnel-surface);
            color: var(--funnel-text);
            font: inherit;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease;
        }


        .plan-dialog-option:hover {
            border-color: rgba(21, 152, 117, 0.45);
        }


        .plan-dialog-option:focus-visible {
            outline: 3px solid var(--funnel-accent);
            outline-offset: 3px;
        }


        .plan-dialog-option[disabled] {
            opacity: 0.55;
            cursor: not-allowed;
        }


        @media (max-width: 420px) {
            .plan-loading-bars {
                gap: 16px;
                margin-top: 22px;
            }

            .testimonial-card {
                flex-basis: 82%;
            }
        }


        @media (max-width: 340px) {
            .plan-bar-track {
                height: 12px;
            }

            .plan-bar-label {
                font-size: 0.86rem;
            }

            /* El shell pasa a 16px de padding: el carril debe seguirlo o
               desborda horizontalmente. */
            .testimonials__track {
                margin: 0 -16px;
                padding-left: 16px;
                padding-right: 16px;
            }
        }


        /* ---- Pantalla "Your Focus Profile" (resumen, no diagnóstico médico) ---- */

        .step-diagnosis {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }


        .step-diagnosis .card-head {
            text-align: center;
        }


        .step-diagnosis .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.12;
            text-wrap: balance;
        }


        .diagnosis-card {
            margin-top: 22px;
            padding: 20px;
            border: 1px solid var(--funnel-border);
            border-radius: 24px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
        }


        .diagnosis-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }


        .diagnosis-eyebrow {
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--funnel-muted);
        }


        /* El texto HIGH acompaña al color: nunca queda solo el color. */
        .diagnosis-badge {
            padding: 5px 12px;
            border-radius: 999px;
            background: #FBE3E6;
            border: 1px solid #E9B4BB;
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            color: #8C2F3B;
        }


        .diagnosis-visual {
            position: relative;
            width: 100%;
            height: 116px;
            /* Margen extra arriba: la foto sobresale por ese lado. */
            margin: 74px 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 18px;
            overflow: hidden;
        }


        /* Los hijos no deben encogerse: son formas, no texto. */
        .diagnosis-visual > span {
            flex: 0 0 auto;
        }


        /* Ilustracion del paciente: se ve completa y sobresale por encima del
           recuadro. Por eso esta variante no recorta nada. */
        .diagnosis-visual--photo {
            overflow: visible;
        }


        .diagnosis-visual-photo {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: auto;
            height: 190px;
            max-width: 132%;
            object-fit: contain;
            object-position: 50% 100%;
            pointer-events: none;
        }


        /* Con foto presente, las formas de placeholder quedan ocultas. */
        .diagnosis-visual--photo > span {
            display: none;
        }


        /* Placeholder decorativo por variante; reemplazable por imagen. */
        .diagnosis-visual--task-initiation {
            background: linear-gradient(150deg, #E6F2EA 0%, #EDE7FA 100%);
        }


        .diagnosis-visual--task-initiation .diagnosis-block--big {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: linear-gradient(150deg, #C9E5D6 0%, #D8CCF2 100%);
        }


        .diagnosis-visual--task-initiation .diagnosis-block--small {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(36, 37, 33, 0.06);
        }


        .diagnosis-visual--analysis-paralysis {
            background: linear-gradient(150deg, #E4EDF9 0%, #E8E4F8 100%);
        }


        .diagnosis-visual--analysis-paralysis .diagnosis-trail {
            width: 44%;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(122, 140, 186, 0) 0%, rgba(122, 140, 186, 0.5) 100%);
        }


        .diagnosis-visual--analysis-paralysis .diagnosis-node {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(36, 37, 33, 0.06);
        }


        .diagnosis-visual--analysis-paralysis .diagnosis-node--focus {
            width: 26px;
            height: 26px;
            background: linear-gradient(150deg, #9FB6DC 0%, #B7AEE0 100%);
        }


        .diagnosis-visual--follow-through {
            background: linear-gradient(150deg, #E7F4EC 0%, #FBF0DC 60%, #FAE7E2 100%);
        }


        .diagnosis-visual--follow-through .diagnosis-stage {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(36, 37, 33, 0.06);
        }


        /* El ultimo nivel aparece iluminado. */
        .diagnosis-visual--follow-through .diagnosis-stage--on {
            background: linear-gradient(150deg, #9BD9BE 0%, #F3C97B 100%);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8);
        }


        /* Barra de nivel: decorativa, no interactiva, sin porcentaje. */
        .diagnosis-meter {
            position: relative;
            height: 12px;
            margin-bottom: 22px;
        }


        .diagnosis-meter-track {
            position: absolute;
            inset: 2px 0;
            border-radius: 999px;
            background: linear-gradient(90deg,
                #8FC7DE 0%,
                #9BD3B4 26%,
                #F2DE9B 52%,
                #EFB48A 76%,
                #E79A9A 100%);
        }


        /* Indicador en el rango alto (78%-85%), misma posicion en las 3. */
        .diagnosis-meter-dot {
            position: absolute;
            top: 50%;
            left: 81%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            transform: translateY(-50%);
            border-radius: 50%;
            background: #fff;
            border: 3px solid #D9635F;
            box-shadow: 0 2px 6px rgba(36, 37, 33, 0.18);
        }


        .diagnosis-alert {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border-radius: 18px;
            background: #FDF2F3;
            border: 1px solid #F2D5D8;
        }


        .diagnosis-alert-icon {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #E79A9A;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 900;
            line-height: 1;
        }


        .diagnosis-alert-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #8C2F3B;
        }


        .diagnosis-alert-copy {
            margin: 6px 0 0;
            font-size: 0.93rem;
            line-height: 1.5;
            color: #6B4A4D;
            text-wrap: pretty;
        }


        .diagnosis-details {
            display: grid;
            gap: 10px;
            margin-top: 14px;
        }


        .diagnosis-detail {
            padding: 14px 16px;
            border: 1px solid var(--funnel-border);
            border-radius: 18px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
        }


        .diagnosis-detail h3 {
            margin: 0;
            font-size: 0.74rem;

            text-transform: uppercase;

        .diagnosis-detail p {
            margin: 5px 0 0;
            font-size: 1rem;
            font-weight: 700;

            color: var(--funnel-text);
        }


        .diagnosis-note {
            margin: 16px 0 0;
            font-size: 0.78rem;
            line-height: 1.5;

            color: var(--funnel-muted);
        }


        .step-diagnosis .actions {
            margin-top: 18px;
        }


        @media (max-width: 420px) {
            .diagnosis-card {
                margin-top: 18px;
                padding: 16px;
                border-radius: 20px;
            }

            /* En telefonos pequenos se reduce el placeholder antes que el texto. */
            .diagnosis-visual {
                height: 96px;
                margin: 58px 0 16px;
            }

            .diagnosis-details {
                gap: 8px;
                margin-top: 12px;
            }

            .diagnosis-detail {
                padding: 12px 14px;
                border-radius: 16px;
            }

            .diagnosis-detail p {

            }

            .diagnosis-alert {

        @media (max-width: 340px) {
            .step-diagnosis .card-head h1 {
                font-size: 1.5rem;
            }

            .diagnosis-visual {
                height: 84px;
            }

            .diagnosis-visual--task-initiation .diagnosis-block--big {
                width: 38px;
                height: 38px;
            }

            .diagnosis-note {
                font-size: 0.74rem;
            }
        }


        /* ---- Pantallas educativas: mini pasos y progreso gamificado ---- */

        .step-mini-steps,
        .step-gamified {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }


        .step-mini-steps .card-head,
        .step-gamified .card-head {
            text-align: center;
        }


        .step-mini-steps .card-head h1,
        .step-gamified .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.55rem, 6.6vw, 2.15rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.14;
            text-wrap: balance;
        }


        .explain-sub {
            max-width: 44ch;
            margin: 12px auto 0;
            font-size: 0.96rem;
            line-height: 1.55;
            color: var(--funnel-muted);
            text-wrap: pretty;
        }


        /* ---- Pantalla 1: tres tarjetas ---- */

        .mini-step-list {
            display: grid;
            gap: 14px;
            margin-top: 24px;
        }


        .mini-step-card {
            padding: 20px 18px 20px 20px;
            border: 1px solid var(--funnel-border);
            border-radius: 20px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
            text-align: left;
        }


        .mini-step-card h3 {
            margin: 0;
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }


        .mini-step-card p {
            margin: 6px 0 0;
            font-size: 0.94rem;
            line-height: 1.5;
            color: var(--funnel-muted);
        }


        /* Glifo con emoji: la caja sigue marcando la ritmo de la tarjeta. */
        .mini-step-card-glyph {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin-bottom: 14px;
            border-radius: 12px;
            background: linear-gradient(150deg, #E6E1F8 0%, #EFF6F1 100%);
            box-shadow: inset 0 0 0 1px rgba(36, 37, 33, 0.05);
            font-size: 1.25rem;
            line-height: 1;
        }


        .mini-step-card--next-move .mini-step-card-glyph {
            border-radius: 50%;
            background: linear-gradient(150deg, #DDF1E7 0%, #F7EDD6 100%);
        }


        .mini-step-card--momentum .mini-step-card-glyph {
            border-radius: 12px 20px 12px 20px;
            background: linear-gradient(150deg, #F8E3E4 0%, #E1ECF8 100%);
        }


        /* ---- Pantalla 2: diagrama ---- */

        /* Se escala con el contenedor, no con coordenadas del viewport. */
        .gamification-diagram {
            position: relative;
            width: min(100%, 330px);
            aspect-ratio: 1 / 1;
            margin: 24px auto 0;
        }


        .gamification-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border-color: transparent;
            /* Orbitas discontinuas: conic-gradient + mask con closest-side
               (con farthest-corner el anillo sale como banda gruesa). */
            -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
            mask: radial-gradient(circle closest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        }


        .gamification-orbit--1 {
            width: 46%;
            height: 46%;
            background: conic-gradient(from 30deg,
                rgba(21, 152, 117, 0.30) 0deg 120deg,
                transparent 120deg 210deg,
                rgba(21, 152, 117, 0.30) 210deg 330deg,
                transparent 330deg 360deg);
        }


        .gamification-orbit--2 {
            width: 68%;
            height: 68%;
            background: conic-gradient(from 200deg,
                rgba(21, 152, 117, 0.22) 0deg 140deg,
                transparent 140deg 250deg,
                rgba(21, 152, 117, 0.22) 250deg 350deg,
                transparent 350deg 360deg);
        }


        /* Nucleo dominante. La imagen se coloca encima y sobresale un poco
           sobre el circulo: el circulo queda como base, no como recorte. */
        .gamification-core-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 27%;
            height: 30%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: linear-gradient(150deg, #E4DEF9 0%, #EFF6F1 100%);
            box-shadow: 0 0 0 3px #fff, 0 4px 14px rgba(36, 37, 33, 0.07);
        }


        .gamification-core-image {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Mas grande que el circulo y desplazada hacia arriba: sobresale.
               height:auto + aspect-ratio evitan que el atributo height del
               <img> estire la imagen. */
            width: 132%;
            height: auto;
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -56%);
            display: block;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 6px 12px rgba(36, 18, 63, 0.16));
        }


        /* Etiquetas flotantes: dentro del contenedor, nunca fuera del viewport. */
        .gamification-label {
            position: absolute;
            max-width: 46%;
            padding: 7px 12px;
            border-radius: 999px;
            background: var(--funnel-surface);
            border: 1px solid var(--funnel-border);
            box-shadow: var(--funnel-shadow);
            font-size: 0.76rem;
            font-weight: 700;
            line-height: 1.25;
            color: var(--funnel-text);
            white-space: nowrap;
        }


        .gamification-label--step { top: 2%; left: 6%; }
        /* La imagen del nucleo crece hacia arriba y hacia los lados: esta etiqueta
           baja para no quedar debajo de ella. */
        .gamification-label--progress { top: 68%; right: 2%; }
        .gamification-label--reward { bottom: 2%; right: 10%; }

        /* Tarjeta informativa, sin persona ni atribucion. */
        .explain-note {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 26px auto 0;
            padding: 18px 18px;
            max-width: 420px;
            border: 1px solid var(--funnel-border);
            border-radius: 20px;
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
        }


        .explain-note-glyph {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(150deg, #DDF1E7 0%, #E6E1F8 100%);
            box-shadow: inset 0 0 0 1px rgba(36, 37, 33, 0.05);
            font-size: 1.2rem;
            line-height: 1;
        }


        .explain-note h3 {
            margin: 0;
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.3;
        }


        .explain-note p {
            margin: 4px 0 0;
            font-size: 0.92rem;
            line-height: 1.45;
            color: var(--funnel-muted);
        }


        .step-mini-steps .actions,
        .step-gamified .actions {
            margin-top: 22px;
        }


        @media (max-width: 420px) {
            .mini-step-list {
                gap: 10px;
                margin-top: 18px;
            }

            .mini-step-card {
                display: grid;
                grid-template-columns: auto 1fr;
                grid-template-areas: "glyph title" "glyph text";
                column-gap: 14px;
                align-items: start;
                padding: 14px;
                border-radius: 18px;
            }

            .mini-step-card-glyph {
                grid-area: glyph;
                width: 34px;
                height: 34px;
                margin-bottom: 0;
                font-size: 1.05rem;
            }

            .mini-step-card h3 {
                grid-area: title;
                align-self: center;
            }

            .mini-step-card p {
                grid-area: text;
            }

            .gamification-diagram {
                width: min(100%, 268px);
                margin-top: 20px;
            }

            .gamification-label {
                padding: 6px 10px;
                font-size: 0.72rem;
            }

            .explain-note {
                margin-top: 22px;
                padding: 15px 14px;
            }
        }


        @media (max-width: 340px) {
            .step-mini-steps .card-head h1,
            .step-gamified .card-head h1 {
                font-size: 1.45rem;
            }

            .mini-step-card h3 {
                font-size: 1.02rem;
            }

            .gamification-diagram {
                width: min(100%, 226px);
                margin-top: 16px;
            }

            .explain-note {
                gap: 11px;
                padding: 13px 12px;
            }

            .explain-note-glyph {
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }
        }


        /* ---- Pantalla "You're not alone." ---- */

        .step-not-alone {
            background: transparent;
            border: 0;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }


        .step-not-alone .card-head {
            text-align: center;
        }


        .step-not-alone .card-head h1 {
            margin-top: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.6rem, 7vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.12;
            text-wrap: balance;
        }


        .not-alone-sub {
            max-width: 38ch;
            margin: 12px auto 0;
            font-size: 0.98rem;
            line-height: 1.5;
            color: var(--funnel-muted);
            text-wrap: pretty;
        }


        /* Nube responsiva dentro de un contenedor: se escala con el ancho
           disponible, no con coordenadas del viewport. */
        .social-proof-figure {
            position: relative;
            width: min(100%, 300px);
            aspect-ratio: 1 / 1;
            margin: 24px auto 0;
        }


        .social-proof-avatar {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(150deg, #E9E4FB 0%, #F6F1DC 100%);
            box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(36, 37, 33, 0.06);
        }


        /* El centro domina; los 9 externos son claramente menores. */
        .social-proof-avatar--center {
            top: 50%;
            left: 50%;
            width: 27%;
            height: 27%;
            transform: translate(-50%, -50%);
            background: linear-gradient(150deg, #E4DEF9 0%, #EFF6F1 100%);
        }


        .social-proof-avatar:not(.social-proof-avatar--center) {
            width: 13%;
            height: 13%;
        }


        /* Gradientes suaves distintos para diferenciar cada placeholder. */
        .social-proof-avatar--lavanda { background: linear-gradient(150deg, #E6E1F8 0%, #F1EDFB 100%); }
        .social-proof-avatar--menta   { background: linear-gradient(150deg, #DDF1E7 0%, #EFF8F3 100%); }
        .social-proof-avatar--miel    { background: linear-gradient(150deg, #F7EDD6 0%, #FCF6EA 100%); }
        .social-proof-avatar--rosa    { background: linear-gradient(150deg, #F8E3E4 0%, #FDF1F1 100%); }
        .social-proof-avatar--cielo   { background: linear-gradient(150deg, #E1ECF8 0%, #F0F6FC 100%); }
        .social-proof-avatar--lima    { background: linear-gradient(150deg, #EAF3DC 0%, #F5FAEE 100%); }
        .social-proof-avatar--arena   { background: linear-gradient(150deg, #EFE7DC 0%, #F8F3EC 100%); }

        /* Distribucion organica en dos anillos, sin tapar el centro. */
        .social-proof-avatar--1 { top: 6.0%;  left: 45.0%; width: 16%; height: 16%; }
        .social-proof-avatar--2 { top: 19.0%; left: 74.0%; width: 12%; height: 12%; }
        .social-proof-avatar--3 { top: 42.0%; left: 80.0%; width: 14%; height: 14%; }
        .social-proof-avatar--4 { top: 68.0%; left: 70.0%; width: 11%; height: 11%; }
        .social-proof-avatar--5 { top: 80.0%; left: 44.0%; width: 15%; height: 15%; }
        .social-proof-avatar--6 { top: 70.0%; left: 18.0%; width: 12%; height: 12%; }
        .social-proof-avatar--7 { top: 44.0%; left: 12.0%; width: 14%; height: 14%; }
        .social-proof-avatar--8 { top: 22.0%; left: 26.0%; width: 11%; height: 11%; }
        .social-proof-avatar--9 { top: 6.0%; left: 22.0%; width: 12%; height: 12%; }

        /* Tarjeta blanca con comillas decorativas. */
        .not-alone-card {
            position: relative;
            margin: 26px auto 0;
            padding: 34px 30px 32px;

            box-shadow: var(--funnel-shadow);
            text-align: center;

            right: 20px;

        .step-not-alone .actions {
            margin-top: 22px;

        @media (max-width: 420px) {
            .social-proof-figure {

                padding: 26px 20px 24px;
                border-radius: 22px;

            .not-alone-quote {
                font-size: 2.6rem;

        /* ---- Alternativas ---- */

        .options {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }


        .opt {
            display: flex;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 64px;
            padding: 12px 16px;
            border: 1px solid var(--funnel-border);
            border-radius: var(--funnel-radius);
            background: var(--funnel-surface);
            box-shadow: var(--funnel-shadow);
            color: var(--funnel-text);
            font: inherit;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }


        .opt:hover {
            border-color: rgba(21, 152, 117, 0.45);
            box-shadow: 0 4px 14px rgba(36, 37, 33, 0.06);
        }


        .opt:focus-visible,
        .back-btn:focus-visible,
        .btn:focus-visible,
        .btn-ghost:focus-visible {
            outline: 3px solid var(--funnel-accent);
            outline-offset: 3px;
        }


        .opt[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }


        .opt.selected {
            border-color: var(--funnel-accent);
            background: var(--funnel-accent-soft);
            box-shadow: var(--funnel-shadow);
        }


        .opt-emoji {
            display: none;
        }


        .opt-body {
            width: 100%;
            min-width: 0;
        }


        .opt-label {
            display: block;
            font-weight: 700;
            font-size: clamp(1.05rem, 4.2vw, 1.18rem);
            line-height: 1.28;
        }


        .opt-desc {
            display: block;
            margin-top: 5px;
            font-size: 0.92rem;
            line-height: 1.45;
            color: var(--funnel-muted);
        }


        .opt .opt-check {
            position: absolute;
            top: 50%;
            right: 12px;
            margin-top: -11px;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            border: 2px solid rgba(36, 37, 33, 0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 900;
            color: transparent;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.18s ease;
        }


        .opt:hover .opt-check,
        .opt:focus-visible .opt-check,
        .opt.selected .opt-check {
            opacity: 1;
        }


        .opt.selected .opt-check {
            background: var(--funnel-accent);
            border-color: var(--funnel-accent);
            color: #fff;
        }


        .note {

            padding: 15px 17px;

            border: 1px solid rgba(242, 201, 76, 0.4);

        .field {

        .field:first-child {

        label {

            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }


        input[type="text"],
        input[type="number"],
        input[type="email"] {

            border: 1px solid rgba(36, 18, 63, 0.14);
            border-radius: 16px;
            background: var(--panel-strong);
            color: var(--text);
            padding: 15px 16px;
            font: inherit;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }


        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: rgba(91, 75, 244, 0.7);
            box-shadow: 0 0 0 4px rgba(91, 75, 244, 0.14);
        }


        .field-error {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--danger);
            display: none;
        }


        .check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.5;
            cursor: pointer;
        }


        .check input {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: var(--accent);
            flex-shrink: 0;
        }


        .actions {
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }


        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            width: 100%;
            padding: 11px 20px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-size: 1.03rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, opacity 0.18s ease;
        }


        .btn:hover {
            transform: translateY(-1px);
        }


        .btn[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }


        .btn-dopamine {
            background: var(--funnel-accent-strong);
            color: #fff;
            box-shadow: 0 8px 20px rgba(21, 152, 117, 0.22);
        }


        .btn-primary {
            background: var(--funnel-accent-strong);
            color: #fff;
            box-shadow: 0 8px 20px rgba(21, 152, 117, 0.22);
        }


        .btn-secondary {
            background: rgba(36, 18, 63, 0.08);
            color: var(--text);
        }


        .btn-ghost {
            background: transparent;
            color: var(--muted);
            box-shadow: none;
        }


        .btn-ghost:hover {
            background: rgba(36, 18, 63, 0.06);
        }


        .lead {
            margin-top: 18px;
            font-size: 1.05rem;
            line-height: 1.65;
            color: var(--muted);
        }


        .lead + .actions {
            margin-top: 26px;
        }


        .body-copy {
            margin-top: 16px;
            font-size: 1.02rem;
            line-height: 1.6;
            color: var(--muted);
        }


        /* ---- Pantalla de inicio: fondo plano, copy arriba, CTA abajo ---- */

        .begin-screen {
            display: flex;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            flex-direction: column;
            min-height: calc(100vh - 56px - env(safe-area-inset-bottom, 0px));
            padding: 28px 0 24px;
        }


        /* La imagen cubre toda la pantalla, no solo la columna. El color queda
           como respaldo si la imagen no carga.
           El degradado va como primera capa: se pinta encima de la foto y
           oscurece solo la parte baja, donde viven el CTA y el legal. */
        body.begin-active {
            background-color: var(--begin-bg);
            background-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.55) 78%, rgba(0, 0, 0, 0.78) 100%),
                url('assets/backgroundBegin.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }


        .begin-top h1,
        .begin-title {
            margin: 0;
            font-family: var(--funnel-serif);
            font-size: clamp(1.75rem, 7.4vw, 2.35rem);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }


        /* Titulo y subtitulo centrados sobre la imagen de fondo. */
        .begin-title {
            text-align: center;
        }


        .begin-sub {
            margin: 12px auto 0;
            max-width: 30ch;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--begin-muted);
            text-align: center;
            text-wrap: pretty;
        }


        .begin-mid {
            flex: 1 1 auto;
            min-height: 24px;
        }


        .begin-bottom {
            display: grid;
            gap: 10px;
        }


        .begin-cta {
            width: 100%;
        }


        /* El legal cae sobre el velo oscuro del fondo: necesita tono claro. */
        .begin-legal {
            margin: 2px 0 0;
            font-size: 0.78rem;
            line-height: 1.5;
            text-align: center;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }


        .begin-legal a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }


        .begin-legal a:hover {
            color: #fff;
        }


        .begin-legal a:focus-visible {
            outline: 2px solid var(--funnel-accent);
            outline-offset: 2px;
            border-radius: 4px;
        }


        .pet-stage {
           position: relative;
           width: 200px;
           height: 200px;
           margin: 0 auto;
        }


        .egg {
            position: absolute;
            left: 50%;
            bottom: 4px;
            transform: translateX(-50%);
            width: 118px;
            height: 148px;
            border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
            background: linear-gradient(180deg, #fffdf5 20%, #f1e7ff 100%);
            box-shadow: inset -14px -18px 30px rgba(91, 75, 244, 0.12), 0 14px 30px rgba(36, 18, 63, 0.16);
            transition: transform 0.4s ease, opacity 0.4s ease;
        }


        .egg::before,
        .egg::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 11px;
            border-radius: 50%;
            background: rgba(91, 75, 244, 0.18);
        }


        .egg::before {
            top: 44%;
            left: 26%;
        }


        .egg::after {
            top: 58%;
            right: 24%;
        }


        .egg.cracked::after {
            background: linear-gradient(135deg, rgba(36, 18, 63, 0.4) 0 2px, transparent 2px 100%);
            width: 30px;
            height: 26px;
            right: 34%;
            top: 26%;
            border-radius: 0;
            transform: rotate(18deg);
        }


        .pet {
            position: absolute;
            left: 50%;
            bottom: 2px;
            transform: translateX(-50%) scale(0.75);
            opacity: 0;
            filter: drop-shadow(0 0 0px rgba(201, 253, 90, 0));
            transition: transform 0.45s ease, opacity 0.45s ease, filter 0.45s ease;
        }


        .pet svg,
        .pet img {
            display: block;
            width: 180px;
            height: 180px;
            max-width: 100%;
            object-fit: contain;
        }


        .pet-stage[data-stage="1"] .pet {
            opacity: 0.35;
            transform: translateX(-50%) scale(0.78);
        }


        .pet-stage[data-stage="2"] .pet {
            opacity: 0.6;
            transform: translateX(-50%) scale(0.87);
        }


        .pet-stage[data-stage="3"] .pet {
            opacity: 0.85;
            transform: translateX(-50%) scale(0.95);
        }


        .pet-stage[data-stage="4"] .pet {
            opacity: 1;
            transform: translateX(-50%) scale(1.05);
            filter: drop-shadow(0 0 18px rgba(201, 253, 90, 0.75));
        }


        .pet-stage[data-stage="4"] .egg {
            transform: translateX(-50%) translateY(6px) scale(0.92);
            opacity: 0.25;
        }


        .sparkle {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 2rem;
            opacity: 0;
            transform: scale(0.4) rotate(-20deg);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }


        .pet-stage[data-stage="4"] .sparkle {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }


        .step-caption {
            margin-top: 18px;
            text-align: center;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--muted);
        }


        .micro-list {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }


        .micro {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 54px;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel-strong);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
        }


        .micro:hover {
            transform: translateY(-1px);
        }


        .micro.done {
            border-color: rgba(23, 138, 74, 0.3);
            background: rgba(23, 138, 74, 0.08);
        }


        .micro .micro-num {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(91, 75, 244, 0.09);
            color: var(--accent);
            font-weight: 900;
            flex-shrink: 0;
        }


        .micro.done .micro-num {
            background: var(--success);
            color: #fff;
        }


        .micro-label {
            flex: 1;
            font-weight: 800;
            font-size: 0.98rem;
        }



/* ---- Pantalla "sistema de huevos y mascotas" (interstitial_3) ---- */

.step-egg-system {
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
    border-radius: 0;
}

.step-egg-system .egg-head {
    text-align: center;
}

.egg-eyebrow {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--funnel-accent-strong);
}

.step-egg-system .card-head h1 {
    margin-top: 10px;
    font-family: var(--funnel-serif);
    font-size: clamp(1.6rem, 6.8vw, 2.2rem);
    line-height: 1.12;
    letter-spacing: -0.01em;
    text-wrap: balance;
}

.egg-lede {
    max-width: 42ch;
    margin: 12px auto 0;
    font-size: 0.98rem;
    line-height: 1.55;
    color: var(--funnel-muted);
    text-wrap: pretty;
}

/* Preview principal: el PNG manda su propia silueta, sin recorte. */
.egg-preview {
    margin-top: 22px;
    text-align: center;
}

.egg-preview-stage {
    position: relative;
    width: min(100%, 260px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: 26px;
    background: linear-gradient(160deg, #F1EEFA 0%, #EFF7F2 62%, #FDF6E6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.egg-preview-img {
    position: relative;
    z-index: 1;
    display: block;
    width: 78%;
    height: 78%;
    object-fit: contain;
    /* Flotacion minima: nada que distraiga del texto. */
    animation: eggFloat 6s ease-in-out infinite;
}

.egg-preview-img--placeholder {
    border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
    background: rgba(36, 37, 33, 0.08);
}

.egg-preview-glow {
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(21, 152, 117, 0.14) 0%, rgba(21, 152, 117, 0) 70%);
}

@keyframes eggFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.egg-preview-label {
    margin: 16px 0 0;
    font-size: 1.02rem;
    font-weight: 800;
    color: var(--funnel-text);
}

.egg-preview-meter-note {
    margin: 4px 0 0;
    font-size: 0.88rem;
    color: var(--funnel-muted);
}

/* Medidor ilustrativo de 3 segmentos: explica, no representa progreso real. */
.egg-meter {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 300px;
    margin: 14px auto 0;
}

.egg-meter-seg {
    display: grid;
    gap: 6px;
}

.egg-meter-fill {
    display: block;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, #CFE7DC 0%, #9BD3B4 100%);
}

.egg-meter-label {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--funnel-muted);
}

.egg-preview-disclaimer {
    margin: 12px 0 0;
    font-size: 0.78rem;
    line-height: 1.45;
    color: var(--funnel-muted);
}

/* Galeria: en mobile es un carril con scroll-snap, sin autoplay. */
.egg-gallery-block {
    margin-top: 28px;
}

.egg-gallery-hint {
    margin: 0 0 10px;
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--funnel-muted);
    text-align: center;
}

.egg-gallery {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 6px 20px 10px;
    margin: 0 -20px;
}

.egg-gallery::-webkit-scrollbar {
    display: none;
}

.egg-thumb {
            position: relative;
            flex: 0 0 74px;
            scroll-snap-align: center;
    /* Zona tactil por encima del minimo de 44px. */
    min-width: 74px;
    min-height: 74px;
    padding: 6px;
    border: 2px solid transparent;
    border-radius: 18px;
    background: var(--funnel-surface);
    cursor: pointer;
    /* El estado activo nunca depende solo del color: lleva borde y sombra. */
    transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
}

.egg-thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.egg-thumb.is-active {
    border-color: var(--funnel-accent);
    box-shadow: 0 0 0 3px rgba(21, 152, 117, 0.16);
    transform: translateY(-2px);
}

.egg-thumb:focus-visible {
    outline: 3px solid var(--funnel-accent);
    outline-offset: 2px;
}

/* Secuencia de tres pasos. */
.egg-steps {
    list-style: none;
    margin: 26px 0 0;
    padding: 0;
    display: grid;
    gap: 12px;
    counter-reset: eggstep;
}

.egg-step {
    position: relative;
    padding: 16px 16px 16px 58px;
    border: 1px solid var(--funnel-border);
    border-radius: 20px;
    background: var(--funnel-surface);
    box-shadow: var(--funnel-shadow);
}

.egg-step-num {
    position: absolute;
    top: 16px;
    left: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--funnel-accent-soft);
    color: var(--funnel-accent-strong);
    font-size: 0.82rem;
    font-weight: 900;
}

.egg-step-glyph {
    position: absolute;
    top: 50px;
    left: 18px;
    color: var(--funnel-accent);
}

.egg-step-icon {
    display: block;
    width: 22px;
    height: 22px;
}

.egg-step strong {
    display: block;
    font-size: 1rem;
    font-weight: 800;
    line-height: 1.3;
    color: var(--funnel-text);
}

.egg-step p {
    margin: 5px 0 0;
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--funnel-muted);
}

/* Tarjeta "Why Brainy uses this". */
.egg-why {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid var(--funnel-border);
    border-radius: 22px;
    background: linear-gradient(160deg, #F3F1FB 0%, #EFF7F2 100%);
}

.egg-why-head {
    display: flex;
    align-items: center;
    gap: 8px;
}

.egg-why-spark {
    color: var(--funnel-accent-strong);
    font-size: 1rem;
}

.egg-why h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--funnel-text);
}

.egg-why p {
    margin: 8px 0 0;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--funnel-muted);
}

.egg-why-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 10px;
    border: 1px solid var(--funnel-border);
    border-radius: 999px;
    background: var(--funnel-surface);
    font-size: 0.74rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--funnel-accent-strong);
}

.step-egg-system .actions {
    margin-top: 22px;
}

@media (min-width: 720px) {
    .egg-gallery {
        justify-content: center;
        flex-wrap: wrap;
        overflow-x: visible;
        padding-inline: 0;
        margin-inline: 0;
    }

    .egg-steps {
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
    }

    /* En tres columnas el glifo deja de ser absoluto: si no, el titulo
       queda con un ancho util ridiculo. */
    .egg-step {
        padding: 18px 16px 18px 16px;
        padding-top: 52px;
    }

    .egg-step-num {
        top: 16px;
        left: 16px;
    }

    .egg-step-glyph {
        top: 14px;
        left: auto;
        right: 16px;
    }

    /* La conexion visual entre pasos solo tiene sentido en horizontal. */
    .egg-step--linked::after {
        content: "";
        position: absolute;
        top: 50%;
        right: -12px;
        width: 10px;
        height: 2px;
        background: var(--funnel-border);
    }
}

@media (max-width: 420px) {
    .egg-steps {
        margin-top: 22px;
    }
}

@media (max-width: 340px) {
    /* El shell pasa a 16px de padding: la galeria debe seguirlo o desborda
       horizontalmente. Mismo ajuste que .testimonials__track. */
    .egg-gallery {
        margin: 0 -16px;
        padding-left: 16px;
        padding-right: 16px;
    }
}

/* Sin flotacion ni transiciones cuando el usuario lo pide. */
@media (prefers-reduced-motion: reduce) {
    .egg-preview-img {
        animation: none;
    }

    .egg-thumb {
        transition: none;
    }

    .egg-thumb.is-active {
        transform: none;
    }
}

/* Cada categoria es una card de color suave y plegable. */
.picker-cat {
            margin-top: 14px;
            border: 1px solid var(--funnel-border);
            border-radius: var(--funnel-radius);
            background: var(--cat-tint, #F3F1FB);
            overflow: hidden;
            transition: background 0.2s ease;
        }


.picker-cat:first-of-type {
            margin-top: 20px;
        }


/* Un tono suave por categoria: distingue sin gritar. */
.picker-cat--1 { --cat-tint: #EFECFA; }
.picker-cat--2 { --cat-tint: #E9F4EE; }
.picker-cat--3 { --cat-tint: #FBF0E4; }
.picker-cat--4 { --cat-tint: #F6EAF0; }

/* El encabezado es el disparador del plegable. */
.cat-head {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 52px;
            padding: 12px 14px;
            border: 0;
            background: transparent;
            font: inherit;
            text-align: left;
            cursor: pointer;
            color: var(--funnel-text);
        }


.cat-head .cat-emoji {
            font-size: 1.3rem;
            filter: none;
            flex-shrink: 0;
        }


.cat-label {
            flex: 1;
            min-width: 0;
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.04em;
}

.cat-count {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--funnel-muted);
            flex-shrink: 0;
}

.cat-chev {
            font-size: 0.9rem;
            color: var(--funnel-muted);
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }


.picker-cat.open .cat-chev {
            transform: rotate(180deg);
        }


.picker-list {
            display: grid;
            gap: 8px;
            padding: 0 10px 10px;
        }


.picker-list[hidden] {
            display: none;
}

/* Fila = boton que selecciona + zona de desplegable. La card se comporta
   como bloque para que el chevron sea un control hermano, no anidado. */
.pick-row {
            border: 1px solid transparent;
            border-radius: 16px;
            background: var(--funnel-surface);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }


.pick-row.is-selected {
            border-color: var(--funnel-accent);
            box-shadow: 0 0 0 3px rgba(21, 152, 117, 0.12);
        }


.pick-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: stretch;
        }


.pick-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            min-height: 56px;
            padding: 12px 6px 12px 14px;
            border: 0;
            border-radius: 16px;
            background: transparent;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }


/* Zona tactile del desplegable: 44px minimo. */
.pick-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            min-height: 56px;
            padding: 0 10px 0 4px;
            border: 0;
            border-radius: 16px;
            background: transparent;
            cursor: pointer;
        }


.pick-toggle:focus-visible {
            outline: 3px solid var(--funnel-accent);
            outline-offset: -3px;
}


.pick-chev {

          /* ============================================================

             la compra y el plan se completaron y que el correo con
             las instrucciones esta en camino.
             Sin botones, sin enlaces y sin elementos enfocables.
             ============================================================ */
          .step-done {
              padding: 24px;
              border-radius: 26px;
              box-shadow: 0 2px 10px rgba(36, 37, 33, 0.04);
          }


          .step-done-inner {
              display: flex;

          .done-badge {

              margin-bottom: 18px;

          .done-badge svg {

              height: 38px;
              display: block;
          }

              border-radius: 999px;

              gap: 14px;
              align-items: flex-start;
              width: 100%;
              margin-top: 22px;
              padding: 18px;
              border-radius: 18px;
              background: var(--funnel-accent-soft);
              text-align: left;
          }

          /* Centrado vertical a CUALQUIER anchura, no solo en desktop.
             En movil la cadena main > .shell > .funnel-root es block, asi que
             margin-block:auto no tendria espacio que repartir. Estas reglas solo
             se activan cuando la tarjeta terminal esta montada (:has), de modo
             que el resto de pantallas del funnel no cambia.
             Si el contenido no cabe (pantallas bajas) los margenes colapsan a 0
             y la tarjeta se ve completa con scroll normal. */
          body:has(.step-done) main.shell {
              display: flex;
              flex-direction: column;
              min-height: 100vh;
          }

          body:has(.step-done) .funnel-root {
              display: flex;
              flex-direction: column;
              flex: 1 1 auto;
          }

          .funnel-root > .step-done {
              margin-block: auto;
          }

          @media (prefers-reduced-motion: reduce) {
              .funnel-root > .step-done {
                  animation: none;
              }
          }

            from {

                transform: translateY(12px);

                opacity: 1;
                transform: translateY(0);

            if (!Array.isArray(rawDays) || rawDays.length === 0) {

        // Reordena los pasos que declaran afterKey para que queden anclados al
        // key de la pregunta, no a una posicion numerica fragil.
        // Reordena los pasos anclados sin duplicar la lista. Soporta:
        // afterKey / beforeKey (por key de respuesta) y afterId (por id de
        // paso), para encadenar pantallas informativas.
        function orderStepsByAnchor(steps) {
            const anchored = steps.filter((step) => step.afterKey || step.beforeKey || step.afterId);
            if (!anchored.length) {
                return steps;
            }
            const result = [];
            const pending = anchored.slice();

            // Consume un ancla una sola vez: un ancla puede colgar de una key
            // de respuesta o del id de un paso.
            const takeBy = (value, field) => {
                const index = value ? pending.findIndex((a) => a[field] === value) : -1;
                return index > -1 ? pending.splice(index, 1)[0] : null;
            };
            // Un paso puede tener varias anclas beforeKey sobre la misma key.
            const takeAllBy = (value, field) => {
                const found = [];
                let next = takeBy(value, field);
                while (next) {
                    found.push(next);
                    next = takeBy(value, field);
                }
                return found;
            };
            // Emite un paso y todo lo que se ancla a el.
            const emit = (step) => {
                result.push(step);
                for (const child of takeAllBy(step.id, 'afterId')) {
                    emit(child);
                }
                const after = takeBy(step.key, 'afterKey');
                if (after) {
                    emit(after);
                }
            };

            steps.forEach((step) => {
                // Los pasos anclados ya viven en la lista: se emiten desde su
                // ancla para no duplicarlos.
                if (step.afterKey || step.beforeKey || step.afterId) {
                    return;
                }
                for (const child of takeAllBy(step.id, 'afterId')) {
                    emit(child);
                }
                for (const child of takeAllBy(step.key, 'beforeKey')) {
                    emit(child);
                }
                result.push(step);
                const after = takeBy(step.key, 'afterKey');
                if (after) {
                    emit(after);
                }
            });

            // Cualquier ancla sin key/id coincidente se emite al final.
            while (pending.length) {
                emit(pending.shift());
            }
            return result;
        }

        // delante de lo que realmente serespondio.
        function sanitizePlanLoadingProgress(raw) {
            const source = raw && typeof raw === 'object' ? raw : {};
            const clamp = (v) => {
                const n = typeof v === 'number' && Number.isFinite(v) ? v : 0;
                return Math.max(0, Math.min(100, Math.round(n)));
            };
            const bool = (v) => (v === true || v === false ? v : null);
            const progress = {
                phase: 'bar_1_running',
                bar1: clamp(source.bar1),
                bar2: clamp(source.bar2),
                bar3: clamp(source.bar3),
                rushedMornings: bool(source.rushedMornings),
                wantsScienceBasedMethod: bool(source.wantsScienceBasedMethod)
            };
            if (progress.rushedMornings === null) {
                progress.phase = progress.bar1 >= 100 ? 'question_1' : 'bar_1_running';
            } else if (progress.wantsScienceBasedMethod === null) {
                progress.phase = progress.bar2 >= 100 ? 'question_2' : 'bar_2_running';
            } else {
                progress.phase = progress.bar3 >= 100 ? 'ready' : 'bar_3_running';
            }
            if (progress.phase === 'ready') {
                progress.bar1 = 100;
                progress.bar2 = 100;
                progress.bar3 = 100;
            }
            return progress;
        }

        function stageIndexOfStep(step) {
            if (step && typeof step.stage === 'number') {

        function stageBounds() {
            const steps = stepList();
            let lastProfile = -1;
            steps.forEach((step, index) => {

                }
            });
            return { profileEnd: lastProfile, total: steps.length };
        }


        function stageProgress() {
            const steps = stepList();
            const bounds = stageBounds();
            const profileSpan = Math.max(1, bounds.profileEnd + 1);
            const planSpan = Math.max(1, bounds.total - profileSpan);
            const stage = stageIndexOfStep(steps[currentStepIndex]);
            if (stage === 0) {
                const byAnswers = (Math.min(profileSpan - 1, answeredCount()) + 1) / profileSpan;
                const byStep = (currentStepIndex + 1) / profileSpan;
                return [Math.min(1, Math.max(0.02, byAnswers, byStep)), 0];
            }
            const intoPlan = currentStepIndex - profileSpan;
            const bothDone = currentStepIndex >= steps.length - 1;
            return [1, bothDone ? 1 : Math.min(0.98, Math.max(0.02, (intoPlan + 1) / planSpan))];
        }


        // La flecha es un unico boton persistente en el encabezado. Cada paso
