        function updateProgress() {
            const steps = stepList();
            const step = steps[currentStepIndex];
            if (step.type === 'begin' || step.type === 'language') {
                document.getElementById('funnelProgress').hidden = true;
                syncBackVisibility();
                return;
            }
            const progress = document.getElementById('funnelProgress');
            const label = document.getElementById('funnelProgressLabel');
            const activeStage = stageIndexOfStep(step);
            const progressPair = stageProgress();
            const isTerminal = step.type === 'success' || step.type === 'handoff';
            // En la pantalla terminal las dos etapas quedan completas: el
            // funnel ya terminó. `finished` mantenía solo el último paso como
            // 'done', así que success mostraba la segunda etapa a medias.
            const finished = currentStepIndex >= steps.length - 1 || isTerminal;
            progress.hidden = false;
            if (isTerminal) {
                document.getElementById(FUNNEL_STAGES[0].fillId).style.width = '100%';
                document.getElementById(FUNNEL_STAGES[1].fillId).style.width = '100%';
            } else {
                document.getElementById(FUNNEL_STAGES[0].fillId).style.width = `${progressPair[0] * 100}%`;
                document.getElementById(FUNNEL_STAGES[1].fillId).style.width = `${progressPair[1] * 100}%`;
            }
            progress.querySelectorAll('.funnel-stage').forEach((node, index) => {
                let state = 'idle';
                if (finished || index < activeStage) {
                    state = 'done';
                } else if (index === activeStage) {
                    state = 'active';
                }
                node.dataset.state = state;
            });

        function hydrateSelections() {
            const taskCats = tasksData && tasksData.categories ? tasksData.categories : [];

            }));

                const tplId = old.templateId || old.id;
                if (tplId && old.subtasks && old.name === undefined) {
                    let found = null;
                    let catObj = null;
                    for (const group of allTaskCats) {
                        const t = group.items.find((item) => item.templateId === tplId);
                        if (t) {
                            found = t;
                            catObj = group.category;
                            break;
                        }
                    }
                    if (found) {

                        return makeSelectedTask(found, catObj);

                }
                return old;

        function shuffledEggOrder() {
            const seedStr = (funnelState.selectedRoutines[0] && funnelState.selectedRoutines[0].templateId) || 'brainy';
            let seed = 0;
            for (let i = 0; i < seedStr.length; i++) {
                seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
            }
            const order = EGGS.slice();
            for (let i = order.length - 1; i > 0; i--) {
                seed = (seed * 1103515245 + 12345) >>> 0;
                const j = seed % (i + 1);
                const tmp = order[i];
                order[i] = order[j];
                order[j] = tmp;
            }
            return order;
        }

        function ensureEggAssignment() {
            const count = funnelState.selectedRoutines.length;
            const current = funnelState.assignedRoutines || [];
            if (count === 0) {
                if (current.length > 0) {
                    setState('assignedRoutines', []);
                }
                return;
            }
            // Normaliza estado viejo (slugs `huevo_*`) a catalogId numérico.
            const normalized = current
                .map(canonicalEgg)
                .filter(Boolean)
                .map(eggToAssignment);
            if (normalized.length === count) {
                if (JSON.stringify(normalized) !== JSON.stringify(current)) {
                    setState('assignedRoutines', normalized);
                }
                return;
            }
            // Asignación determinista (1 rutina = 1 huevo; distintas mientras alcance).
            const order = shuffledEggOrder();
            const assigned = funnelState.selectedRoutines.map((_, i) => eggToAssignment(order[i % order.length]));
            setState('assignedRoutines', assigned);
        }

        // Persiste el redemption URL server-side vía set-funnel-redemption.
        // Usa SOLO la config pública/anon del funnel (nunca service_role) y
        // SOLO `redemptionInfo.redeemUrl` (nunca redeemUrlRedirect).
        // Devuelve { ok, status, reason }.
        async function persistRedemptionUrl(planId, claimToken, redemptionUrl) {
            if (!redemptionUrl || !hasRealPlan() || !FUNNEL_CONFIG.enableBackend || !FUNNEL_CONFIG.setRedemptionUrl) {
                return { ok: false, reason: 'not_configurable' };
            }
            const headers = { 'Content-Type': 'application/json' };
            if (FUNNEL_CONFIG.anonKey) {
                headers['apikey'] = FUNNEL_CONFIG.anonKey;
                headers['Authorization'] = 'Bearer ' + FUNNEL_CONFIG.anonKey;
            }
            try {
                const res = await fetch(FUNNEL_CONFIG.setRedemptionUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        planId: funnelState.planId,
                        claimToken: funnelState.claimToken,
                        redemptionUrl: redemptionUrl
                    })
                });
                let data = null;
                try { data = await res.json(); } catch (e) { data = null; }
                if (!res.ok) {
                    return { ok: false, reason: (data && data.error) || ('http_' + res.status) };
                }
                const status = data && data.status;
                if (status === 'set' || status === 'unchanged') {
                    return { ok: true, status: status };
                }
                return { ok: false, reason: 'unexpected_status' };
            } catch (err) {
                return { ok: false, reason: (err && err.message) || 'network_error' };
            }
        }


        // Recovery de persistencia: reintenta SOLO set-funnel-redemption.

        async function retryPendingRedemption() {
            const url = funnelState.pendingRedemptionUrl;
            if (!url || !hasRealPlan()) {
                window.location.reload();
                return;
            }
            const result = await persistRedemptionUrl(funnelState.planId, funnelState.claimToken, url);
            if (result.ok) {
                setState('redemptionPersisted', true);
                setState('handoffReady', true);
                track('redemption_persisted', { status: result.status, retry: true });
                track('handoff_ready', {

                });

                setState('handoffReady', false);
                track('redemption_persist_failed', { reason: result.reason, retry: true });
            }
            renderStep();
        }

        async function ensurePlan() {
            if (funnelState.planId && funnelState.claimToken) {
                return { planId: funnelState.planId, claimToken: funnelState.claimToken };
            }
            const plan = buildUserPlanPayload();
            const counts = {
                tasksCount: plan.metadata.tasksCount,
                routinesCount: plan.metadata.routinesCount,
                totalSelectedCount: plan.metadata.totalSelectedCount,
                campaign: plan.metadata.campaign
            };

            if (!FUNNEL_CONFIG.enableBackend || !FUNNEL_CONFIG.createPlanUrl) {
                ensureClientPlanKey();
                const demo = {
                    planId: 'demo-' + Date.now().toString(36),
                    claimToken: 'demo-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)
                };
                setState('planId', demo.planId);
                setState('claimToken', demo.claimToken);
                track('plan_created', Object.assign({ mode: 'demo' }, counts));
                return demo;
            }

            const clientPlanKey = ensureClientPlanKey();
            track('plan_generation_start', counts);
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (FUNNEL_CONFIG.anonKey) {
                    headers['apikey'] = FUNNEL_CONFIG.anonKey;
                    headers['Authorization'] = `Bearer ${FUNNEL_CONFIG.anonKey}`;
                }
                const attempt = async (key) => {
                    const res = await fetch(FUNNEL_CONFIG.createPlanUrl, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({
                            plan: plan,
                            email: funnelState.email || null,
                            marketing_opt_in: !!funnelState.marketing_optin,
                            source: 'website',
                            campaign: plan.metadata.campaign,
                            client_plan_key: key
                        })
                    });
                    let data = null;
                    try { data = await res.json(); } catch (e) { data = null; }
                    return { res, data };
                };

                let { res, data } = await attempt(clientPlanKey);

                // La clave de este navegador ya no se puede reutilizar tal cual.
                // El backend NO modifica la fila existente en estos 409: solo
                // responde el error. Rotar crea una fila nueva para este email.
                //   plan_expired      → la clave quedó quemada en una fila expired
                //   identity_conflict → la fila ya tiene funnel_user_id de OTRO
                //                      email, así que este email necesita plan propio
                // OJO: no se rotan plan_already_claiming / plan_already_claimed /
                // plan_already_paid. Ahí hay un plan real en curso o pagado y
                // rotar en silencio lo dejaría huérfano; eso se recupera, no se
                // duplica.
                const rotatable409 = res.status === 409 && data &&
                    (data.error === 'plan_expired' || data.error === 'identity_conflict');
                if (rotatable409) {
                    const reason = data.error;
                    resetClientPlanKey();
                    const rotatedKey = ensureClientPlanKey();
                    track('plan_key_rotated', { reason: reason });
                    ({ res, data } = await attempt(rotatedKey));
                }

                if (!res.ok) {
                    const code = (data && data.error) || ('http_' + res.status);
                    throw new Error('create-funnel-plan ' + code);
                }
                if (!data || !data.planId || !data.claimToken) {
                    throw new Error('create-funnel-plan response inválido');
                }
                setState('planId', data.planId);
                setState('claimToken', data.claimToken);
                setState('handoffReady', false);
                track('plan_created', counts);
                return { planId: data.planId, claimToken: data.claimToken };
            } catch (err) {
                track('plan_creation_failed', { reason: (err && err.message) || 'unknown' });
                return null;
            }
        }

            const key = step.key;

            optionEls.forEach((el, index) => {
                const option = step.options[index];
                const label = typeof option === 'string' ? option : option.label;
                const value = typeof option === 'string' ? option : option.value;
                el.addEventListener('click', () => {
                    if (multi) {
                        const arr = funnelState[key];
                        const pos = arr.indexOf(value);
                        if (pos > -1) {
                            arr.splice(pos, 1);
                        } else {
                            arr.push(value);
                        }
                        funnelState[key] = arr;
                        el.classList.toggle('selected');
                        el.setAttribute('aria-pressed', arr.indexOf(value) > -1 ? 'true' : 'false');
                        nextBtn.disabled = arr.length === 0;
                    } else {

                            const isOn = other === el;

        function syncPlanLoadingView(progress) {
            const ready = isPlanLoadingReady(progress);
            PLAN_LOADING_BARS.forEach((bar) => {
                const value = Math.max(0, Math.min(100, progress[bar.key] || 0));
                const root = document.querySelector(`[data-bar="${bar.key}"]`);
                if (!root) {
                    return;
                }
                const track = root.querySelector('.plan-bar-track');
                const fill = root.querySelector('.plan-bar-fill');
                const label = root.querySelector('.plan-bar-value');
                track.setAttribute('aria-valuenow', String(Math.round(value)));
                if (value >= 100) {
                    track.setAttribute('data-complete', 'true');
                }
                fill.style.width = `${value}%`;
                label.textContent = `${Math.round(value)}%`;
                root.dataset.state = value >= 100 ? 'complete' : (value > 0 ? 'running' : 'idle');
            });
            const cta = document.getElementById('nextBtn');
            if (cta) {
                cta.disabled = !ready;
                cta.setAttribute('aria-disabled', String(!ready));
            }
            const lock = document.getElementById('planLoadingLock');
            if (lock) {
                lock.hidden = ready;

        // Avanza una barra con rAF + reloj inyectable. Solo el tiempo visible
        // cuenta: con la pestaña oculta el frame se cancela.
        function startPlanLoadingBar(barKey) {
            stopPlanLoadingBar();
            const progress = planLoadingProgress();
            const startPct = Math.max(0, Math.min(100, progress[barKey] || 0));
            if (startPct >= 100) {
                return;
            }
            planLoadingRuntime.accumulated = 0;
            planLoadingRuntime.startedAt = PLAN_LOADING_CLOCK.now();
            planLoadingRuntime.active = barKey;
            const tick = () => {
                if (planLoadingRuntime.active !== barKey) {
                    return;
                }
                const current = planLoadingProgress();
                const base = Math.max(0, Math.min(100, current[barKey] || 0));
                // Progreso ABSOLUTO a partir del tiempo activo acumulado: si se
                // sumara el delta sobre el valor ya alcanzado, cada frame
                // aceleraria la barra.
                const active = (PLAN_LOADING_CLOCK.now() - planLoadingRuntime.startedAt) + planLoadingRuntime.accumulated;
                // Se completa solo al agotar los 3000 ms reales: floor evita
                // que el redondeo muestre 100% antes de tiempo.
                const completed = active >= PLAN_LOADING_MS;
                const target = Math.min(100, (active / PLAN_LOADING_MS) * 100);
                // Monotono: nunca retrocede, nunca pasa de 100.
                const rounded = completed ? 100 : Math.max(base, Math.floor(target));
                if (rounded > base) {
                    const update = {};
                    update[barKey] = rounded;
                    savePlanLoadingProgress(patchPlanLoading(update));
                    syncPlanLoadingView(planLoadingProgress());
                }
                if (completed) {
                    completePlanLoadingBar(barKey);
                    return;
                }
                planLoadingRuntime.frame = PLAN_LOADING_CLOCK.raf(tick);
            };
            planLoadingRuntime.frame = PLAN_LOADING_CLOCK.raf(tick);
            cancelPlanLoadingRunners = stopPlanLoadingBar;
        }


        function stopPlanLoadingBar() {
            if (planLoadingRuntime.frame !== null) {
                PLAN_LOADING_CLOCK.cancelRaf(planLoadingRuntime.frame);
                planLoadingRuntime.frame = null;
            }
            planLoadingRuntime.active = null;
        }


        // Pausa sin perder el porcentaje: guarda el tiempo ya consumido.
        function pausePlanLoadingBar() {
            if (!planLoadingRuntime.active || planLoadingRuntime.frame === null) {
                return;
            }
            planLoadingRuntime.accumulated += PLAN_LOADING_CLOCK.now() - planLoadingRuntime.startedAt;
            PLAN_LOADING_CLOCK.cancelRaf(planLoadingRuntime.frame);
            planLoadingRuntime.frame = null;
        }


        function resumePlanLoadingBar() {
            const phase = planLoadingProgress().phase;
            const barKey = phase === 'bar_1_running' ? 'bar1'
                : (phase === 'bar_2_running' ? 'bar2' : (phase === 'bar_3_running' ? 'bar3' : null));
            if (barKey && planLoadingRuntime.active !== barKey) {
                const saved = planLoadingRuntime.accumulated;
                planLoadingRuntime.accumulated = saved;
                startPlanLoadingBar(barKey);
            }
        }


        function completePlanLoadingBar(barKey) {
            const nextPhase = barKey === 'bar1' ? 'question_1'
                : (barKey === 'bar2' ? 'question_2' : 'ready');
            const update = { phase: nextPhase };
            update[barKey] = 100;
            savePlanLoadingProgress(patchPlanLoading(update));
            stopPlanLoadingBar();
            syncPlanLoadingView(planLoadingProgress());
            if (nextPhase === 'ready') {
                planLoadingAnnounce(localizedText('Tu plan está listo.', 'Your plan is ready.'));
            } else {
                // label es {es,en}: hay que resolverlo o se anuncia [object Object].
                const bar = PLAN_LOADING_BARS.find((b) => b.key === barKey);
                const label = bar ? bar.label[currentLocale()] : '';
                planLoadingAnnounce(localizedText(`${label} completado.`, `${label} complete.`));
            }
            if (nextPhase === 'question_1' || nextPhase === 'question_2') {
                openPlanLoadingDialog(nextPhase);
            }
        }


        // Modal accesible con <dialog>.showModal(): foco atrapado, fondo
        // inerte. No se cierra con Escape ni con click en backdrop.
        function openPlanLoadingDialog(phase) {
            if (planLoadingRuntime.dialog) {
                return;
            }
            const question = planLoadingQuestion(phase);
            if (!question) {
                return;
            }
            const dialog = document.createElement('dialog');
            dialog.className = 'plan-dialog';
            dialog.setAttribute('aria-labelledby', 'planDialogTitle');
            dialog.innerHTML = `
                <h2 class="plan-dialog-title" id="planDialogTitle">${question.title}</h2>
                <div class="plan-dialog-options">
                    <button class="plan-dialog-option" type="button" data-plan-answer="yes">${question.yes}</button>
                    <button class="plan-dialog-option" type="button" data-plan-answer="no">${question.no}</button>
                </div>`;
            document.body.appendChild(dialog);
            planLoadingRuntime.dialog = dialog;
            dialog.addEventListener('cancel', (event) => {
                // Sin respuesta no se cierra.
                event.preventDefault();
            });
            // Trampa de foco explicita: el ciclo nativo de <dialog> puede caer
            // en body al tabular mas alla del ultimo control.
            dialog.addEventListener('keydown', (event) => {
                if (event.key !== 'Tab') {
                    return;
                }
                const options = [...dialog.querySelectorAll('[data-plan-answer]:not([disabled])')];
                if (!options.length) {
                    return;
                }
                event.preventDefault();
                const index = options.indexOf(document.activeElement);
                const step = event.shiftKey ? -1 : 1;
                options[(index + step + options.length) % options.length].focus();
            });
            dialog.querySelectorAll('[data-plan-answer]').forEach((button) => {
                button.addEventListener('click', () => {
                    // Exactamente una respuesta: el resto queda inutilizable.
                    if (dialog.dataset.answered === 'true') {
                        return;
                    }
                    dialog.dataset.answered = 'true';
                    const isYes = button.dataset.planAnswer === 'yes';
                    dialog.querySelectorAll('[data-plan-answer]').forEach((other) => {
                        other.disabled = true;
                    });
                    const patch = phase === 'question_1'
                        ? { rushedMornings: isYes, phase: 'bar_2_running' }
                        : { wantsScienceBasedMethod: isYes, phase: 'bar_3_running' };
                    savePlanLoadingProgress(patchPlanLoading(patch));
                    if (typeof dialog.close === 'function') {
                        dialog.close();
                    } else {
                        dialog.removeAttribute('open');
                        dialog.remove();
                    }
                    dialog.remove();
                    planLoadingRuntime.dialog = null;
                    // El foco vuelve al contenido logico de la pantalla.
                    const heading = document.querySelector('.step-plan-loading h1');
                    if (heading) {
                        heading.setAttribute('tabindex', '-1');
                        // Marca de foco programatico: no es un control, asi que no
                        // debe mostrar anillo.
                        heading.setAttribute('data-program-focus', 'true');
                        heading.focus();
                    }
                    const after = planLoadingProgress();
                    if (after.phase === 'bar_2_running') {
                        startPlanLoadingBar('bar2');
                    } else if (after.phase === 'bar_3_running') {
                        startPlanLoadingBar('bar3');
                    }
                    syncPlanLoadingView(after);
                });
            });
            if (typeof dialog.showModal === 'function') {
                dialog.showModal();
            } else {
                dialog.setAttribute('open', '');
            }
            const first = dialog.querySelector('[data-plan-answer]');
            if (first) {
                first.focus();
            }
        }

                    resumePlanLoadingBar();

        // Seleccion visual: solo cambia el preview. No escribe en ningun estado.
        function bindEggShowcaseGallery() {
            const gallery = document.querySelector('[data-egg-gallery]');
            if (!gallery) {
                return;
            }
            const thumbs = Array.from(gallery.querySelectorAll('[data-egg-index]'));
            const preview = document.getElementById('eggPreviewImg');
            const eggs = BRAINY_EGG_SHOWCASE;
            if (!preview || !eggs.length) {
                return;
            }

            function selectEgg(next, focusThumb) {
                const clamped = Math.min(Math.max(next, 0), eggs.length - 1);
                eggShowcaseSelection = clamped;
                const egg = eggs[clamped];
                // Un solo cambio de src: el resto del DOM no se toca.
                preview.setAttribute('src', egg.src);
                preview.setAttribute('alt', eggShowcaseAlt(egg));
                thumbs.forEach((t, i) => {
                    const active = i === clamped;
                    t.classList.toggle('is-active', active);
                    t.setAttribute('aria-pressed', String(active));
                });
                if (focusThumb) {
                    thumbs[clamped].focus();
                }
            }

            thumbs.forEach((thumb, i) => {
                thumb.addEventListener('click', () => selectEgg(i, false));
            });

            // flechas, que son la convencion del patron de galeria.
            gallery.addEventListener('keydown', (event) => {

        function setupMethodDemo(total) {
            const pet = document.getElementById('demoPet');
            const microEls = Array.from(document.querySelectorAll('.micro'));
            const doneSet = new Set();
            let autoplay = true;

            function sync() {
                const stage = Math.min(total, doneSet.size);
                pet.setAttribute('data-stage', String(stage));
                microEls.forEach((el, i) => {
                    el.classList.toggle('done', doneSet.has(i));
                });
                if (doneSet.size >= total) {
                    clearTimers();
                }
            }

            const timer = setInterval(() => {
                if (!autoplay) {
                    return;
                }
                for (let i = 0; i < total; i++) {
                    if (!doneSet.has(i)) {
                        doneSet.add(i);
                        sync();
                        return;
                    }
                }
            }, 1000);
            stepTimers.push(timer);

            microEls.forEach((el, i) => {
                el.addEventListener('click', () => {
                    autoplay = false;
                    clearInterval(timer);
                    doneSet.add(i);
                    sync();
                });
            });

            sync();
        }

        // --- Paywall: helpers puros, contador y render ---
        //
        // La oferta dura 15 minutos reales desde la PRIMERA visita al paywall.
        const PAYWALL_OFFER_DURATION_MS = 15 * 60 * 1000;
        const PAYWALL_TICK_MS = 500;

        // Precio real del producto de RevenueCat. El monto NUNCA se parsea del
        // string localizado: se leen los campos numericos del SDK.
        function paywallProductPrice(pkg) {
            const price = pkg && pkg.webBillingProduct ? pkg.webBillingProduct.price : null;
            if (!price || typeof price !== 'object') {
                return { numeric: null, currency: null, formatted: '' };
            }
            let numeric = null;
            if (typeof price.amountMicros === 'number' && Number.isFinite(price.amountMicros) && price.amountMicros > 0) {
                numeric = price.amountMicros / 1e6;
            } else if (typeof price.amount === 'number' && Number.isFinite(price.amount) && price.amount > 0) {
                numeric = price.amount / 100;
            }
            const currency = typeof price.currency === 'string' && price.currency ? price.currency.toUpperCase() : null;
            const formatted = typeof price.formattedPrice === 'string' ? price.formattedPrice : '';
            return { numeric: numeric, currency: currency, formatted: formatted };
        }


        function formatPaywallMoney(amount, currency) {
            if (typeof amount !== 'number' || !Number.isFinite(amount)) {
                return '';
            }
            try {
                // Reglas de decimales de la moneda, sin concatenar simbolos.
                return new Intl.NumberFormat(currentLocale(), { style: 'currency', currency: currency }).format(amount);
            } catch {
                return '';
            }
        }


        // Equivalencias SOLO informativas: nunca alteran el cobro.
        // monthlyDaily = monthly / (365.25 / 12); annualDaily = annual / 365.25.
        // `days` viene del periodo real del producto: 365.25 anual,
        // 365.25 / 12 mensual.
        function paywallDailyEquivalent(product) {
            if (!product || !product.numeric || !product.currency || !product.days) {
                return '';
            }
            const value = formatPaywallMoney(product.numeric / product.days, product.currency);
            return value ? localizedText(`About ${value} per day`, `About ${value} per day`) : '';
        }


        // Comparacion anual: mensual x 12. Solo si ambas monedas coinciden.
        function paywallAnnualComparison(annualProduct, monthlyProduct) {
            const empty = { equivalent: null, savingsPercent: null, equivalentText: '', savingsText: '' };
            if (!annualProduct || !monthlyProduct) return empty;
            if (!annualProduct.numeric || !monthlyProduct.numeric) return empty;
            if (!annualProduct.currency || annualProduct.currency !== monthlyProduct.currency) return empty;
            const equivalent = monthlyProduct.numeric * 12;
            if (!(equivalent > 0)) return empty;
            const raw = 1 - (annualProduct.numeric / equivalent);
            // Math.floor: no exagerar el descuento. 0 o negativo no se muestra.
            const percent = Math.floor(raw * 100);
            const formatted = formatPaywallMoney(equivalent, annualProduct.currency);
            const result = { equivalent: equivalent, savingsPercent: null, equivalentText: '', savingsText: '' };
            if (formatted) {
                result.equivalentText = localizedText(`12 monthly payments: ${formatted}`, `12 monthly payments: ${formatted}`);
            }
            if (raw > 0 && percent >= 1) {
                result.savingsPercent = percent;
                result.savingsText = localizedText(`Save ${percent}%`, `Save ${percent}%`);
            }
            return result;
        }


        // Trial solo si el producto real trae uno reconocible. Si no, null.
        function paywallTrialInfo(pkg) {
            const product = pkg && pkg.webBillingProduct ? pkg.webBillingProduct : null;
            if (!product) return null;
            const trial = product.trialInfo || product.freeTrial || (product.price && product.price.trialInfo) || null;
            if (!trial || typeof trial !== 'object') return null;
            const duration = typeof trial.period === 'object' && trial.period
                ? trial.period
                : (typeof trial.durationDays === 'number' ? { number: trial.durationDays, unit: 'DAY' } : null);
            if (!duration || typeof duration.number !== 'number' || !(duration.number > 0)) return null;
            const unit = String(duration.unit || 'DAY').toUpperCase();
            const labels = {
                DAY: { en: (n) => `${n} ${n === 1 ? 'day' : 'days'}`, es: (n) => `${n} ${n === 1 ? 'día' : 'días'}` },
                WEEK: { en: (n) => `${n} ${n === 1 ? 'week' : 'weeks'}`, es: (n) => `${n} ${n === 1 ? 'semana' : 'semanas'}` },
                MONTH: { en: (n) => `${n} ${n === 1 ? 'month' : 'months'}`, es: (n) => `${n} ${n === 1 ? 'mes' : 'meses'}` }
            };
            const shape = labels[unit];
            if (!shape) return null;
            return { text: (currentLocale() === 'en' ? shape.en : shape.es)(duration.number) };
        }


        // Vencimiento absoluto. Se crea UNA vez y nunca se renueva al rerenderizar.
        function paywallOfferDeadline() {
            const stored = funnelState.paywallOfferExpiresAt;
            if (typeof stored === 'number' && Number.isFinite(stored) && stored > 0) {
                return stored;
            }
            const created = Date.now() + PAYWALL_OFFER_DURATION_MS;
            setState('paywallOfferExpiresAt', created);
            return created;
        }


        function paywallOfferRemaining(deadline) {
            return Math.max(0, (deadline || 0) - Date.now());
        }


        function paywallOfferExpired(deadline) {
            return paywallOfferRemaining(deadline) <= 0;
        }

                                throw new Error('existing_entitlement_not_confirmed');

                                localizedText('Tu suscripción no se volvió a cobrar. No pudimos confirmar el acceso de esta cuenta; inténtalo nuevamente.', 'You were not charged again. We could not confirm this account’s access; try again.'),
