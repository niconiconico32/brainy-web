                if (!hasRealPlan()) {
                    track('checkout_blocked_no_plan', {
                        reason: !FUNNEL_CONFIG.enableBackend ? 'backend_disabled' : 'no_real_plan',
                        tasksCount: funnelState.selectedTasks.length,
                        routinesCount: funnelState.selectedRoutines.length
                    });
                }
                const identity = await prepareIdentifiedAccount();
                if (!identity.ok) {
                    track('checkout_blocked_identity', { reason: identity.error });
                    renderRecovery(localizedText('No pudimos preparar tu cuenta. Inténtalo nuevamente.', 'We could not prepare your account. Try again.'));
                    return;
                }
                let offering = null;
                try {
                    await configureIdentifiedRevenueCat(identity, rcConfig);
                    if (identity.alreadyPro) {
                        if (!(await currentEntitlementIsActive())) {
                            throw new Error('already_pro_entitlement_not_confirmed');
                        }
                        completeIdentifiedHandoffWithoutPurchase();
                        return;
                    }
                    renderStatus(localizedText('Buscando tu plan de pago…', 'Looking for your payment plan…'));
                    offering = await svc.getOfferings(rcConfig.offeringId);
                } catch (e) {
                    const reason = identity.alreadyPro ? 'already_pro_not_confirmed' : 'rc_not_configured';
                    track('checkout_blocked_identity', { reason: reason });
                    renderRecovery(identity.alreadyPro
                        ? localizedText('Tu cuenta figura como Pro, pero no pudimos confirmar ese acceso. No se inició ningún cobro.', 'Your account appears to be Pro, but we could not confirm access. No charge was started.')
                        : localizedText('El pago web no está disponible en este momento. Inténtalo de nuevo en unos minutos.', 'Web payment is not available right now. Try again in a few minutes.'));
                    return;
                }
                if (!offering) {
                    track('purchase_failed', { reason: 'no_offering' });
                    renderRecovery(localizedText('Todavía no hay planes disponibles. Inténtalo de nuevo en unos minutos.', 'No plans are available yet. Try again in a few minutes.'));
                    return;
                }
                const packages = [];
                if (offering.annual) {
                    packages.push({ pkg: offering.annual, kind: 'annual' });
                }
                if (offering.monthly) {
                    packages.push({ pkg: offering.monthly, kind: 'monthly' });
                }
                if (packages.length === 0) {
                    track('purchase_failed', { reason: 'no_packages' });
                    renderRecovery(localizedText('Todavía no hay planes disponibles. Inténtalo de nuevo en unos minutos.', 'No plans are available yet. Try again in a few minutes.'));
                    return;
                }
                // Seleccion inicial: MENSUAL, aunque el anual se muestre primero.
                // Si ya hay seleccion guardada (rerender, volver atras), se respeta.
                let selectedId = funnelState.selectedPackageId;
                if (!packages.some((entry) => entry.pkg.identifier === selectedId)) {
                    const preferred = packages.find((entry) => entry.kind === 'monthly')
                        || packages.find((entry) => entry.kind === 'annual')
                        || packages[0];
                    selectedId = preferred.pkg.identifier;
                }
                const currency = (packages[0].pkg.webBillingProduct &&
                    packages[0].pkg.webBillingProduct.price) ? packages[0].pkg.webBillingProduct.price.currency : null;

                paywallData = { offering: offering, packages: packages, selectedId: selectedId, currency: currency };
                renderPaywallCards();
            }

            function periodLabel(pkg) {
                const product = pkg.webBillingProduct || {};
                if (product.period && product.period.unit) {
                    if (product.period.unit === 'year') {
                        return product.period.number > 1 ? localizedText(`cada ${product.period.number} años`, `every ${product.period.number} years`) : localizedText('por año', 'per year');
                    }
                    if (product.period.unit === 'month') {
                        return product.period.number > 1 ? localizedText(`cada ${product.period.number} meses`, `every ${product.period.number} months`) : localizedText('por mes', 'per month');
                    }
                    if (product.period.unit === 'week') {
                        return localizedText('por semana', 'per week');
                    }
                    if (product.period.unit === 'day') {
                        return localizedText('por día', 'per day');
                    }
                }
                return '';
            }

            // Producto normalizado + dias reales del periodo, para las
            // equivalencias daily. annual = 365.25, monthly = 365.25 / 12.
            function productFacts(pkg, kind) {
                const price = paywallProductPrice(pkg);
                const product = pkg.webBillingProduct || {};
                const unit = product.period && product.period.unit ? product.period.unit : null;
                const number = product.period && product.period.number ? product.period.number : 1;
                let days = null;
                if (unit === 'year') days = 365.25 * number;
                else if (unit === 'month') days = (365.25 / 12) * number;
                else if (kind === 'annual') days = 365.25;
                else if (kind === 'monthly') days = 365.25 / 12;
                return {
                    numeric: price.numeric,
                    currency: price.currency,
                    formatted: price.formatted,
                    days: days
                };
            }

            function priceText(pkg) {
                const price = pkg.webBillingProduct && pkg.webBillingProduct.price ? pkg.webBillingProduct.price : null;
                if (!price) {
                    return '';
                }
                if (price.formattedPrice) {
                    return price.formattedPrice;
                }
                const amount = (price.amountMicros && price.amountMicros > 0) ? price.amountMicros / 1e6 : (price.amount || 0) / 100;
                return `${amount} ${price.currency || ''}`.trim();
            }

            // Datos derivados de los productos REALES, una sola vez por render.
            function offerFacts(data) {
                const annualEntry = data.packages.find((e) => e.kind === 'annual');
                const monthlyEntry = data.packages.find((e) => e.kind === 'monthly');
                return {
                    annual: annualEntry ? productFacts(annualEntry.pkg, 'annual') : null,
                    monthly: monthlyEntry ? productFacts(monthlyEntry.pkg, 'monthly') : null,
                    comparison: paywallAnnualComparison(
                        annualEntry ? productFacts(annualEntry.pkg, 'annual') : null,
                        monthlyEntry ? productFacts(monthlyEntry.pkg, 'monthly') : null
                    )
                };
            }

            function selectedEntry(data) {
                return data.packages.find((entry) => entry.pkg.identifier === data.selectedId) || null;
            }

            function offerCardHtml(entry, facts, deadline) {
                const product = entry.kind === 'annual' ? facts.annual : facts.monthly;
                const sel = entry.pkg.identifier === paywallData.selectedId;
                const trial = paywallTrialInfo(entry.pkg);
                // Precio principal: string localizado del SDK. Sin fallback inventado.
                const mainPrice = product.formatted;
                const daily = paywallDailyEquivalent(product);
                const comparison = entry.kind === 'annual' && facts.comparison ? facts.comparison : null;
                const isAnnual = entry.kind === 'annual';
                return `
                    <label class="plan-card ${sel ? 'selected' : ''}" data-pkg="${entry.pkg.identifier}" for="plan-${entry.kind}">
                        <input class="plan-card-radio" type="radio" name="funnel-plan" id="plan-${entry.kind}"
                            value="${entry.pkg.identifier}" ${sel ? 'checked' : ''}>
                        <span class="plan-card-main">
                            <span class="plan-card-head">
                                <span class="plan-card-title">${isAnnual ? localizedText('Annual plan', 'Annual plan') : localizedText('Monthly plan', 'Monthly plan')}</span>
                                ${isAnnual ? `<span class="plan-badge">${localizedText('Most popular', 'Most popular')}</span>` : ''}
                            </span>
                            <span class="plan-card-price-row">
                                <span class="plan-card-price">${mainPrice}</span>
                                <span class="plan-card-period">${periodLabel(entry.pkg)}</span>
                            </span>
                            ${daily ? `<span class="plan-card-daily">${daily}</span>` : ''}
                            ${comparison && comparison.savingsText ? `<span class="plan-card-save">${comparison.savingsText}</span>` : ''}
                            ${comparison && comparison.equivalentText ? `<span class="plan-card-compare">${comparison.equivalentText}</span>` : ''}
                            ${trial ? `<span class="plan-card-trial">${localizedText('Includes trial', 'Includes trial')}: ${trial.text}</span>` : ''}
                            ${!isAnnual ? `<span class="plan-card-note">${localizedText('Flexible monthly billing', 'Flexible monthly billing')}</span>` : ''}
                        </span>
                        <span class="plan-card-state">
                            <span class="plan-card-check" aria-hidden="true"></span>
                            ${sel ? `<span class="plan-card-selected-text">${localizedText('Selected', 'Selected')}</span>` : ''}
                        </span>
                    </label>`;
            }

            function disclosureHtml(entry, facts) {
                const isAnnual = entry && entry.kind === 'annual';
                const product = isAnnual ? facts.annual : facts.monthly;
                const trial = entry ? paywallTrialInfo(entry.pkg) : null;
                const price = product ? (product.formatted || '') : '';
                const unitWord = isAnnual ? localizedText('year', 'year') : localizedText('month', 'month');
                const planWord = isAnnual ? localizedText('annual', 'annual') : localizedText('monthly', 'monthly');
                let base;
                if (trial) {
                    base = localizedText(
                        `By selecting Claim My Plan, you agree to begin a ${trial.text} trial. Unless cancelled before the trial ends, your subscription will automatically renew at ${price} per ${unitWord}.`,
                        `By selecting Claim My Plan, you agree to begin a ${trial.text} trial. Unless cancelled before the trial ends, your subscription will automatically renew at ${price} per ${unitWord}.`
                    );
                } else {
                    base = localizedText(
                        `By selecting Claim My Plan, you agree to start a ${planWord} Brainy subscription for ${price} per ${unitWord}. You will be charged today. Your subscription renews automatically at the then-current price unless you cancel before the next renewal date.`,
                        `By selecting Claim My Plan, you agree to start a ${planWord} Brainy subscription for ${price} per ${unitWord}. You will be charged today. Your subscription renews automatically at the then-current price unless you cancel before the next renewal date.`
                    );
                }
                const manage = localizedText(
                    'You can manage or cancel your subscription according to the billing provider’s terms.',
                    'You can manage or cancel your subscription according to the billing provider’s terms.'
                );
                return `
                    <p class="paywall-disclosure">${base} ${manage}</p>
                    <p class="paywall-legal">
                        <a href="terms.html" target="_blank" rel="noopener">${localizedText('Terms of Service', 'Terms of Service')}</a>
                        <span aria-hidden="true">·</span>
                        <a href="privacy.html" target="_blank" rel="noopener">${localizedText('Privacy Policy', 'Privacy Policy')}</a>
                        <span aria-hidden="true">·</span>
                        <a href="support.html" target="_blank" rel="noopener">${localizedText('Support', 'Support')}</a>
                    </p>`;
            }

            function secureBlockHtml() {
                return `
                    <div class="paywall-secure">
                        <div class="paywall-secure-head">
                            <span class="paywall-secure-icon" aria-hidden="true"></span>
                            <span class="paywall-secure-title">SECURE CHECKOUT</span>
                        </div>
                        <p class="paywall-secure-text">${localizedText(
                            'Your payment is processed securely. You can manage or cancel your subscription through the billing provider.',
                            'Your payment is processed securely. You can manage or cancel your subscription through the billing provider.'
                        )}</p>
                        <ul class="paywall-secure-list">
                            <li>${localizedText('Secure payment processing', 'Secure payment processing')}</li>
                            <li>${localizedText('Automatic renewal disclosed before purchase', 'Automatic renewal disclosed before purchase')}</li>
                        </ul>
                    </div>`;
            }

            function renderPaywallCards() {
                const data = paywallData;
                const checkoutAllowed = hasRealPlan();
                // Orden visual: anual primero (badge), mensual seleccionado.
                const ordered = data.packages.slice().sort((a, b) => (a.kind === 'annual' ? -1 : 1) - (b.kind === 'annual' ? -1 : 1));
                const facts = offerFacts(data);
                const entry = selectedEntry(data);
                const deadline = paywallOfferDeadline();
                let expired = paywallOfferExpired(deadline);

                root.innerHTML = `
                    ${backButtonHtml()}
                    ${cardOpen('step-paywall')}
                        <div class="card-head paywall-head">
                            <h1>${localizedText('Unlock your personalized Brainy plan', 'Unlock your personalized Brainy plan')}</h1>
                            <p class="sub">${localizedText('Small daily steps. Visible progress. A plan built for you.', 'Small daily steps. Visible progress. A plan built for you.')}</p>
                        </div>
                        <div class="paywall-banner">
                            <span class="paywall-banner-label">${localizedText('THIS OFFER ENDS IN', 'THIS OFFER ENDS IN')}</span>
                            <span class="paywall-countdown" id="paywallCountdown" data-deadline="${deadline}">
                                <span class="paywall-countdown-numbers">
                                    <span class="paywall-countdown-unit"><span class="paywall-countdown-value" id="paywallMinutes">15</span><span class="paywall-countdown-caption">${localizedText('MINUTES', 'MINUTES')}</span></span>
                                    <span class="paywall-countdown-sep" aria-hidden="true">:</span>
                                    <span class="paywall-countdown-unit"><span class="paywall-countdown-value" id="paywallSeconds">00</span><span class="paywall-countdown-caption">${localizedText('SECONDS', 'SECONDS')}</span></span>
                                </span>
                            </span>
                        </div>
                        <p class="sr-only" role="status" aria-live="polite" id="paywallCountdownStatus"></p>
                        <div class="plan-cards">${ordered.map((e) => offerCardHtml(e, facts, deadline)).join('')}</div>
                        <p class="paywall-expired" id="paywallExpired" ${expired ? '' : 'hidden'}>${localizedText('This offer has expired.', 'This offer has expired.')}</p>
                        <p class="manage-subscription-note">${localizedText('Cancela cuando quieras desde el correo de confirmación de pago o en brainyadhd.com/manage-subscription/.', 'Cancel anytime from your payment confirmation email or at brainyadhd.com/manage-subscription/.')}</p>
                        <div class="actions">
                            ${checkoutAllowed && !expired
                                ? `<button class="btn btn-dopamine paywall-cta" type="button" id="purchaseBtn">${localizedText('Claim My Plan', 'Claim My Plan')}</button>`
                                : `<button class="btn btn-dopamine paywall-cta" type="button" id="purchaseBtn" disabled aria-disabled="true">${expired
                                    ? localizedText('This offer has expired.', 'This offer has expired.')
                                    : localizedText('Checkout no disponible en modo demo', 'Checkout unavailable in demo mode')}</button>`}
                        </div>
                        ${disclosureHtml(entry, facts)}
                        ${secureBlockHtml()}
                    </article>`;

                function syncCountdown() {
                    const node = document.getElementById('paywallCountdown');
                    if (!node) {
                        return;
                    }
                    const left = paywallOfferRemaining(deadline);
                    const total = Math.ceil(left / 1000);
                    const minutes = Math.floor(total / 60);
                    const seconds = total % 60;
                    const minutesNode = document.getElementById('paywallMinutes');
                    const secondsNode = document.getElementById('paywallSeconds');
                    if (minutesNode) minutesNode.textContent = String(Math.min(15, minutes)).padStart(2, '0');
                    if (secondsNode) secondsNode.textContent = String(seconds).padStart(2, '0');
                    const isExpired = left <= 0;
                    if (isExpired && !expired) {
                        expired = true;
                        // Bloquea el CTA: ninguna llamada a purchase puede salir.
                        const cta = document.getElementById('purchaseBtn');
                        if (cta) {
                            cta.disabled = true;
                            cta.setAttribute('aria-disabled', 'true');
                            cta.textContent = localizedText('This offer has expired.', 'This offer has expired.');
                        }
                        const note = document.getElementById('paywallExpired');
                        if (note) note.hidden = false;
                        track('paywall_offer_expired', { offeringId: data.offering.identifier });
                    }
                    if (isExpired) {
                        // Cancelamos el intervalo: no sigue contando.
                        if (paywallCleanup) {
                            paywallCleanup();
                            paywallCleanup = null;
                        }
                        return;
                    }
                    // Live region solo en hitos, nunca en cada tick.
                    const status = document.getElementById('paywallCountdownStatus');
                    if (status) {
                        const hit = (minutes === 5 && seconds === 0) ? 'five'
                            : (minutes === 1 && seconds === 0 ? 'one' : null);
                        const msg = hit === 'five'
                            ? localizedText('5 minutes left on this offer.', '5 minutes left on this offer.')
                            : (hit === 'one' ? localizedText('1 minute left on this offer.', '1 minute left on this offer.') : '');
                        if (msg && status.textContent !== msg) {
                            status.textContent = msg;
                        }
                    }
                }

                syncCountdown();
                const timer = setInterval(syncCountdown, PAYWALL_TICK_MS);
                // Sincroniza el vencimiento entre pestanas.
                const onStorage = (event) => {
                    if (event.key !== STORAGE_STATE_KEY) {
                        return;
                    }
                    funnelState = mergeLoadedState(loadState());
                    syncCountdown();
                };
                window.addEventListener('storage', onStorage);
                paywallCleanup = () => {
                    clearInterval(timer);
                    window.removeEventListener('storage', onStorage);
                };

                document.querySelectorAll('.plan-card-radio').forEach((radio) => {
                    radio.addEventListener('change', () => {
                        paywallData.selectedId = radio.value;
                        setState('selectedPackageId', paywallData.selectedId);
                        const picked = data.packages.find((p) => p.pkg.identifier === paywallData.selectedId);
                        if (picked) {
                            track('package_selected', {
                                packageId: picked.pkg.identifier,
                                offeringId: data.offering.identifier,
                                currency: data.currency,
                                packageType: picked.kind
                            });
                        }
                        renderPaywallCards();
                    });
                });

                if (checkoutAllowed) {
                    document.getElementById('purchaseBtn').addEventListener('click', startCheckout);
                }
            }

            async function startCheckout() {
                // Guardas: sin doble compra, sin paquete, sin planId y sin
                // oferta vencida. La expiracion se comprueba ANTES de tocar el SDK.
                if (purchaseLock || !paywallData) {
                    return;
                }
                const data = paywallData;
                const entry = data.packages.find((p) => p.pkg.identifier === data.selectedId);
                if (!entry || !entry.pkg) {
                    track('checkout_blocked_no_package', { reason: 'package_missing' });
                    return;
                }
                if (paywallOfferExpired(paywallOfferDeadline())) {
                    track('checkout_blocked_expired', {
                        packageId: entry.pkg.identifier,
                        offeringId: data.offering.identifier,
                        packageType: entry.kind
                    });
                    const cta = document.getElementById('purchaseBtn');
                    if (cta) {
                        cta.disabled = true;
                        cta.setAttribute('aria-disabled', 'true');
                        cta.textContent = localizedText('This offer has expired.', 'This offer has expired.');
                    }
                    const note = document.getElementById('paywallExpired');
                    if (note) note.hidden = false;
                    return;
                }
                if (!hasRealPlan()) {
                    track('checkout_blocked_no_plan', {
                        reason: !FUNNEL_CONFIG.enableBackend ? 'backend_disabled' : 'no_real_plan'
                    });
                    return;
                }
                purchaseLock = true;
                const btn = document.getElementById('purchaseBtn');
                btn.disabled = true;
                btn.textContent = 'Preparando pago…';
                track('checkout_start', {
                    packageId: entry.pkg.identifier,
                    offeringId: data.offering.identifier,
                    currency: data.currency,
                    packageType: entry.kind,
                    platform: isMobileDevice() ? 'mobile' : 'desktop'
                });
                let result = null;
                let err = null;
                let purchaseTimer = null;
                try {
                    result = await Promise.race([
                        svc.purchase({
                            rcPackage: entry.pkg,
                            planId: funnelState.planId,
                            customerEmail: funnelState.email || undefined,
                            selectedLocale: currentLocale(),
                            defaultLocale: currentLocale(),
                            termsAndConditionsUrl: rcConfig.termsUrl || undefined
                        }),
                        new Promise(function (resolve, reject) {
                            purchaseTimer = setTimeout(function () {
                                var t = new Error('purchase_timeout');
                                t.isTimeout = true;
                                reject(t);
                            }, 120000);
                        })
                    ]);
                } catch (e) {
                    err = e;
                } finally {
                    if (purchaseTimer) {
                        clearTimeout(purchaseTimer);
                        purchaseTimer = null;
                    }
                }
                if (err) {
                    purchaseLock = false;
                    if (err.isTimeout) {
                        track('purchase_failed', { reason: 'timeout' });
                        btn.disabled = false;
                        btn.textContent = localizedText('Activar mi plan →', 'Activate my plan →');
                        try { var ovl = document.getElementById('rcb-ui-pw-root'); if (ovl && ovl.parentNode) { ovl.parentNode.removeChild(ovl); } } catch (e) {}
                        renderRecovery(localizedText('La confirmación del pago está tardando demasiado. No se te volvió a cobrar: revisa tu correo e inténtalo de nuevo.', 'Payment confirmation is taking too long. You were not charged again: check your email and try again.'));
                        setTimeout(function () {
                            var still = document.getElementById('rcb-ui-pw-root');
                            if (still) { window.location.reload(); }
                        }, 5000);
                        return;
                    }
                    const cls = svc.classifyError(err);
                    if (cls.isCancel) {
                        track('checkout_cancelled', { packageId: entry.pkg.identifier });
                        btn.disabled = false;
                        btn.textContent = 'Activar mi plan →';
                        return;
                    }
                    track('purchase_failed', { code: cls.code, reason: cls.kind });
                    btn.disabled = false;
                    btn.textContent = localizedText('Activar mi plan →', 'Activate my plan →');
                    showToast(localizedText('Hubo un problema al iniciar el pago. Inténtalo nuevamente.', 'There was a problem starting payment. Try again.'), 3200);
                    return;
                }
                const isEntitled = svc.isEntitledTo(result.customerInfo, rcConfig.entitlementId);
                const redeemUrl = svc.primaryRedemptionUrlOf(result);
                if (!isEntitled) {
                    purchaseLock = false;
                    track('purchase_failed', { reason: 'entitlement_inactive' });
                    renderRecovery(localizedText('No pudimos confirmar tu suscripción todavía. No se te volvió a cobrar: revisa tu correo e inténtalo de nuevo.', 'We could not confirm your subscription yet. You were not charged again: check your email and try again.'));
                    return;
                }
                // REVENUECAT CONFIRMÓ LA COMPRA. La persistencia server-side del
                // redemption URL es un paso aparte: la compra y el guardado del
                // plan quedan registrados de forma independiente.
                setState('purchaseCompleted', true);
                setState('entitlementConfirmed', true);
                setState('redemptionPersisted', false);
                setState('handoffReady', false);
                track('purchase_success', {
                    packageId: entry.pkg.identifier,
                    offeringId: data.offering.identifier,
                    currency: data.currency,
                    packageType: entry.kind,
                    entitlementActive: true,
                    redemptionAvailable: !!redeemUrl
                });
                if (!redeemUrl) {
                    // The identified RevenueCat user already owns the entitlement.
                    // A redemption URL is optional for this path: the mobile app
                    // logs in with the same Supabase UUID and can finish recovery.
                    purchaseLock = false;
                    setState('pendingRedemptionUrl', null);
                    setState('handoffReady', true);
                    track('handoff_ready', {
                        packageId: entry.pkg.identifier,
                        offeringId: data.offering.identifier,
                        platform: isMobileDevice() ? 'mobile' : 'desktop'
                    });
                    goNext();
                    return;
                }
                setState('pendingRedemptionUrl', redeemUrl);
                btn.disabled = true;
                btn.textContent = 'Guardando tu plan…';
                const persisted = await persistRedemptionUrl(funnelState.planId, funnelState.claimToken, redeemUrl);
                if (persisted.ok) {
                    setState('redemptionPersisted', true);
                    setState('handoffReady', true);
                    track('redemption_persisted', { status: persisted.status });
                    track('handoff_ready', {
                        packageId: entry.pkg.identifier,
                        offeringId: data.offering.identifier,
                        platform: isMobileDevice() ? 'mobile' : 'desktop'
                    });
                    goNext();
                    return;
                }
                // Compra OK pero persistencia falló: recovery que reintenta SOLO
                // set-funnel-redemption. NUNCA se vuelve a ejecutar purchase().
                purchaseLock = false;
                track('redemption_persist_failed', { reason: persisted.reason });
                track('handoff_recovery_required', {
                    packageId: entry.pkg.identifier,
                    offeringId: data.offering.identifier,
                    platform: isMobileDevice() ? 'mobile' : 'desktop'
                });
                    renderRecovery(
                    localizedText('Tu suscripción fue activada, pero no pudimos guardar tu plan en el servidor. No se te volvió a cobrar: toca para reintentarlo.', 'Your subscription is active, but we could not save your plan on the server. You were not charged again: tap to retry.'),
                    () => retryPendingRedemption()
                );
            }

            initPaywall();
        }


/* ============================================================
           Pantalla terminal post-compra. Presentación ÚNICA y sin
           acciones: sustituye a la antigua que pedía instalar la app,
           mostrar un QR y copiar el enlace de activación.

           No hace nada: no compra, no navega, no llama a la app, no
           enlaza a ningún sitio. Solo confirma que la compra y el plan
           se completaron y avisa de que el correo con las instrucciones
           está en camino.

           Se usa "recibirás", nunca "hemos enviado": el webhook puede
           seguir procesando la entrega cuando el usuario ve esto.
           ============================================================ */
        function renderTerminalDone(existingPro) {
            // Icono decorativo: aria-hidden, sin texto alternativo.
            const checkIcon = `
                <div class="done-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" focusable="false">
                        <path d="M5 12.75l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>`;
            const mailIcon = `
                <span class="done-mail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" focusable="false">
                        <rect x="2.75" y="5.25" width="18.5" height="13.5" rx="2.25"
                              stroke="currentColor" stroke-width="1.7"/>
                        <path d="M3.5 7.5l8.5 6 8.5-6" stroke="currentColor" stroke-width="1.7"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>`;

            // alreadyPro: el backend NO emite credenciales nuevas, así que no
            // se promete ningún correo. Solo se confirma el acceso existente.
            const title = existingPro
                ? localizedText('Tu acceso Pro ya está activo', 'Your Pro access is already active')
                : localizedText('Tu plan está listo', 'Your plan is ready');
            const lede = existingPro
                ? localizedText('Tu cuenta ya tiene acceso a Brainy Pro. Puedes cerrar esta ventana e iniciar sesión con tu cuenta habitual.', 'Your account already has access to Brainy Pro. You can close this window and sign in with your usual account.')
                : localizedText('Tu compra se completó correctamente y tu plan personalizado de Brainy ya fue creado.', 'Your purchase completed successfully and your personalized Brainy plan has been created.');

            const mailBlock = existingPro ? '' : `
                <div class="done-mail">
                    ${mailIcon}
                    <div>
                        <p class="done-mail-title">${localizedText('Revisa tu correo', 'Check your email')}</p>
                        <p class="done-mail-text">${localizedText('En pocos segundos recibirás un email con tus datos de acceso y las instrucciones para entrar a Brainy.', 'In a few seconds you’ll receive an email with your access details and the instructions to sign in to Brainy.')}</p>
                    </div>
                </div>
                <p class="done-note">${localizedText('Si no lo encuentras después de unos minutos, revisa las carpetas Spam o Promociones.', 'If you don’t find it after a few minutes, check your Spam or Promotions folders.')}</p>`;

            const closing = existingPro ? '' :
                `<p class="done-close">${localizedText('Puedes cerrar esta ventana.', 'You can close this window.')}</p>`;

            // role="status" + aria-live="polite": el lector de pantalla
            // anuncia la confirmación sin robar el foco. Sin tabindex, sin
            // botones y sin enlaces: nada enfocable.
            document.getElementById('funnelRoot').innerHTML = `
                ${cardOpen('step-done')}
                    <div class="step-done-inner" role="status" aria-live="polite">
                        ${checkIcon}
                        <span class="done-eyebrow">${localizedText('Todo listo', 'All set')}</span>
                        <h1>${title}</h1>
                        <p class="done-lede">${lede}</p>
                        ${mailBlock}
                        ${closing}
                    </div>
                </article>`;
        }


        function renderSuccess(step) {
            const platform = isMobileDevice() ? 'mobile' : 'desktop';
            const redeemUrl = funnelState.pendingRedemptionUrl || null;
            const existingPro = !!funnelState.alreadyPro;
            const entitlementConfirmed = !!funnelState.entitlementConfirmed ||
                (!!funnelState.purchaseCompleted && !!redeemUrl && !!funnelState.redemptionPersisted);
            const ready = (existingPro || (!!funnelState.purchaseCompleted && entitlementConfirmed)) &&
                !!funnelState.handoffReady && hasRealPlan() &&
                (!!redeemUrl ? !!funnelState.redemptionPersisted : true);

            if (!ready) {
                track('handoff_recovery_required', {
                    platform: platform,
                    entitlementActive: !!funnelState.purchaseCompleted,
                    redemptionAvailable: !!redeemUrl,
                    persisted: !!funnelState.redemptionPersisted
                });
                // Recovery que reintenta SOLO la persistencia (nunca purchase()).
                const retry = (!!redeemUrl && hasRealPlan())
                    ? () => retryPendingRedemption()
                    : () => window.location.reload();
                document.getElementById('funnelRoot').innerHTML = `
                    ${cardOpen()}
                        ${headHtml({ ...step, headline: existingPro ? localizedText('Tu cuenta ya está lista', 'Your account is ready') : step.headline })}
                        <div class="paywall-recovery">
                            <p>${redeemUrl
                                ? localizedText('Tu suscripción fue activada, pero no pudimos confirmar el guardado de tu plan. No se te volvió a cobrar: toca para reintentar.', 'Your subscription is active, but we could not confirm that your plan was saved. You were not charged again: tap to retry.')
                                : localizedText('No pudimos confirmar el acceso de esta cuenta. No se inició ningún cobro nuevo; inténtalo nuevamente.', 'We could not confirm this account’s access. No new charge was started; try again.')}</p>
                            <div class="actions">
                                <button class="btn btn-dopamine" type="button" id="retryHandoffBtn">${localizedText('Reintentar', 'Retry')}</button>
                            </div>
                        </div>
                    </article>`;
                const retryBtn = document.getElementById('retryHandoffBtn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', retry);
                }
                return;
            }

            track('purchase_handoff_view', {
                platform: platform,
                tasksCount: funnelState.selectedTasks.length,
                routinesCount: funnelState.selectedRoutines.length
            });
            track('handoff_ready', {
                platform: platform,
                campaign: 'brainy_onboarding_v1'
            });
            ensurePlan();
            window.brainyUserPlanPayload = buildUserPlanPayload();
            renderTerminalDone(existingPro);
        }


        function renderHandoff(step) {
            track('handoff_view', { platform: isMobileDevice() ? 'mobile' : 'desktop' });
            ensurePlan();
            window.brainyUserPlanPayload = buildUserPlanPayload();
            renderTerminalDone(!!funnelState.alreadyPro);
        }


        function isMobileDevice() {
            return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        }


        function todayLabel() {
            const months = currentLocale() === 'en'
                ? ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
                : ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            const d = new Date();
            return `${d.getDate()} ${months[d.getMonth()]}`;
        }


        function renderPicker(step) {
            const data = step.source === 'tasks' ? tasksData : routinesData;
            const key = step.key;
            const min = step.min || 1;
            const max = step.max;
            const selected = funnelState[key];

            let categories = [];
            if (step.source === 'tasks') {
                categories = (data && data.categories || []).map((cat) => ({
                    ...cat,
                    items: (cat.tasks || []).map((task) => makeSelectedTask(task, cat))
                })).filter((cat) => cat.items.length > 0);
            } else {
                categories = routinesByCategory().map((cat) => ({
                    ...cat,
                    items: cat.items.map((routine) => makeSelectedRoutine(routine, cat))
                }));
            }

            const cardsHtml = categories.map((cat, ci) => `
                    <section class="picker-cat picker-cat--${ci + 1}" data-cat="${ci + 1}">
                        <button class="cat-head" type="button" aria-expanded="false" data-cat-toggle="${ci + 1}">
                            <span class="cat-emoji">${cat.emoji}</span>
                            <span class="cat-label">${(CATEGORY_COPY[cat.id] && CATEGORY_COPY[cat.id][currentLocale()]) || cat.label}</span>
                            <span class="cat-count">${cat.items.length}</span>
                            <span class="cat-chev">▾</span>
                        </button>
                        <div class="picker-list" hidden>
                            ${cat.items.map((item) => {
                                const isSel = selected.some((s) => s.id === item.id);
                                const steps = item.subtasks || [];
                                const hasSteps = steps.length > 0;
                                const stepsHtml = steps.map((s, si) => `
                                    <li class="pick-step">
                                        <span class="pick-step-num" aria-hidden="true">${si + 1}</span>
                                        <span class="pick-step-text">
                                            <span class="pick-step-title">${pickLocaleField(s, 'title')}</span>
                                            ${s.duration != null ? `<span class="pick-step-min">${s.duration} ${ui('min')}</span>` : ''}
                                        </span>
                                    </li>`).join('');
                                return `
                                    <div class="pick-row ${isSel ? 'is-selected' : ''}" data-id="${item.id}">
                                        <button type="button" class="pick-card" data-select="${item.id}" aria-pressed="${isSel ? 'true' : 'false'}">
                                            ${item.emoji ? `<span class="pick-emoji">${item.emoji}</span>` : ''}
                                            <span class="pick-body">
                                                <strong>${pickLocaleField(item, 'title')}</strong>
                                                ${hasSteps ? `<span class="pick-meta">${steps.length} ${ui('steps')} · ${ui('tapToSee')}</span>` : ''}
                                            </span>
                                            <span class="pick-check" aria-hidden="true">✓</span>
                                        </button>
                                        ${hasSteps ? `
                                        <button type="button" class="pick-toggle" data-expand="${item.id}" aria-expanded="false" aria-controls="steps-${item.id}">
                                            <span class="pick-chev" aria-hidden="true">▾</span>
                                            <span class="sr-only">${ui('seeSteps')}</span>
                                        </button>
                                        <div class="pick-steps" id="steps-${item.id}" hidden>
                                            <ol class="pick-steps-list">${stepsHtml}</ol>
                                        </div>` : ''}
                                    </div>`;
                            }).join('')}
                        </div>
                    </section>`).join('');

            const dataError = loadDataError || !data
                ? `<div class="data-error">${ui('noData')}</div>`
                : '';

            document.getElementById('funnelRoot').innerHTML = `
                ${backButtonHtml()}
                ${cardOpen()}
                    ${headHtml(step)}
                    ${dataError}
                    <div class="picker-wrap">${cardsHtml}</div>
                    <p class="pick-counter">${ui('selected')} <strong id="pickCount">${selected.length}</strong> · ${ui('minimum')} ${min}, ${ui('upTo')} ${max} ${step.source === 'tasks' ? ui('tasks') : ui('routines')}</p>
                    <div class="actions">
                        <button class="btn btn-dopamine" type="button" id="nextBtn" ${selected.length >= min ? '' : 'disabled'}>${ui('next')}</button>
                    </div>
                </article>`;

            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('pickCount');

            function refreshUI() {
                const sel = funnelState[key];
                counter.textContent = String(sel.length);
                document.querySelectorAll('.pick-row').forEach((row) => {
                    const id = row.dataset.id;
                    const isSel = sel.some((s) => s.id === id);
                    row.classList.toggle('is-selected', isSel);
                    const card = row.querySelector('.pick-card');
                    if (card) {
                        card.setAttribute('aria-pressed', String(isSel));
                    }
                });
                nextBtn.disabled = sel.length < min;
            }

            // Plegable de categoria: solo abre y cierra la lista de tareas.
            document.querySelectorAll('[data-cat-toggle]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const cat = btn.closest('.picker-cat');
                    const list = cat.querySelector('.picker-list');
                    const open = list.hidden;
                    list.hidden = !open;
                    cat.classList.toggle('open', open);
                    btn.setAttribute('aria-expanded', String(open));
                });
            });

            // Desplegable de pasos de cada item. No toca el estado: solo deja
            // ver de que trata antes de elegir. Es independiente del selector.
            document.querySelectorAll('[data-expand]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const row = btn.closest('.pick-row');
                    const steps = row.querySelector('.pick-steps');
                    if (!steps) {
                        return;
                    }
                    const open = steps.hidden;
                    steps.hidden = !open;
                    row.classList.toggle('is-open', open);
                    btn.setAttribute('aria-expanded', String(open));
                });
            });

            document.querySelectorAll('[data-select]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.select;
                    const item = categories.flatMap((c) => c.items).find((i) => (i.id || i.templateId) === id);
                    if (!item) {
                        return;
                    }
                    const pos = funnelState[key].findIndex((s) => (s.id || s.templateId) === id);
                    if (pos > -1) {
                        const fresh = funnelState[key].slice();
                        fresh.splice(pos, 1);
                        funnelState[key] = fresh;
                        track(step.source === 'tasks' ? 'task_selected' : 'routine_selected', { count: fresh.length, templateId: id });
                    } else {
                        if (funnelState[key].length >= max) {
                            showToast(ui('maxOnly', { max }), 2600);
                            return;
                        }
                        funnelState[key] = funnelState[key].concat([item]);
                        track(step.source === 'tasks' ? 'task_selected' : 'routine_selected', { count: funnelState[key].length, templateId: id });
                    }
                    persistState();
                    refreshUI();
                    updateProgress();
                });
            });

            nextBtn.addEventListener('click', () => {
                if (advancing) {
                    return;
                }
                track(step.source === 'tasks' ? 'tasks_complete' : 'routines_complete', {
                    count: funnelState[key].length
                });
                goNext();
            });
        }


        function renderPlanSummary(step) {
            track('plan_summary_view', { tasksCount: funnelState.selectedTasks.length, routinesCount: funnelState.selectedRoutines.length });
            const tasks = funnelState.selectedTasks;
            const routines = funnelState.selectedRoutines;

            const taskRows = tasks.map((item) => `
                    <div class="plan-row">
                        <span class="plan-emoji">${item.emoji || categoryMeta(item.category).emoji}</span>
                        <span class="plan-name">${pickLocaleField(item, 'title')}</span>
                        <span class="plan-meta">${(item.subtasks || []).length} ${ui('steps')}</span>
                    </div>`).join('') || `<div class="data-error">${ui('noTasks')}</div>`;

            const routineRows = routines.map((item, i) => {
                const egg = eggForRoutine(i);
                return `
                    <div class="plan-row">
                        <span class="plan-egg">${eggPlanHtml(egg)}</span>
                        <span class="plan-name">${egg.name} <span class="plan-sep">—</span> ${pickLocaleField(item, 'name')}</span>
                    </div>`;
                }).join('') || `<div class="data-error">${ui('noRoutines')}</div>`;

            document.getElementById('funnelRoot').innerHTML = `
                ${backButtonHtml()}
                ${cardOpen()}
                    ${headHtml(step)}
                    <div class="plan-block">
                        <h4>🎯 ${currentLocale() === 'en' ? 'Your tasks' : 'Tus tareas'}</h4>
                        <p class="plan-note">${currentLocale() === 'en' ? '1–3 tasks selected.' : '1–3 tareas seleccionadas.'}</p>
                        <div class="plan-rows">${taskRows}</div>
                    </div>
                    <div class="plan-block">
                        <h4>🐣 ${currentLocale() === 'en' ? 'Your routines' : 'Tus rutinas'}</h4>
                        <div class="plan-rows">${routineRows}</div>
                    </div>
                    <p class="plan-copy">${currentLocale() === 'en' ? 'Each routine has a companion. Complete it to help it grow.' : 'Cada rutina tiene un compañero. Complétala para ayudarlo a crecer.'}</p>
                    <div class="actions">
                        <button class="btn btn-dopamine" type="button" id="nextBtn">${step.cta}</button>
                    </div>
                </article>`;

            bindEggPlanFallbacks();

            document.getElementById('nextBtn').addEventListener('click', () => {
                if (advancing) {
                    return;
                }
                goNext();
            });
        }


        function renderStep() {
            clearTimers();
            advancing = false;
            const rawStep = stepList()[currentStepIndex];
            const step = localizedStep(rawStep);
            document.body.classList.toggle('begin-active', step.type === 'begin');
            syncStageLabels();
            document.title = step.questionIndex
                ? (currentLocale() === 'en' ? `Brainy — Question ${step.questionIndex} of ${QUESTION_KEYS.length}` : `Brainy — Pregunta ${step.questionIndex} de ${QUESTION_KEYS.length}`)
                : (currentLocale() === 'en' ? 'Brainy — Your system and companion' : 'Brainy — Tu sistema y tu mascota');

            if (step.type === 'language') {
                renderLanguage();
            } else if (step.type === 'begin') {
                renderBegin(step);
            } else if (step.type === 'question') {
                renderQuestion(step);
            } else if (step.type === 'interstitial') {
                renderInterstitial(step);
            } else if (step.type === 'task_select' || step.type === 'routine_select') {
                renderPicker(step);
            } else if (step.type === 'plan_summary') {
                renderPlanSummary(step);
            } else if (step.type === 'contact') {
                renderContact(step);
            } else if (step.type === 'presell') {
                renderPresell(step);
            } else if (step.type === 'paywall') {
                renderPaywall(step);
            } else if (step.type === 'success') {
                renderSuccess(step);
            } else if (step.type === 'handoff') {
                renderHandoff(step);
            }

            updateProgress();
            scrollTop();
        }


        if (new URLSearchParams(window.location.search).get('reset') !== null) {
            localStorage.removeItem(STORAGE_STATE_KEY);
            localStorage.removeItem(STORAGE_STEP_KEY);
            history.replaceState(null, '', window.location.pathname);
        }


        document.getElementById('funnelBackBtn').innerHTML = BACK_ARROW_SVG;

        funnelState = mergeLoadedState(loadState());
        currentStepIndex = funnelState.locale ? loadStep() : 0;
        persistState();
        document.documentElement.lang = currentLocale();

        document.addEventListener('click', (event) => {
            const el = event.target.closest ? event.target.closest('[data-action="back"]') : null;
            if (el) {
                goBack();
            }
        });

        loadFunnelData().then(() => {
            hydrateSelections();
            ensureEggAssignment();
            renderStep();
        });
    </script>
</body>
</html>
