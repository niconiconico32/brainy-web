<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Brainy — Tu sistema + tu mascota</title>
    <meta name="description" content="Dos minutos. Diez preguntas. Una mascota que empieza a crecer con cada paso pequeño.">
    <style>
        :root {
            --bg: #f4f1ea;
            --panel: rgba(255, 255, 255, 0.76);
            --panel-strong: rgba(255, 255, 255, 0.94);
            --text: #24123f;
            --muted: rgba(36, 18, 63, 0.68);
            --accent: #5b4bf4;
            --accent-2: #f2c94c;
            --dopamine: #c9fd5a;
            --success: #178a4a;
            --danger: #d33c3c;
            --border: rgba(36, 18, 63, 0.12);
            --shadow: 0 24px 70px rgba(36, 18, 63, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(91, 75, 244, 0.18), transparent 32%),
                radial-gradient(circle at top right, rgba(242, 201, 76, 0.22), transparent 24%),
                linear-gradient(180deg, #fffdf8 0%, var(--bg) 55%, #efe8dd 100%);
            line-height: 1.5;
        }

        .shell {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 20px 16px 56px;
        }

        .funnel-progress {
            position: sticky;
            top: 0;
            z-index: 40;
            padding: 14px 4px 10px;
            background: linear-gradient(180deg, #fffdf8 0%, rgba(255, 253, 248, 0.9) 70%, transparent 100%);
        }

        .funnel-progress-track {
            height: 10px;
            border-radius: 999px;
            background: rgba(36, 18, 63, 0.08);
            overflow: hidden;
        }

        .funnel-progress-track span {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width 0.35s ease;
        }

        .funnel-progress-label {
            display: block;
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .funnel-root > .step {
            animation: fadeUp 0.35s ease both;
        }

        .step-top {
            display: flex;
            align-items: flex-start;
            margin-bottom: 14px;
            min-height: 46px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border: 0;
            border-radius: 999px;
            background: rgba(36, 18, 63, 0.07);
            color: var(--text);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease;
        }

        .back-btn:hover {
            transform: translateY(-1px);
            background: rgba(36, 18, 63, 0.12);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 26px 24px 30px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(91, 75, 244, 0.1);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h1, h2, h3 {
            letter-spacing: -0.03em;
        }

        .card-head h1 {
            margin-top: 14px;
            font-size: clamp(1.7rem, 6vw, 2.35rem);
            line-height: 1.08;
            font-weight: 900;
        }

        .card-head .sub {
            margin-top: 12px;
            font-size: 1.02rem;
            line-height: 1.6;
            color: var(--muted);
        }

        .options {
            display: grid;
            gap: 12px;
            margin-top: 22px;
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-height: 56px;
            padding: 15px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--panel-strong);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .opt:hover {
            transform: translateY(-1px);
        }

        .opt.selected {
            border-color: rgba(91, 75, 244, 0.55);
            background: rgba(91, 75, 244, 0.07);
            box-shadow: 0 0 0 3px rgba(91, 75, 244, 0.12);
        }

        .opt-emoji {
            font-size: 1.7rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .opt-body {
            flex: 1;
            min-width: 0;
        }

        .opt-label {
            display: block;
            font-weight: 800;
            font-size: 1.02rem;
        }

        .opt-desc {
            display: block;
            margin-top: 2px;
            font-size: 0.88rem;
            color: var(--muted);
        }

        .opt-check {
            width: 24px;
            height: 24px;
            border-radius: 999px;
            border: 2px solid rgba(36, 18, 63, 0.18);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
            color: transparent;
            flex-shrink: 0;
        }

        .opt.selected .opt-check {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .note {
            margin-top: 16px;
            padding: 15px 17px;
            border-radius: 18px;
            background: rgba(242, 201, 76, 0.14);
            border: 1px solid rgba(242, 201, 76, 0.4);
            color: var(--text);
            font-size: 0.96rem;
            line-height: 1.55;
            animation: fadeUp 0.3s ease both;
        }

        .field {
            margin-top: 16px;
        }

        .field:first-child {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"] {
            width: 100%;
            border: 1px solid rgba(36, 18, 63, 0.14);
            border-radius: 16px;
            background: var(--panel-strong);
            color: var(--text);
            padding: 15px 16px;
            font: inherit;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: rgba(91, 75, 244, 0.7);
            box-shadow: 0 0 0 4px rgba(91, 75, 244, 0.14);
        }

        .field-error {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--danger);
            display: none;
        }

        .check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.5;
            cursor: pointer;
        }

        .check input {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .actions {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 52px;
            width: 100%;
            padding: 13px 20px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-size: 1.03rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, opacity 0.18s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-dopamine {
            background: var(--dopamine);
            color: var(--text);
            box-shadow: 0 14px 30px rgba(201, 253, 90, 0.38);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 14px 30px rgba(91, 75, 244, 0.24);
        }

        .btn-secondary {
            background: rgba(36, 18, 63, 0.08);
            color: var(--text);
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            box-shadow: none;
        }

        .btn-ghost:hover {
            background: rgba(36, 18, 63, 0.06);
        }

        .lead {
            margin-top: 18px;
            font-size: 1.05rem;
            line-height: 1.65;
            color: var(--muted);
        }

        .lead + .actions {
            margin-top: 26px;
        }

        .body-copy {
            margin-top: 16px;
            font-size: 1.02rem;
            line-height: 1.6;
            color: var(--muted);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
        }

        .brand-row svg {
            width: 40px;
            height: 40px;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 900;
        }

        .brand-name span {
            color: var(--accent);
        }

        .mascot-hero {
            text-align: center;
            margin: 8px 0 4px;
        }

        .mascot-hero .egg,
        .mascot-hero .pet {
            margin: 0 auto;
        }

        .pet-stage {
            position: relative;
            width: 168px;
            height: 168px;
            margin: 0 auto;
        }

        .egg {
            position: absolute;
            left: 50%;
            bottom: 4px;
            transform: translateX(-50%);
            width: 118px;
            height: 148px;
            border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
            background: linear-gradient(180deg, #fffdf5 20%, #f1e7ff 100%);
            box-shadow: inset -14px -18px 30px rgba(91, 75, 244, 0.12), 0 14px 30px rgba(36, 18, 63, 0.16);
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .egg::before,
        .egg::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 11px;
            border-radius: 50%;
            background: rgba(91, 75, 244, 0.18);
        }

        .egg::before {
            top: 44%;
            left: 26%;
        }

        .egg::after {
            top: 58%;
            right: 24%;
        }

        .egg.cracked::after {
            background: linear-gradient(135deg, rgba(36, 18, 63, 0.4) 0 2px, transparent 2px 100%);
            width: 30px;
            height: 26px;
            right: 34%;
            top: 26%;
            border-radius: 0;
            transform: rotate(18deg);
        }

        .pet {
            position: absolute;
            left: 50%;
            bottom: 2px;
            transform: translateX(-50%) scale(0.75);
            opacity: 0;
            filter: drop-shadow(0 0 0px rgba(201, 253, 90, 0));
            transition: transform 0.45s ease, opacity 0.45s ease, filter 0.45s ease;
        }

        .pet svg {
            display: block;
            width: 150px;
            height: 150px;
        }

        .pet-stage[data-stage="1"] .pet {
            opacity: 0.35;
            transform: translateX(-50%) scale(0.78);
        }

        .pet-stage[data-stage="2"] .pet {
            opacity: 0.6;
            transform: translateX(-50%) scale(0.87);
        }

        .pet-stage[data-stage="3"] .pet {
            opacity: 0.85;
            transform: translateX(-50%) scale(0.95);
        }

        .pet-stage[data-stage="4"] .pet {
            opacity: 1;
            transform: translateX(-50%) scale(1.05);
            filter: drop-shadow(0 0 18px rgba(201, 253, 90, 0.75));
        }

        .pet-stage[data-stage="4"] .egg {
            transform: translateX(-50%) translateY(6px) scale(0.92);
            opacity: 0.25;
        }

        .sparkle {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 2rem;
            opacity: 0;
            transform: scale(0.4) rotate(-20deg);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .pet-stage[data-stage="4"] .sparkle {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .step-caption {
            margin-top: 18px;
            text-align: center;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--muted);
        }

        .micro-list {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        .micro {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 54px;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel-strong);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
        }

        .micro:hover {
            transform: translateY(-1px);
        }

        .micro.done {
            border-color: rgba(23, 138, 74, 0.3);
            background: rgba(23, 138, 74, 0.08);
        }

        .micro .micro-num {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(91, 75, 244, 0.09);
            color: var(--accent);
            font-weight: 900;
            flex-shrink: 0;
        }

        .micro.done .micro-num {
            background: var(--success);
            color: #fff;
        }

        .micro-label {
            flex: 1;
            font-weight: 800;
            font-size: 0.98rem;
        }

        .curves {
            margin-top: 22px;
        }

        .curves-card {
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--panel-strong);
            padding: 20px 18px 18px;
        }

        .curves-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .legend {
            list-style: none;
            display: grid;
            gap: 14px;
            margin-top: 18px;
        }

        .legend li {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .legend-dot {
            width: 30px;
            height: 8px;
            border-radius: 999px;
            margin-top: 7px;
            flex-shrink: 0;
        }

        .legend-dot.bad {
            background: repeating-linear-gradient(90deg, #b9b0d6 0 7px, transparent 7px 12px);
        }

        .legend-dot.good {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }

        .legend strong {
            display: block;
            font-size: 0.98rem;
        }

        .legend p {
            margin-top: 2px;
            font-size: 0.86rem;
            color: var(--muted);
        }

        .loading-list {
            list-style: none;
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        .loading-item {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 15px 16px;
            border-radius: 18px;
            background: var(--panel-strong);
            border: 1px solid var(--border);
            font-weight: 700;
            opacity: 0.25;
            transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.4s ease;
        }

        .loading-item.active {
            opacity: 1;
            transform: translateY(0);
        }

        .loading-item.done {
            border-color: rgba(23, 138, 74, 0.28);
        }

        .loading-pill {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(91, 75, 244, 0.1);
            color: var(--accent);
            font-size: 0.85rem;
        }

        .loading-item.done .loading-pill {
            background: rgba(23, 138, 74, 0.14);
            color: var(--success);
        }

        .loading-spin {
            border: 2px solid rgba(91, 75, 244, 0.18);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            animation: spin 0.7s linear infinite;
        }

        .loading-final {
            margin-top: 20px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--success);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .loading-final.visible {
            opacity: 1;
        }

        .loading-hint {
            margin-top: 10px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--muted);
        }

        .picker-cat {
            margin-top: 24px;
        }

        .picker-cat:first-of-type {
            margin-top: 20px;
        }

        .cat-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
        }

        .cat-head .cat-emoji {
            font-size: 1.3rem;
            filter: none;
        }

        .picker-list {
            display: grid;
            gap: 10px;
        }

        .pick-card {
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--panel-strong);
            overflow: hidden;
        }

        .pick-card.selected {
            border-color: rgba(91, 75, 244, 0.5);
            box-shadow: 0 0 0 3px rgba(91, 75, 244, 0.1);
        }

        .pick-head {
            display: flex;
            align-items: stretch;
        }

        .pick-expand {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 62px;
            padding: 12px 14px;
            border: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .pick-emoji {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .pick-body {
            flex: 1;
            min-width: 0;
        }

        .pick-body strong {
            display: block;
            font-size: 0.98rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .pick-meta {
            display: block;
            margin-top: 3px;
            font-size: 0.84rem;
            color: var(--muted);
        }

        .pick-chev {
            font-size: 0.9rem;
            color: var(--muted);
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .pick-card.open .pick-chev {
            transform: rotate(180deg);
        }

        .pick-check {
            width: 54px;
            flex-shrink: 0;
            border: 0;
            border-left: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 900;
            color: rgba(36, 18, 63, 0.22);
            transition: background 0.18s ease, color 0.18s ease;
        }

        .pick-card.selected .pick-check {
            background: rgba(91, 75, 244, 0.1);
            color: var(--accent);
        }

        .pick-steps {
            padding: 4px 14px 16px 16px;
            border-top: 1px dashed var(--border);
        }

        .pick-steps[hidden] {
            display: none;
        }

        .pick-steps ol {
            margin: 14px 0 0;
            padding-left: 20px;
            display: grid;
            gap: 8px;
            font-size: 0.93rem;
            line-height: 1.5;
            color: var(--text);
        }

        .pick-counter {
            margin-top: 18px;
            text-align: center;
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--muted);
        }

        .pick-counter strong {
            color: var(--accent);
}

        .data-error {
            margin-top: 22px;
            padding: 18px;
            border-radius: 18px;
            background: rgba(211, 60, 60, 0.1);
            color: var(--danger);
            font-weight: 700;
            text-align: center;
        }

        .plan-block {
            margin-top: 26px;
        }

        .plan-block h4 {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 1rem;
            font-weight: 900;
            color: var(--text);
        }

        .plan-note {
            margin: 6px 0 0;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--muted);
        }

        .plan-rows {
            margin-top: 12px;
            display: grid;
            gap: 10px;
        }

        .plan-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--panel-strong);
            border: 1px solid rgba(91, 75, 244, 0.2);
        }

        .plan-emoji {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .plan-egg {
            width: 40px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            box-shadow: inset -4px -6px 10px rgba(36, 18, 63, 0.18);
        }

        .plan-name {
            flex: 1;
            font-size: 0.94rem;
            font-weight: 800;
            line-height: 1.4;
            color: var(--text);
        }

        .plan-sep {
            color: var(--muted);
            font-weight: 400;
        }

        .plan-meta {
            flex-shrink: 0;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--muted);
        }

        .plan-copy {
            margin-top: 26px;
            padding: 16px 18px;
            border-radius: 16px;
            background: rgba(201, 253, 90, 0.14);
            border: 1px dashed rgba(36, 18, 63, 0.25);
            font-size: 0.92rem;
            line-height: 1.6;
            font-weight: 700;
            color: var(--muted);
            text-align: center;
        }

        .app-mock {
            margin-top: 22px;
            border: 1px solid var(--border);
            border-radius: 26px;
            background: var(--panel-strong);
            overflow: hidden;

    <script>
        const STORAGE_STATE_KEY = 'brainy_funnel_state';

        const QUESTION_KEYS = ['q1_estado_actual', 'q2_dolor', 'q3_intentos_previos', 'q4_causa_fracaso', 'q5_identidad_futura', 'q6_area_prioritaria', 'q7_compromiso', 'q8_tiempo_disponible', 'q9_listo', 'q10_cuando_empezar'];

        const CATEGORIES = [
            { id: 'foco_productividad', emoji: '🧠', label: 'Foco & Productividad' },
            { id: 'rutinas_organizacion', emoji: '🏠', label: 'Rutinas & Organización personal' },
            { id: 'salud_energia', emoji: '💪', label: 'Salud & Energía' },
            { id: 'calma_regulacion', emoji: '😌', label: 'Calma & Regulación emocional' }
        ];

        // Fuente de verdad (confirmada por backend): egg_catalog.id NUMÉRICO 1–8.
        // El funnel SOLO asigna estos 8 huevos comunes; no se crean slugs nuevos.
        // El nombre visible es el canónico del egg_catalog.id. `emoji`/`color` son
        // solo presentación local (la app resuelve su propio asset por catalogId).
        const EGGS = [
            { catalogId: 1, name: 'Terra', emoji: '🌍', color: '#7d9b76', imageUrl: null },
            { catalogId: 2, name: 'Aqua', emoji: '💧', color: '#5bc0eb', imageUrl: null },
            { catalogId: 3, name: 'Flame', emoji: '🔥', color: '#ec7063', imageUrl: null },
            { catalogId: 4, name: 'Storm', emoji: '⚡', color: '#f2c94c', imageUrl: null },
            { catalogId: 5, name: 'Leaf', emoji: '🍃', color: '#58d68d', imageUrl: null },
            { catalogId: 6, name: 'Stone', emoji: '🪨', color: '#9aa0a6', imageUrl: null },
            { catalogId: 7, name: 'Crystal', emoji: '💎', color: '#a99bff', imageUrl: null },
            { catalogId: 8, name: 'Shadow', emoji: '🌑', color: '#5d5b7a', imageUrl: null }
        ];

        // Slugs del funnel anterior: SOLO compatibilidad con localStorage/estado
        // viejo. Nunca son identidad canónica ni se envían al backend.
        const LEGACY_EGG_SLUG_TO_ID = {
            huevo_nebulosa: 1,
            huevo_solar: 2,
            huevo_oceano: 3,
            huevo_bosque: 4,
            huevo_cielo: 5,
            huevo_lava: 6,
            huevo_flor: 7,
            huevo_estrella: 8
        };

        // Normaliza cualquier representación (id numérico, string numérico o slug
        // legacy) al huevo canónico. Devuelve null si no es reconocible.
        function canonicalEgg(raw) {
            if (raw === null || raw === undefined) {
                return null;
            }
            let id = null;
            if (typeof raw === 'number') {
                id = raw;
            } else if (typeof raw === 'object') {
                const cid = raw.catalogId;
                if (typeof cid === 'number') {
                    id = cid;
                } else if (typeof cid === 'string') {
                    id = /^\d+$/.test(cid) ? Number(cid) : (LEGACY_EGG_SLUG_TO_ID[cid] || null);
                }
                if (id === null && typeof raw.id === 'string') {
                    id = LEGACY_EGG_SLUG_TO_ID[raw.id] || null;
                }
            }
            if (!Number.isInteger(id) || id < 1 || id > EGGS.length) {
                return null;
            }
            return EGGS[id - 1];
        }

        const ROUTINES_JSON_URL = 'brainy-daily-routines.json';

        const FUNNEL_CONFIG = {

            supabaseUrl: 'https://auth.brainyadhd.com',
            anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkcXdncWZpc2l0ZXN3YmJkdXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1MDgxNTUsImV4cCI6MjA4MTA4NDE1NX0.oLadI1C5H89CWqGAz0NjDjbp_zwDGsl726YMVvlqIYg',
            createPlanUrl: 'https://auth.brainyadhd.com/functions/v1/create-funnel-plan',
            eggCatalogUrl: '',
            iosStoreUrl: '',
            androidStoreUrl: '',
            analyticsEndpoint: '',
            revenuecatWebApiKey: '',

        const __deployedConfig__ = window.__BRAINY_FUNNEL_CONFIG__;
        if (__deployedConfig__ && typeof __deployedConfig__ === 'object') {
            Object.keys(__deployedConfig__).forEach((key) => {
                if (key in FUNNEL_CONFIG) {
                    FUNNEL_CONFIG[key] = __deployedConfig__[key];
                }
            });
        }

        const FUNNEL_EXPERIMENTS = {

            webCheckout: true
        };

        window.brainyAnalyticsQueue = [];

        let tasksData = null;
        let routinesData = null;
        let loadDataError = null;

        async function loadFunnelData() {
            try {
                const [tasksRes, routinesRes] = await Promise.all([
                    fetch(TASKS_JSON_URL).then((res) => res.json()),
                    fetch(ROUTINES_JSON_URL).then((res) => res.json())
                ]);
                tasksData = tasksRes;
                routinesData = routinesRes;
            } catch (err) {
                loadDataError = err;
            }
        }

        function routinesByCategory() {
            const grouped = CATEGORIES.map((cat) => ({
                ...cat,
                items: (routinesData.daily_routines || []).filter((r) => r.category === cat.id)
            }));
            return grouped.filter((cat) => cat.items.length > 0);
        }

        function categoryMeta(id) {
            return CATEGORIES.find((c) => c.id === id) || { emoji: '✅', label: 'Otros' };
        }

        const DEFAULT_STATE = {
            q1_estado_actual: null,
            q2_dolor: [],
            q3_intentos_previos: null,
            q4_causa_fracaso: null,
            q5_identidad_futura: null,
            q6_area_prioritaria: null,
            q7_compromiso: null,
            q8_tiempo_disponible: null,
            q9_listo: null,
            q10_cuando_empezar: null,
            edad: null,
            email: null,
            marketing_optin: false,
            selectedTasks: [],
            selectedRoutines: [],
            assignedRoutines: [],
            previewInteracted: false,
            emailSubmitted: false,
            completedAt: null,
            planId: null,
            claimToken: null,

        function funnelWebCheckout() {
            if (!FUNNEL_EXPERIMENTS.webCheckout) {
                return false;
            }
            const key = FUNNEL_CONFIG.revenuecatWebApiKey;
            if (!key) {
                return false;
            }
            const rcSvc = window.BrainyRevenueCat;
            if (rcSvc && typeof rcSvc.isSafePublicKey === 'function') {
                return rcSvc.isSafePublicKey(key);
            }
            return !/^(sk|rk|rp|whsec|tok|req)_/i.test(key) && !/(secret|restricted)/i.test(key);
        }

        function stepList() {
            const checkout = funnelWebCheckout();
            return FUNNEL_STEPS.filter((step) => {
                if (!checkout) {
                    return step.type !== 'paywall' && step.type !== 'success';
                }
                if (FUNNEL_EXPERIMENTS.showPrePaywall === false && step.type === 'presell') {
                    return false;
                }
                return true;
            });
        }

        function mergeLoadedState(raw) {
            const safe = raw && typeof raw === 'object' ? raw : {};
            const merged = JSON.parse(JSON.stringify(DEFAULT_STATE));
            for (const key of Object.keys(merged)) {
                if (Object.prototype.hasOwnProperty.call(safe, key)) {
                    merged[key] = safe[key];
                }
            }
            if (!Array.isArray(merged.q2_dolor)) {
                merged.q2_dolor = [];
            }
            if (!Array.isArray(merged.selectedTasks)) {
                merged.selectedTasks = [];
            }
            if (!Array.isArray(merged.selectedRoutines)) {
                merged.selectedRoutines = [];
            }
            if (!Array.isArray(merged.assignedRoutines)) {
                merged.assignedRoutines = [];
            }
            return merged;
        }

        function loadState() {
            try {
                return mergeLoadedState(JSON.parse(localStorage.getItem(STORAGE_STATE_KEY) || 'null'));
            } catch {
                return JSON.parse(JSON.stringify(DEFAULT_STATE));
            }
        }

        function persistState() {
            localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(funnelState));
            window.brainyFunnelState = funnelState;
        }

        function loadStep() {
            const raw = parseInt(localStorage.getItem(STORAGE_STEP_KEY), 10);
            if (!Number.isFinite(raw) || raw < 0 || raw >= stepList().length) {
                return 0;
            }
            return raw;
        }

        function persistStep() {
            localStorage.setItem(STORAGE_STEP_KEY, String(currentStepIndex));
        }

        function clearTimers() {
            stepTimers.forEach((timer) => {
                clearTimeout(timer);
                clearInterval(timer);
            });
            stepTimers = [];

        function answeredCount() {
            return QUESTION_KEYS.filter((key) => {
                const value = funnelState[key];
                if (key === 'q2_dolor') {
                    return Array.isArray(value) && value.length > 0;
                }
                return value !== null && value !== undefined;
            }).length;
        }

        function updateProgress() {
            const step = stepList()[currentStepIndex];
            if (step.type === 'begin') {

            const progress = document.getElementById('funnelProgress');
            const fill = document.getElementById('funnelProgressFill');
            const label = document.getElementById('funnelProgressLabel');

            clearTimers();

        const FORBIDDEN_ANALYTICS_KEYS = /^(email|mail|claim_?token|claim_?token_?hash|redemption_?url|redemption_?token|token|jwt|authorization|redeem_?url)$/i;

        function safeAnalyticsMetadata(metadata) {
            const out = {};
            if (metadata && typeof metadata === 'object') {
                Object.keys(metadata).forEach((key) => {
                    if (!FORBIDDEN_ANALYTICS_KEYS.test(key)) {
                        out[key] = metadata[key];
                    }
                });
            }
            return out;
        }

        function track(event, metadata) {
            const data = { event: event, metadata: safeAnalyticsMetadata(metadata) };
            if (window.brainyAnalyticsQueue) {
                window.brainyAnalyticsQueue.push(data);
            }
            try {
                if (FUNNEL_CONFIG.analyticsEndpoint) {
                    navigator.sendBeacon(FUNNEL_CONFIG.analyticsEndpoint, JSON.stringify(data));
                }
            } catch {
                // analytics es best-effort: nunca debe bloquear el funnel
            }
            if (window.console && console.debug) {
                console.debug('[funnel-analytics]', event, data.metadata);
            }
        }

        function hydrateSelections() {
            const taskCats = tasksData && tasksData.categories ? tasksData.categories : [];
            const allTaskCats = taskCats.map((cat) => ({
                category: cat,
                items: cat.tasks || []
            }));
            const routines = routinesData && routinesData.daily_routines ? routinesData.daily_routines : [];
            let changed = false;

            funnelState.selectedTasks = funnelState.selectedTasks.map((old) => {
                const tplId = old.templateId || old.id;
                if (tplId && old.subtasks && old.name === undefined) {
                    let found = null;
                    let catObj = null;
                    for (const group of allTaskCats) {
                        const t = group.items.find((item) => item.templateId === tplId);
                        if (t) {
                            found = t;
                            catObj = group.category;
                            break;
                        }
                    }
                    if (found) {
                        changed = true;
                        return makeSelectedTask(found, catObj);
                    }
                }
                return old;
            });

            funnelState.selectedRoutines = funnelState.selectedRoutines.map((old) => {
                const tplId = old.templateId || old.id;
                if (tplId && old.tasks === undefined) {
                    const r = routines.find((item) => item.templateId === tplId);
                    if (r) {
                        const catObj = CATEGORIES.find((c) => c.id === r.category) || null;
                        changed = true;
                        return makeSelectedRoutine(r, catObj);
                    }
                }
                return old;
            });

            if (changed) {
                persistState();
            }
        }

        function shuffledEggOrder() {
            const seedStr = (funnelState.selectedRoutines[0] && funnelState.selectedRoutines[0].templateId) || 'brainy';
            let seed = 0;
            for (let i = 0; i < seedStr.length; i++) {
                seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
            }
            const order = EGGS.slice();
            for (let i = order.length - 1; i > 0; i--) {
                seed = (seed * 1103515245 + 12345) >>> 0;
                const j = seed % (i + 1);
                const tmp = order[i];
                order[i] = order[j];
                order[j] = tmp;
            }
            return order;
        }

        function eggToAssignment(egg) {
            return {
                catalogId: egg.catalogId,
                name: egg.name,
                emoji: egg.emoji,
                color: egg.color,
                imageUrl: egg.imageUrl || null
            };
        }

        function ensureEggAssignment() {
            const count = funnelState.selectedRoutines.length;
            const current = funnelState.assignedRoutines || [];
            if (count === 0) {
                if (current.length > 0) {
                    setState('assignedRoutines', []);
                }
                return;
            }
            // Normaliza estado viejo (slugs `huevo_*`) a catalogId numérico.
            const normalized = current
                .map(canonicalEgg)
                .filter(Boolean)
                .map(eggToAssignment);
            if (normalized.length === count) {
                if (JSON.stringify(normalized) !== JSON.stringify(current)) {
                    setState('assignedRoutines', normalized);
                }
                return;
            }
            // Asignación determinista (1 rutina = 1 huevo; distintas mientras alcance).
            const order = shuffledEggOrder();
            const assigned = funnelState.selectedRoutines.map((_, i) => eggToAssignment(order[i % order.length]));
            setState('assignedRoutines', assigned);
        }

        function assignedRoutines() {
            ensureEggAssignment();
            return funnelState.assignedRoutines || [];
        }

        function eggForRoutine(index) {
            return assignedRoutines()[index] || EGGS[index % EGGS.length];
        }

        function answerValue(qkey) {
            return funnelState[qkey] !== undefined ? funnelState[qkey] : null;
        }

        // La app móvil consume: easy | moderate | hard. Nunca "medium".
        const DIFFICULTY_MAP = {
            easy: 'easy', low: 'easy',
            moderate: 'moderate', medium: 'moderate',
            hard: 'hard', high: 'hard'
        };

        function normalizeDifficulty(value) {
            const key = String(value || '').trim().toLowerCase();
            return DIFFICULTY_MAP[key] || 'moderate';
        }

        function normalizeDuration(value) {
            const num = typeof value === 'number' ? value : parseFloat(value);
            return Number.isFinite(num) && num > 0 ? num : DEFAULT_SUBTASK_DURATION_MINUTES;
        }

        function buildUserPlanPayload() {
            const now = new Date().toISOString();
            const tasks = funnelState.selectedTasks.map((t) => ({
                templateId: t.templateId || t.id,
                title: t.title,
                emoji: t.emoji || '',
                metric: t.metric || null,
                difficulty: normalizeDifficulty(t.difficulty),
                subtasks: (t.subtasks || []).map((s) => ({
                    title: s.title,
                    duration: normalizeDuration(s.duration)
                }))
            }));
            const routines = funnelState.selectedRoutines.map((r, i) => {
                const egg = canonicalEgg(eggForRoutine(i)) || EGGS[i % EGGS.length];
                const eggPayload = { catalogId: egg.catalogId };
                return {
                    templateId: r.templateId || r.id,
                    name: r.name || r.title,
                    days: r.days || ['daily'],
                    icon: r.icon || '',
                    tasks: (r.tasks || []).map((t) => ({
                        title: t.title,
                        position: t.position
                    })),
                    egg: eggPayload
                };
            });
            return {
                version: 1,
                answers: {
                    p1: answerValue('q1_estado_actual'),
                    p2: answerValue('q2_dolor'),
                    p3: answerValue('q3_intentos_previos'),
                    p4: answerValue('q4_causa_fracaso'),
                    p5: answerValue('q5_identidad_futura'),
                    p6: answerValue('q6_area_prioritaria'),
                    p7: answerValue('q7_compromiso'),
                    p8: answerValue('q8_tiempo_disponible'),
                    p9: answerValue('q9_listo'),
                    p10: answerValue('q10_cuando_empezar')
                },
                tasks: tasks,
                routines: routines,
                preview: {
                    interacted: !!funnelState.previewInteracted
                },
                metadata: {
                    createdAt: now,
                    source: 'website',
                    campaign: 'brainy_onboarding_v1',
                    locale: 'es-AR',
                    tasksCount: tasks.length,
                    routinesCount: routines.length,
                    totalSelectedCount: tasks.length + routines.length
                }
            };
        }

                'Nada me daba feedback ni recordaba por mí': 'Cada paso se registra solo y Brainy te recuerda por vos: el progreso nunca vuelve a depender de tu memoria.',
                'Nadie sabía que lo estaba intentando': 'Tu compañero crece con cada paso que das y te espera al otro lado: hay alguien que sí está mirando que avances.'

            const str = value === null || value === undefined ? '' : String(value);

        function hasRealPlan() {
            return !!(
                FUNNEL_CONFIG.enableBackend &&
                funnelState.planId &&
                funnelState.claimToken &&

        function ensureClientPlanKey() {
            if (funnelState.clientPlanKey) {
                return funnelState.clientPlanKey;
            }
            let key = null;
            try {
                key = localStorage.getItem(STORAGE_CLIENT_PLAN_KEY);
            } catch (e) {
                key = null;
            }
            if (!key) {
                key = (window.crypto && typeof window.crypto.randomUUID === 'function')
                    ? window.crypto.randomUUID()
                    : 'cpk-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
                try {
                    localStorage.setItem(STORAGE_CLIENT_PLAN_KEY, key);
                } catch (e) {
                    // sin localStorage: seguimos con la key en memoria
                }
            }
            setState('clientPlanKey', key);
            return key;
        }

        function resetClientPlanKey() {
            setState('clientPlanKey', null);
            try {
                localStorage.removeItem(STORAGE_CLIENT_PLAN_KEY);
            } catch (e) {
                // sin localStorage: la key en memoria ya quedó limpia
            }
        }

        function buildClaimLink(redeemUrl) {
            const token = hasRealPlan()
                ? funnelState.claimToken
                : 'demo-' + (funnelState.planId || Date.now());
            let link = `${FUNNEL_CONFIG.appDeepLinkScheme}://claim?token=${encodeURIComponent(token)}`;
            if (redeemUrl) {
                link += `&redeem_url=${encodeURIComponent(redeemUrl)}`;
            }
            const email = funnelState.email ? String(funnelState.email).trim() : '';
            if (email) {

        async function ensurePlan() {
            if (funnelState.planId && funnelState.claimToken) {
                return { planId: funnelState.planId, claimToken: funnelState.claimToken };
            }
            const plan = buildUserPlanPayload();
            const counts = {
                tasksCount: plan.metadata.tasksCount,
                routinesCount: plan.metadata.routinesCount,
                totalSelectedCount: plan.metadata.totalSelectedCount,
                campaign: plan.metadata.campaign
            };

            if (!FUNNEL_CONFIG.enableBackend || !FUNNEL_CONFIG.createPlanUrl) {
                ensureClientPlanKey();
                const demo = {
                    planId: 'demo-' + Date.now().toString(36),
                    claimToken: 'demo-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)
                };
                setState('planId', demo.planId);
                setState('claimToken', demo.claimToken);
                track('plan_created', Object.assign({ mode: 'demo' }, counts));
                return demo;
            }

            const clientPlanKey = ensureClientPlanKey();
            track('plan_generation_start', counts);
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (FUNNEL_CONFIG.anonKey) {
                    headers['apikey'] = FUNNEL_CONFIG.anonKey;
                    headers['Authorization'] = `Bearer ${FUNNEL_CONFIG.anonKey}`;
                }
                const attempt = async (key) => {
                    const res = await fetch(FUNNEL_CONFIG.createPlanUrl, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({
                            plan: plan,
                            email: funnelState.email || null,
                            marketing_opt_in: !!funnelState.marketing_optin,
                            source: 'website',
                            campaign: plan.metadata.campaign,
                            client_plan_key: key
                        })
                    });
                    let data = null;
                    try { data = await res.json(); } catch (e) { data = null; }
                    return { res, data };
                };

                let { res, data } = await attempt(clientPlanKey);

                // Plan vencido: la clave quedó quemada en una fila expired.
                // Rotamos UNA vez (nueva fila) para no bloquear el funnel.
                if (res.status === 409 && data && data.error === 'plan_expired') {
                    resetClientPlanKey();
                    const rotatedKey = ensureClientPlanKey();
                    track('plan_key_rotated', { reason: 'plan_expired' });
                    ({ res, data } = await attempt(rotatedKey));
                }

                if (!res.ok) {
                    const code = (data && data.error) || ('http_' + res.status);
                    throw new Error('create-funnel-plan ' + code);
                }
                if (!data || !data.planId || !data.claimToken) {
                    throw new Error('create-funnel-plan response inválido');
                }
                setState('planId', data.planId);
                setState('claimToken', data.claimToken);
                setState('handoffReady', false);
                track('plan_created', counts);
                return { planId: data.planId, claimToken: data.claimToken };
            } catch (err) {
                track('plan_creation_failed', { reason: (err && err.message) || 'unknown' });
                return null;
            }
        }

        function setupMethodDemo(total) {
            const pet = document.getElementById('demoPet');
            const microEls = Array.from(document.querySelectorAll('.micro'));
            const doneSet = new Set();
            let autoplay = true;

            function sync() {
                const stage = Math.min(total, doneSet.size);
                pet.setAttribute('data-stage', String(stage));
                microEls.forEach((el, i) => {
                    el.classList.toggle('done', doneSet.has(i));
                });
                if (doneSet.size >= total) {
                    clearTimers();
                }
            }

            const timer = setInterval(() => {
                if (!autoplay) {
                    return;
                }
                for (let i = 0; i < total; i++) {
                    if (!doneSet.has(i)) {
                        doneSet.add(i);
                        sync();
                        return;
                    }
                }
            }, 1000);
            stepTimers.push(timer);

            microEls.forEach((el, i) => {
                el.addEventListener('click', () => {
                    autoplay = false;
                    clearInterval(timer);
                    doneSet.add(i);
                    sync();
                });
            });

            sync();
        }

                            <div class="pv-feedback" id="pvFeedback" hidden>Pequeños pasos también cuentan.</div>

                    el.addEventListener('click', () => {

                        setTimeout(() => eggEl.classList.remove('pulse'), 900);

        function renderPresell(step) {
            track('presell_view', {
                tasksCount: funnelState.selectedTasks.length,
                routinesCount: funnelState.selectedRoutines.length,
                previewInteracted: !!funnelState.previewInteracted
            });
            window.brainyUserPlanPayload = buildUserPlanPayload();

            const objectionCopy = getObjectionCopy(funnelState.q4_causa_fracaso);
            const taskCount = funnelState.selectedTasks.length;
            const routineCount = funnelState.selectedRoutines.length;
            const eggCount = assignedRoutines().length;

            const benefits = [

                { icon: '🔁', title: 'Rutinas adaptadas a tu vida', desc: routineCount > 1 ? `${routineCount} rutinas diarias que repetís sin decidir nada cada día.` : 'Tu rutina diaria se repite solo: no tenés que decidir nada cada día.' },
                { icon: '🐣', title: 'Compañeros que evolucionan con vos', desc: eggCount === 1 ? 'Tu huevo crece con cada paso y te espera al otro lado cada día.' : `Cada rutina tiene su huevo (${eggCount}) que crece con cada paso que das.` }
            ];
            const benefitsHtml = benefits.map((b) => `
                <div class="presell-benefit">

                    <div class="presell-body">

                        <p>${b.desc}</p>

            document.getElementById('funnelRoot').innerHTML = `
                ${backButtonHtml()}
                ${cardOpen()}
                    ${headHtml(step)}
                    <div class="presell-box">
                        <div class="presell-personalized">

                            <p>${objectionCopy}</p>
                        </div>
                        ${benefitsHtml}

                    <div class="actions">

                        <p class="field-note">Sin cargos ocultos. Podés usarlo y decidir después.</p>
                    </div>
                </article>`;

            document.getElementById('nextBtn').addEventListener('click', function openPresell() {
                if (advancing) {
                    return;
                }
                this.disabled = true;
                this.textContent = 'Preparando tu plan…';
                ensurePlan().then((result) => {
                    if (result || !FUNNEL_CONFIG.enableBackend) {
                        goNext();
                    } else {
                        this.disabled = false;
                        this.textContent = step.cta;
