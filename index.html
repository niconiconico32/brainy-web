<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainy ADHD - Gamify Your Focus, Befriend Your Brain</title>
    <meta name="description" content="Meet Brainy, the ADHD companion app that turns focus into a game. Conquer paralysis, build habits with your digital pet, and reduce anxiety.">
    
    <style>
        /* Definición de la Paleta RGB del usuario */
        :root {
            --color-bg: rgb(236, 240, 237);     /* #ECF0ED - Soft White */
            --color-text: rgb(40, 13, 140);   /* #280D8C - Deep Purple */
            --color-accent: rgb(118, 99, 242); /* #7663F2 - Vibrant Purple */
            --color-dopamine: rgb(201, 253, 90);/* #C9FD5A - Dopamine Lime */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        a {
            text-decoration: none;
            transition: all 0.2s ease;
        }

        /* Utilidades */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn-dopamine {
            background-color: var(--color-dopamine);
            color: var(--color-text);
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            box-shadow: 0 4px 14px rgba(201, 253, 90, 0.4);
        }

        .btn-dopamine:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 253, 90, 0.6);
        }

        /* --- Header --- */
        header {
            padding: 20px 0;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--color-text);
        }

        .logo span {
            color: var(--color-accent);
        }

        .top-nav {
            display: flex;
            gap: 24px;
            align-items: center;
            list-style: none;
        }

        .top-nav a {
            color: var(--color-text);
            font-weight: 700;
            opacity: 0.85;
        }

        .top-nav a:hover {
            opacity: 1;
            color: var(--color-accent);
        }

        /* --- Hero Section --- */
        .hero {
            padding: 150px 0 100px 0;
            min-height: 80vh;
            display: flex;
            align-items: center;
            position: relative;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            word-break: balance;
        }

        .hero-text p {
            font-size: 1.3rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .hero-mockup {
            text-align: center;
        }

        .hero-logo {
            width: 100%;
            height: 400px;
            object-fit: contain;
            display: block;
        }

        /* --- Store Badges --- */
        .store-badges {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }

        .store-badge img {
            height: 45px;
            width: auto;
        }

        /* --- Features/Benefits Section --- */
        .benefits {
            background-color: var(--color-accent);
            color: white;
            padding: 100px 0;
            border-radius: 50px;
            margin: 0 20px;
        }

        .benefits h2 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 60px;
        }

        .benefits h2 span {
            color: var(--color-dopamine);
        }

        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .benefit-card {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .benefit-card:hover {
            transform: translateY(-5px);
            background-color: rgba(255, 255, 255, 0.15);
        }

        .benefit-icon {
            margin-bottom: 20px;
            display: inline-flex;
            width: 72px;
            height: 72px;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background-color: rgba(255, 255, 255, 0.16);
        }

        .benefit-icon img {
            width: 56px;
            height: 56px;
        }

        .benefit-card h3 {
            color: var(--color-dopamine);
            margin-bottom: 15px;
        }

        /* --- CTA Final --- */
        .final-cta {
            padding: 100px 0;
            text-align: center;
        }

        .final-cta h2 {
            font-size: 2.8rem;
            margin-bottom: 1.5rem;
        }

        /* --- Footer --- */
        footer {
            background-color: var(--color-text);
            color: rgba(255,255,255,0.8);
            padding: 50px 0;
            font-size: 0.9rem;
        }

        .footer-content {
            text-align: center;
        }

        .footer-links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .footer-links a {
            color: white;
            opacity: 0.7;
        }

        .footer-links a:hover {
            opacity: 1;
            color: var(--color-dopamine);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .hero-text h1 {
                font-size: 3rem;
            }

            .hero-logo {
                height: 340px;
            }
        }

        @media (max-width: 900px) {
            .nav-content {
                flex-direction: column;
                gap: 12px;
            }

            .top-nav {
                justify-content: center;
                flex-wrap: wrap;
            }

            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 30px;
            }

            .hero-text h1 {
                font-size: 2.8rem;
            }

            .hero-mockup {
                max-width: 360px;
                margin: 0 auto;
            }

            .hero-logo {
                height: 300px;
            }

            .store-badges {
                justify-content: center;
            }

            .benefits {
                border-radius: 30px;
                margin: 0 14px;
                padding: 80px 0;
            }

            .benefits h2 {
                font-size: 2.1rem;
                margin-bottom: 40px;
            }

            .benefit-card {
                padding: 30px;
            }

            .final-cta {
                padding: 80px 0;
            }
        }

        @media (max-width: 600px) {
            .hero {
                min-height: auto;
                padding: 110px 0 60px;
            }

            .hero-content {
                gap: 18px;
            }

            .hero-text h1 {
                font-size: 2.15rem;
                line-height: 1.15;
            }

            .hero-text p {
                font-size: 1.08rem;
                margin-bottom: 2rem;
            }

            .top-nav {
                gap: 16px;
            }

            .hero-logo {
                height: 240px;
            }

            .store-badge img {
                height: 40px;
            }

            .benefits {
                border-radius: 24px;
                margin: 0 10px;
                padding: 64px 0;
            }

            .benefits-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .benefit-card {
                padding: 24px;
            }

            .final-cta h2 {
                font-size: 2.1rem;
            }

            .footer-links {
                gap: 20px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="container hero-content">
            <div class="hero-text">
                <h1>Stop ADHD Paralysis. <br>Start <span>Doing</span>.</h1>
                <p>Meet Brainy, the companion that turns tedious tasks into a rewarding game. Built for brains that work differently.</p>
                
                <div class="store-badges">
                    <a href="https://apps.apple.com/py/app/brainy-adhd-tasks-and-habits/id6761862417" class="store-badge"><img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&amp;releaseDate=1276556400&h=7e68c7300c3b885237b6c7a98d36b412" alt="Download on the App Store"></a>
                    <a href="https://play.google.com/store/apps/details?id=com.brainyahdh.app" class="store-badge"><img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" style="height: 64px; margin-top: -10px;"></a>
                </div>
            </div>
            
            <div class="hero-mockup">
                <img src="assets/logomain.png" alt="Brainy logo" class="hero-logo">
            </div>
        </div>
    </section>


    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Disorder Apps.com. All rights reserved.</p>
            <div class="footer-links">
                <a href="support.html">Support</a>
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
            </div>
        </div>
    </footer>

</body>
</html>
